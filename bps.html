<html lang="id">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--navy:#0A1628;--deep:#122240;--slate:#1B3A5C;--ocean:#1565A0;--sky:#2196F3;--cyan:#26C6DA;--gold:#F5A623;--amber:#FF8F00;--coral:#EF5350;--mint:#66BB6A;--purple:#7E57C2;--surface:#F4F7FC;--card:#FFFFFF;--border:#E2E8F0;--text:#1E293B;--sub:#64748B;--muted:#94A3B8;--radius:12px;--shadow:0 1px 3px rgba(10,22,40,.06),0 4px 12px rgba(10,22,40,.04)}
*{margin:0;padding:0;box-sizing:border-box}html{font-size:15px}body{font-family:'Inter',system-ui,sans-serif;background:var(--surface);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,var(--navy) 0%,var(--slate) 50%,var(--ocean) 100%);position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-50%;left:-20%;width:140%;height:200%;background:radial-gradient(ellipse at 30% 80%,rgba(33,150,243,.12) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(38,198,218,.08) 0%,transparent 50%);pointer-events:none}
.hi{max-width:1440px;margin:0 auto;padding:1.4rem 2rem 0;position:relative;z-index:1}
.ht{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.hb h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.45rem;color:#fff;letter-spacing:-0.02em;line-height:1.2}
.hb h1 span{display:block;font-weight:500;font-size:.78rem;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.hb .bm{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:2px;display:block}
.hb .ba{font-size:.58rem;font-weight:400;letter-spacing:.04em;color:rgba(255,255,255,.22);margin-top:2px;display:block;text-transform:none;font-family:'Inter',sans-serif}
.cb{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:.75rem;font-weight:500;padding:.3rem .7rem;border-radius:99px;font-family:'JetBrains Mono',monospace}
.st{display:flex;gap:0;margin-top:1.2rem}.stb{padding:.6rem 1.3rem;font-size:.8rem;font-weight:600;color:rgba(255,255,255,.4);border-radius:var(--radius) var(--radius) 0 0;cursor:pointer;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif;text-decoration:none}.stb.active{background:var(--surface);color:var(--ocean);cursor:default}.stb.disabled{opacity:.4;cursor:default}.stb.disabled::after{content:'Segera';font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--gold);color:var(--navy);padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:middle}
.sub-tabs{display:flex;gap:2px;background:var(--card);border-bottom:1.5px solid var(--border);max-width:1440px;margin:0 auto;padding:0 2rem}
.stab{padding:.7rem 1.2rem;font-size:.8rem;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s;font-family:'Plus Jakarta Sans',sans-serif}.stab:hover{color:var(--text)}.stab.active{color:var(--ocean);border-bottom-color:var(--ocean)}
.main{max-width:1440px;margin:0 auto;padding:1.5rem 2rem 3rem}
.controls{display:flex;align-items:center;gap:.7rem;margin-bottom:1.4rem;flex-wrap:wrap}
.cg{display:flex;align-items:center;gap:.35rem}.cg label{font-size:.72rem;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}.cg select{font-family:'Inter',sans-serif;font-size:.82rem;font-weight:500;padding:.38rem .65rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;outline:none}
.spacer{flex:1}
.tbtn{font-family:'Inter',sans-serif;font-size:.78rem;font-weight:600;padding:.4rem .9rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--sub);cursor:pointer;transition:all .2s}.tbtn.active{background:var(--ocean);border-color:var(--ocean);color:#fff}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-bottom:1.4rem}
.kc{background:var(--card);border-radius:var(--radius);padding:1rem 1.1rem;box-shadow:var(--shadow);border:1px solid var(--border);position:relative;overflow:hidden}.kc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kc.cg1::before{background:var(--mint)}.kc.cr::before{background:var(--coral)}.kc.cb2::before{background:var(--sky)}.kc.cgo::before{background:var(--gold)}.kc.cp::before{background:var(--purple)}.kc.cc::before{background:var(--cyan)}
.kl{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin-bottom:.4rem}
.kv{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.45rem;font-weight:800;letter-spacing:-0.03em;color:var(--text);line-height:1.1}.kv .u{font-size:.65rem;font-weight:600;color:var(--sub);margin-left:2px}
.ks{display:flex;align-items:center;gap:.5rem;margin-top:.4rem;font-size:.7rem;color:var(--sub);flex-wrap:wrap}
.kpa{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted)}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.4rem}
.panel{background:var(--card);border-radius:var(--radius);padding:1.2rem;box-shadow:var(--shadow);border:1px solid var(--border)}
.pt{font-family:'Plus Jakarta Sans',sans-serif;font-size:.85rem;font-weight:700;color:var(--text);margin-bottom:.9rem}
.ps{font-size:.72rem;color:var(--sub);margin-top:-.5rem;margin-bottom:.9rem}
.pf{grid-column:1/-1}
.cw{position:relative;width:100%}.cw canvas{width:100%!important}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.dt{width:100%;border-collapse:collapse;font-size:.76rem}
table.dt thead th{font-family:'Plus Jakarta Sans',sans-serif;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);padding:.55rem .6rem;text-align:right;border-bottom:2px solid var(--border);white-space:nowrap}table.dt thead th:first-child{text-align:left}
table.dt tbody td{padding:.5rem .6rem;text-align:right;font-family:'JetBrains Mono',monospace;font-size:.74rem;border-bottom:1px solid var(--border);white-space:nowrap}table.dt tbody td:first-child{text-align:left;font-family:'Inter',sans-serif;font-weight:500;color:var(--text)}
table.dt tbody tr:hover{background:#F8FAFD}
.mc{height:400px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.ml{display:flex;align-items:center;gap:.5rem;margin-top:.6rem;font-size:.68rem;color:var(--sub)}.ml .lb{display:flex;height:10px;border-radius:3px;overflow:hidden;flex:1;max-width:180px}.ml .lb span{flex:1}
.leaflet-popup-content-wrapper{border-radius:10px!important;font-family:'Inter',sans-serif;font-size:.78rem}.leaflet-popup-content{margin:10px 14px!important}
.ppt{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.82rem;margin-bottom:5px}.ppr{display:flex;justify-content:space-between;gap:1rem;padding:2px 0;font-size:.73rem}.ppr .pl2{color:var(--sub)}.ppr .pv2{font-family:'JetBrains Mono',monospace;font-weight:600}
.insight{background:linear-gradient(135deg,#EBF5FF,#F0F7FF);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.2rem;margin-bottom:1rem;font-size:.8rem;color:var(--slate);line-height:1.6}.insight strong{color:var(--text)}
.footer{max-width:1440px;margin:0 auto;padding:1rem 2rem;text-align:center;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border)}
.loading{display:flex;align-items:center;justify-content:center;min-height:50vh;gap:.7rem;color:var(--sub);font-weight:500}
.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--ocean);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.errmsg{background:#FFF3F3;border:1px solid #FECACA;border-radius:var(--radius);padding:1.5rem;text-align:center;color:var(--coral);font-weight:500;margin:2rem}
@media(max-width:900px){.panels{grid-template-columns:1fr}.main{padding:1rem}.hi{padding:1rem 1rem 0}.sub-tabs{padding:0 1rem}.mc{height:300px}}
@media(max-width:600px){html{font-size:14px}.kg{grid-template-columns:1fr 1fr}.kv{font-size:1.2rem}.hb h1{font-size:1.15rem}.stab{padding:.6rem .7rem;font-size:.73rem}}
</style>
</head>
<body>
<header class="header"><div class="hi"><div class="ht">
<div class="hb"><h1><span class="bm">BAILEO</span><span>Kanwil DJPb Provinsi Maluku</span>Dashboard Kewilayahan Data Provinsi Maluku<span class="ba">Bingkai Analitik Interaktif Laporan Ekonomi Operasional</span></h1></div>
<div><span class="cb" id="cutoffBadge">—</span></div>
</div><div class="st">
<a href="djpb.html" class="stb">DJPb</a>
<div class="stb active">BPS</div>
<div class="stb disabled">Bank Indonesia</div>
</div></div></header>
<nav class="sub-tabs" id="subTabs"></nav>
<main class="main" id="mainContent"><div class="loading"><div class="spinner"></div><span>Memuat data…</span></div></main>
<footer class="footer"><a href="index.html" style="color:var(--ocean);text-decoration:none">← Beranda</a> · Sumber data: DJPb · BPS · Bank Indonesia</footer>

<script>
const FILES={pdrb:'data/bps/pdrb.csv',penduduk:'data/bps/penduduk.csv',kemiskinan:'data/bps/kemiskinan.csv',ipm:'data/bps/ipm.csv',pengangguran:'data/bps/pengangguran.csv',gini:'data/bps/gini.csv',apbd:'data/djpb/apbd.csv',geo:'data/geo/maluku.geojson'};
const KAB_PAL=['#2196F3','#EF5350','#66BB6A','#F5A623','#7E57C2','#26C6DA','#FF7043','#8D6E63','#78909C','#EC407A','#1B3A5C'];
function b2a(n){return n==='Ambon'?'Kota Ambon':n==='Tual'?'Kota Tual':'Kabupaten '+n;}
function pdrbAnnual(q1){return q1*4;}

let D={pdrb:[],penduduk:[],kemiskinan:[],ipm:[],pengangguran:[],gini:[],apbd:[],geo:null};
let tab='profil',analM=null,analCmpMove=false,apbdM=null;
let charts={},lmap=null,glayer=null;

async function fcsv(p){const r=await fetch(p);if(!r.ok)throw new Error(p);return Papa.parse((await r.text()).trim(),{header:true,skipEmptyLines:true,dynamicTyping:false,delimitersToGuess:[',',';','\t','|']}).data;}
async function loadAll(){
  try{
    const[p,pop,k,ipm,ng,gi,ab,geo]=await Promise.all([fcsv(FILES.pdrb).catch(()=>[]),fcsv(FILES.penduduk).catch(()=>[]),fcsv(FILES.kemiskinan).catch(()=>[]),fcsv(FILES.ipm).catch(()=>[]),fcsv(FILES.pengangguran).catch(()=>[]),fcsv(FILES.gini).catch(()=>[]),fcsv(FILES.apbd).catch(()=>[]),fetch(FILES.geo).then(r=>r.ok?r.json():null).catch(()=>null)]);
    D.pdrb=p.map(r=>({kk:r.kab_kota.trim(),adhb:+r.pdrb_adhb_q1||0,qtq:+r.growth_qtq_q1||0}));
    D.penduduk=pop.map(r=>({kk:r.kab_kota.trim(),p24:+r.pop_2024||0,p25:+r.pop_2025||0,p26:+r.pop_2026||0}));
    D.kemiskinan=k.map(r=>({kk:r.kab_kota.trim(),m23:+r.miskin_2023||0,m24:+r.miskin_2024||0,m25:+r.miskin_2025||0}));
    D.ipm=ipm.map(r=>({kk:r.kab_kota.trim(),i23:+r.ipm_2023||0,i24:+r.ipm_2024||0,i25:+r.ipm_2025||0}));
    D.pengangguran=ng.map(r=>({kk:r.kab_kota.trim(),pg23:+r.pengangguran_2023||0,pg24:+r.pengangguran_2024||0,pg25:+r.pengangguran_2025||0}));
    D.gini=gi.map(r=>({kk:r.kab_kota.trim(),g23:+r.gini_2023||0,g24:+r.gini_2024||0,g25:+r.gini_2025||0}));
    D.apbd=ab.filter(r=>r.thang).map(r=>({thn:+r.thang,bln:+r.bulan,pemda:r.nama_pemda.trim(),pendapatan:+r.pendapatan||0,belanja:+r.belanja||0,silpa:+r.SILPA||0}));
    if(D.apbd.length){apbdM=Math.max(...D.apbd.map(r=>r.bln));analM=apbdM;}
    D.geo=geo;render();
  }catch(e){document.getElementById('mainContent').innerHTML='<div class="errmsg">Gagal memuat: '+e.message+'</div>';}
}

function fmt(n){if(Math.abs(n)>=1e12)return(n/1e12).toFixed(2);if(Math.abs(n)>=1e9)return(n/1e9).toFixed(2);if(Math.abs(n)>=1e6)return(n/1e6).toFixed(1);return n.toLocaleString('id-ID');}
function fU(n){if(Math.abs(n)>=1e12)return'T';if(Math.abs(n)>=1e9)return'M';if(Math.abs(n)>=1e6)return'Jt';return'';}
function bpsLookup(kk,arr,field){const r=arr.find(x=>x.kk===kk);return r?r[field]:null;}
function dC(){Object.values(charts).forEach(c=>c.destroy());charts={};}
function dM(){if(lmap){lmap.remove();lmap=null;glayer=null;}}
function cCol(v,mn,mx){if(v==null)return'#E2E8F0';const t=mx===mn?.5:Math.max(0,Math.min(1,(v-mn)/(mx-mn)));const cs=[[227,242,253],[66,165,245],[21,101,192]];const i=t<.5?0:1,lt=t<.5?t*2:(t-.5)*2;return`rgb(${Math.round(cs[i][0]+(cs[i+1][0]-cs[i][0])*lt)},${Math.round(cs[i][1]+(cs[i+1][1]-cs[i][1])*lt)},${Math.round(cs[i][2]+(cs[i+1][2]-cs[i][2])*lt)})`;}
const BLN_F=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

const TABS=[{id:'profil',l:'Profil Wilayah'},{id:'analisis',l:'Analisis'}];
function render(){dC();dM();document.getElementById('cutoffBadge').textContent='BAILEO';document.getElementById('subTabs').innerHTML=TABS.map(t=>'<div class="stab'+(t.id===tab?' active':'')+'" data-tab="'+t.id+'">'+t.l+'</div>').join('');const main=document.getElementById('mainContent');if(tab==='profil'){main.innerHTML=renderProfil();drawProfil();initMap('mapBPS',bpsMapStyle,bpsPopup);}else{main.innerHTML=renderAnalisis();drawAnalisis();initMap('mapFull',fullMapStyle,fullPopup);}bindEvents();}

// ═══ PROFIL ═══
function renderProfil(){if(!D.pdrb.length&&!D.ipm.length)return'<div class="errmsg">Data BPS tidak ditemukan</div>';const avgIPM=D.ipm.length?(D.ipm.reduce((s,r)=>s+r.i25,0)/D.ipm.length).toFixed(2):'-';const avgMiskin=D.kemiskinan.length?(D.kemiskinan.reduce((s,r)=>s+r.m25,0)/D.kemiskinan.length).toFixed(2):'-';const totPDRB=D.pdrb.reduce((s,r)=>s+r.adhb,0);const totPop=D.penduduk.reduce((s,r)=>s+r.p26,0);const pdrbPCA=totPop?(pdrbAnnual(totPDRB)/totPop*1e9/1e6).toFixed(1):'-';
return`<div><p style="font-size:.72rem;color:var(--sub);margin-bottom:1rem"><em>PDRB: Q1 2026 (estimasi setahun = Q1 × 4). IPM, Kemiskinan, Gini, Pengangguran: 2025.</em></p>
<div class="kg"><div class="kc cp"><div class="kl">IPM Rata-rata 2025</div><div class="kv">${avgIPM}</div></div><div class="kc cr"><div class="kl">Kemiskinan Rata-rata 2025</div><div class="kv">${avgMiskin}<span class="u">%</span></div></div><div class="kc cb2"><div class="kl">PDRB Q1 2026</div><div class="kv">${(totPDRB/1e3).toFixed(2)}<span class="u">T</span></div><div class="ks"><span class="kpa">Estimasi setahun: ${(pdrbAnnual(totPDRB)/1e3).toFixed(1)}T</span></div></div><div class="kc cgo"><div class="kl">PDRB/Kap Setahun</div><div class="kv">${pdrbPCA}<span class="u">Jt</span></div></div><div class="kc cg1"><div class="kl">Penduduk 2026</div><div class="kv">${(totPop/1e6).toFixed(2)}<span class="u">Jt</span></div></div></div>
<div class="panels"><div class="panel"><div class="pt">PDRB Q1 2026 & PDRB/Kap Setahun</div><div class="cw"><canvas id="cPDRB" height="340"></canvas></div></div><div class="panel"><div class="pt">Peta IPM 2025</div><div id="mapBPS" class="mc"></div><div class="ml"><span>Rendah</span><div class="lb"><span style="background:#FFCDD2"></span><span style="background:#FFF9C4"></span><span style="background:#C8E6C9"></span></div><span>Tinggi</span></div></div></div>
<div class="panels"><div class="panel"><div class="pt">IPM 2025 vs Kemiskinan 2025</div><div class="cw"><canvas id="cIPMvsMiskin" height="280"></canvas></div></div><div class="panel"><div class="pt">Tren Kemiskinan 2023–2025</div><div class="cw"><canvas id="cMiskinTrend" height="280"></canvas></div></div></div>
<div class="panel pf"><div class="pt">Profil Kab/Kota</div><div class="tw">${bpsTbl()}</div></div></div>`;}
function bpsTbl(){let h='<table class="dt"><thead><tr><th>Kab/Kota</th><th>Penduduk</th><th>PDRB Q1 (M)</th><th>PDRB/Kap (Jt)</th><th>IPM</th><th>Miskin %</th><th>Gini</th><th>Pengangguran</th></tr></thead><tbody>';[...D.pdrb].sort((a,b)=>b.adhb-a.adhb).forEach(r=>{const pop=bpsLookup(r.kk,D.penduduk,'p26')||1;const pcA=pdrbAnnual(r.adhb)/pop*1e9/1e6;const ipm=bpsLookup(r.kk,D.ipm,'i25');const mis=bpsLookup(r.kk,D.kemiskinan,'m25');const gi=bpsLookup(r.kk,D.gini,'g25');const pg=bpsLookup(r.kk,D.pengangguran,'pg25');h+='<tr><td>'+r.kk+'</td><td>'+pop.toLocaleString('id-ID')+'</td><td>'+r.adhb.toFixed(2)+'</td><td>'+pcA.toFixed(1)+'</td><td>'+(ipm?ipm.toFixed(2):'—')+'</td><td style="color:'+(mis>20?'var(--coral)':mis>15?'var(--amber)':'var(--mint)')+'">'+(mis?mis.toFixed(2)+'%':'—')+'</td><td>'+(gi?gi.toFixed(3):'—')+'</td><td>'+(pg?pg.toLocaleString('id-ID'):'—')+'</td></tr>';});return h+'</tbody></table>';}
function drawProfil(){const sorted=[...D.pdrb].sort((a,b)=>b.adhb-a.adhb);const labels=sorted.map(r=>r.kk.replace('Kepulauan ','Kep. '));const pcData=sorted.map(r=>{const pop=bpsLookup(r.kk,D.penduduk,'p26')||1;return pdrbAnnual(r.adhb)/pop*1e9/1e6;});
charts.pdrb=new Chart(document.getElementById('cPDRB'),{type:'bar',data:{labels,datasets:[{label:'PDRB Q1 (Miliar)',data:sorted.map(r=>r.adhb),backgroundColor:'#2196F3',borderRadius:4,barPercentage:.6,yAxisID:'y'},{label:'PDRB/Kap Setahun (Jt)',data:pcData,type:'line',borderColor:'#F5A623',backgroundColor:'#F5A62333',pointRadius:5,borderWidth:2.5,yAxisID:'y1',tension:.3}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{position:'top',labels:{font:{size:10},usePointStyle:true,padding:12}}},scales:{y:{ticks:{font:{size:8}},grid:{display:false}},x:{ticks:{font:{family:'JetBrains Mono',size:9}},grid:{color:'#F1F5F9'}},y1:{position:'top',ticks:{font:{family:'JetBrains Mono',size:8},callback:v=>v.toFixed(0)+'Jt'},grid:{display:false}}}}});
const scD=D.ipm.map(r=>({x:r.i25,y:bpsLookup(r.kk,D.kemiskinan,'m25')||0,l:r.kk})).filter(d=>d.y>0);
charts.ipmMis=new Chart(document.getElementById('cIPMvsMiskin'),{type:'scatter',data:{datasets:[{data:scD.map(d=>({x:d.x,y:d.y})),backgroundColor:scD.map(d=>d.y>20?'#EF5350':d.y>15?'#FF8F00':'#66BB6A'),pointRadius:8,pointHoverRadius:11}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>scD[items[0].dataIndex].l,label:ctx=>'IPM: '+scD[ctx.dataIndex].x.toFixed(2)+' | Miskin: '+scD[ctx.dataIndex].y.toFixed(2)+'%'}}},scales:{x:{title:{display:true,text:'IPM',font:{size:10,weight:'600'},color:'#64748B'},grid:{color:'#F1F5F9'}},y:{title:{display:true,text:'Kemiskinan (%)',font:{size:10,weight:'600'},color:'#64748B'},grid:{color:'#F1F5F9'},ticks:{callback:v=>v+'%'}}}}});
const kks=D.kemiskinan.map(r=>r.kk);charts.misTrend=new Chart(document.getElementById('cMiskinTrend'),{type:'line',data:{labels:['2023','2024','2025'],datasets:kks.map((k,i)=>({label:k.replace('Kepulauan ','Kep. '),data:[bpsLookup(k,D.kemiskinan,'m23'),bpsLookup(k,D.kemiskinan,'m24'),bpsLookup(k,D.kemiskinan,'m25')],borderColor:KAB_PAL[i%KAB_PAL.length],tension:.3,pointRadius:4,borderWidth:2,fill:false}))},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{font:{size:8},usePointStyle:true,boxWidth:8,padding:8}},tooltip:{mode:'index',intersect:false}},scales:{x:{grid:{display:false}},y:{grid:{color:'#F1F5F9'},ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v+'%'}}}}});}
function bpsMapStyle(f){const w=f.properties.WADMKK;const kk=w.startsWith('Kota')?w.replace('Kota ',''):w;const r=D.ipm.find(x=>x.kk===kk);const v=r?r.i25:null;if(!v)return{fillColor:'#E2E8F0',weight:1.5,color:'#fff',fillOpacity:.7};const mn=60,mx=85;const t=Math.max(0,Math.min(1,(v-mn)/(mx-mn)));const col=t<.33?`rgb(239,${83+t*3*100},80)`:t<.66?`rgb(255,235,59)`:`rgb(${102-t*60},187,106)`;return{fillColor:col,weight:1.5,color:'#fff',fillOpacity:.75};}
function bpsPopup(f){const w=f.properties.WADMKK;const kk=w.startsWith('Kota')?w.replace('Kota ',''):w;const ipm=D.ipm.find(x=>x.kk===kk);const mis=D.kemiskinan.find(x=>x.kk===kk);const pop=D.penduduk.find(x=>x.kk===kk);let h='<div class="ppt">'+w+'</div>';if(ipm)h+='<div class="ppr"><span class="pl2">IPM</span><span class="pv2">'+ipm.i25.toFixed(2)+'</span></div>';if(mis)h+='<div class="ppr"><span class="pl2">Miskin</span><span class="pv2" style="color:'+(mis.m25>20?'var(--coral)':'var(--mint)')+'">'+mis.m25.toFixed(2)+'%</span></div>';if(pop)h+='<div class="ppr"><span class="pl2">Penduduk</span><span class="pv2">'+pop.p26.toLocaleString()+'</span></div>';return h;}

// ═══ ANALISIS (cross DJPb × BPS) ═══
function renderAnalisis(){if(!D.pdrb.length||!D.apbd.length)return'<div class="errmsg">Data BPS + APBD diperlukan</div>';const mos=[...new Set(D.apbd.map(r=>r.bln))].sort((a,b)=>a-b);const curM=analM||apbdM;const cross=buildCross(curM);const avgBPCA=cross.reduce((s,r)=>s+r.belPCA,0)/cross.length;const hmLB=cross.filter(r=>r.mis>20&&r.belPCA<avgBPCA);const topPCA=[...cross].sort((a,b)=>b.pdrbPCA-a.pdrbPCA);let ins='';if(hmLB.length)ins+=`<strong>${hmLB.map(r=>r.kk).join(', ')}</strong> kemiskinan >20% namun belanja/kap di bawah rata-rata. `;ins+=`PDRB/kap tertinggi: <strong>${topPCA[0].kk}</strong> (Rp ${(topPCA[0].pdrbPCA/1e6).toFixed(1)} Jt), terendah: <strong>${topPCA[topPCA.length-1].kk}</strong> (Rp ${(topPCA[topPCA.length-1].pdrbPCA/1e6).toFixed(1)} Jt).`;
return`<div><div class="controls"><div class="cg"><label>s.d.</label><select id="sAnalM">${mos.map(m=>'<option value="'+m+'"'+(m===curM?' selected':'')+'>'+BLN_F[m]+'</option>').join('')}</select></div><div class="spacer"></div><button class="tbtn ${analCmpMove?'active':''}" id="bMove"${curM<=1?' disabled':''}>⇄ Pergerakan vs Bulan Lalu</button></div>
<div class="insight">${ins}</div>
<div class="panels"><div class="panel"><div class="pt">Belanja/Kap ${BLN_F[curM]} vs Kemiskinan${analCmpMove?' — dgn Pergerakan':''}</div><div class="ps">Belanja disetahunkan (YTD × 12/bulan) — estimasi kasar</div><div class="cw"><canvas id="cBelPC" height="300"></canvas></div></div><div class="panel"><div class="pt">Peta Belanja per Kapita</div><div id="mapFull" class="mc"></div><div class="ml"><span>Rendah</span><div class="lb"><span style="background:#E3F2FD"></span><span style="background:#42A5F5"></span><span style="background:#1565C0"></span></div><span>Tinggi</span></div></div></div>
<div class="panels"><div class="panel"><div class="pt">Rasio Belanja / PDRB${analCmpMove?' — dgn Bulan Lalu':''}</div><div class="ps">Keduanya disetahunkan (estimasi kasar)</div><div class="cw"><canvas id="cBelPDRB" height="300"></canvas></div></div><div class="panel"><div class="pt">PDRB/Kap vs IPM 2025</div><div class="cw"><canvas id="cPCvsIPM" height="300"></canvas></div></div></div>
<div class="panel pf"><div class="pt">Tabel Lintas Data</div><div class="tw">${crossTbl(buildCross(curM))}</div></div></div>`;}
function buildCross(m){const c=D.apbd.filter(r=>r.bln===m&&!r.pemda.startsWith('Provinsi'));return D.pdrb.map(r=>{const apem=b2a(r.kk),arw=c.find(x=>x.pemda===apem);const pop=bpsLookup(r.kk,D.penduduk,'p26')||1;const ipm=bpsLookup(r.kk,D.ipm,'i25')||0;const mis=bpsLookup(r.kk,D.kemiskinan,'m25')||0;const gi=bpsLookup(r.kk,D.gini,'g25')||0;const bel=arw?arw.belanja:0;const belA=m?bel/m*12:bel,pdrbA=pdrbAnnual(r.adhb);return{kk:r.kk,pdrbA,ipm,mis,gi,belA,belPCA:belA/pop,pdrbPCA:pdrbA/pop*1e9,belPDRB:pdrbA>0?belA/1e9/pdrbA*100:0,pop};}).sort((a,b)=>b.pdrbA-a.pdrbA);}
function crossTbl(cross){let h='<table class="dt"><thead><tr><th>Kab/Kota</th><th>Penduduk</th><th>PDRB/Kap (Jt)</th><th>Bel/Kap (Jt)</th><th>Bel/PDRB</th><th>IPM</th><th>Miskin</th><th>Gini</th></tr></thead><tbody>';cross.forEach(r=>{h+='<tr><td>'+r.kk+'</td><td>'+r.pop.toLocaleString('id-ID')+'</td><td>'+(r.pdrbPCA/1e6).toFixed(1)+'</td><td>'+(r.belPCA/1e6).toFixed(2)+'</td><td>'+r.belPDRB.toFixed(1)+'%</td><td>'+r.ipm.toFixed(2)+'</td><td style="color:'+(r.mis>20?'var(--coral)':'var(--mint)')+'">'+r.mis.toFixed(2)+'%</td><td>'+r.gi.toFixed(3)+'</td></tr>';});return h+'</tbody></table>';}
function drawAnalisis(){const curM=analM||apbdM;const cross=buildCross(curM);const crossPrev=analCmpMove&&curM>1?buildCross(curM-1):null;const avgBPCA=cross.reduce((s,r)=>s+r.belPCA,0)/cross.length;
const curColors=cross.map(r=>r.mis>20&&r.belPCA<avgBPCA?'#EF5350':'#2196F3');const dsBP=[{type:'scatter',label:'Saat ini',data:cross.map(r=>({x:r.belPCA/1e6,y:r.mis})),backgroundColor:curColors,pointRadius:8,pointHoverRadius:11,borderColor:curColors,borderWidth:1}];
if(crossPrev){dsBP.push({type:'scatter',label:'Bulan Lalu',data:crossPrev.map(r=>({x:r.belPCA/1e6,y:r.mis})),backgroundColor:'transparent',borderColor:'#94A3B8',borderWidth:1.5,pointRadius:5,pointStyle:'circle'});cross.forEach(s=>{const p=crossPrev.find(x=>x.kk===s.kk);if(p)dsBP.push({type:'line',label:'__mv__'+s.kk,data:[{x:p.belPCA/1e6,y:p.mis},{x:s.belPCA/1e6,y:s.mis}],showLine:true,borderColor:'rgba(148,163,184,.5)',borderWidth:1,borderDash:[3,3],pointRadius:0});});}
charts.belPC=new Chart(document.getElementById('cBelPC'),{data:{datasets:dsBP},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{filter:i=>!i.text?.startsWith('__mv__'),font:{size:10},usePointStyle:true,padding:12}},tooltip:{filter:it=>!it.dataset.label?.startsWith('__mv__'),callbacks:{title:items=>{const isC=items[0].datasetIndex===0;const arr=isC?cross:crossPrev;return(isC?'':'[Lalu] ')+arr[items[0].dataIndex].kk;},label:ctx=>{const isC=ctx.datasetIndex===0;const arr=isC?cross:crossPrev;return'Bel/Kap: Rp '+(arr[ctx.dataIndex].belPCA/1e6).toFixed(2)+' Jt · Miskin: '+arr[ctx.dataIndex].mis.toFixed(2)+'%';}}}},scales:{x:{title:{display:true,text:'Belanja per Kapita Setahun (Juta Rp)',font:{size:10,weight:'600'},color:'#64748B'},grid:{color:'#F1F5F9'}},y:{title:{display:true,text:'Kemiskinan (%)',font:{size:10,weight:'600'},color:'#64748B'},grid:{color:'#F1F5F9'},ticks:{callback:v=>v+'%'}}}}});
const sorted=[...cross].sort((a,b)=>b.belPDRB-a.belPDRB);const dsBPDRB=[{data:sorted.map(r=>r.belPDRB),backgroundColor:sorted.map(r=>r.belPDRB>10?'#2196F3':r.belPDRB>5?'#66BB6A':'#FF8F00'),borderRadius:4,barPercentage:.7,label:'Saat ini'}];if(crossPrev){const pm={};crossPrev.forEach(r=>{pm[r.kk]=r.belPDRB;});dsBPDRB.push({data:sorted.map(r=>pm[r.kk]||0),backgroundColor:'rgba(148,163,184,.35)',borderRadius:4,barPercentage:.7,label:'Bulan Lalu'});}
charts.belPDRB=new Chart(document.getElementById('cBelPDRB'),{type:'bar',data:{labels:sorted.map(r=>r.kk.replace('Kepulauan ','Kep. ')),datasets:dsBPDRB},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:!!crossPrev,labels:{font:{size:10},usePointStyle:true,padding:12}},tooltip:{callbacks:{title:items=>sorted[items[0].dataIndex].kk,label:c=>c.dataset.label+': '+c.parsed.x.toFixed(1)+'%'}}},scales:{y:{ticks:{font:{size:9}},grid:{display:false}},x:{grid:{color:'#F1F5F9'},ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v+'%'}}}}});
charts.pcVsIpm=new Chart(document.getElementById('cPCvsIPM'),{type:'scatter',data:{datasets:[{data:cross.map(r=>({x:r.pdrbPCA/1e6,y:r.ipm})),backgroundColor:cross.map(r=>r.ipm>=75?'#2E7D32':r.ipm>=70?'#66BB6A':r.ipm>=65?'#FF8F00':'#EF5350'),pointRadius:8,pointHoverRadius:11}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>cross[items[0].dataIndex].kk,label:ctx=>'PDRB/Kap: Rp '+(cross[ctx.dataIndex].pdrbPCA/1e6).toFixed(1)+' Jt · IPM: '+cross[ctx.dataIndex].ipm.toFixed(2)}}},scales:{x:{title:{display:true,text:'PDRB per Kapita Setahun (Juta Rp)',font:{size:10,weight:'600'},color:'#64748B'},grid:{color:'#F1F5F9'}},y:{title:{display:true,text:'IPM 2025',font:{size:10,weight:'600'},color:'#64748B'},grid:{color:'#F1F5F9'}}}}});}
function fullMapStyle(f){const curM=analM||apbdM;const c=D.apbd.filter(r=>r.bln===curM&&!r.pemda.startsWith('Provinsi'));const cross=D.pdrb.map(r=>{const pop=bpsLookup(r.kk,D.penduduk,'p26')||1;const arw=c.find(x=>x.pemda===b2a(r.kk));return{kk:r.kk,v:arw?(arw.belanja/curM*12)/pop:0};});const vals=cross.map(r=>r.v);const mn=Math.min(...vals),mx=Math.max(...vals);const kk=f.properties.WADMKK.startsWith('Kota')?f.properties.WADMKK.replace('Kota ',''):f.properties.WADMKK;const r=cross.find(x=>x.kk===kk);return{fillColor:cCol(r?r.v:0,mn,mx),weight:1.5,color:'#fff',fillOpacity:.8};}
function fullPopup(f){const curM=analM||apbdM;const w=f.properties.WADMKK;const kk=w.startsWith('Kota')?w.replace('Kota ',''):w;const c=D.apbd.filter(r=>r.bln===curM&&!r.pemda.startsWith('Provinsi'));const arw=c.find(x=>x.pemda===b2a(kk));const pop=D.penduduk.find(x=>x.kk===kk);const pd=D.pdrb.find(x=>x.kk===kk);let h='<div class="ppt">'+w+'</div>';if(arw&&pop)h+='<div class="ppr"><span class="pl2">Bel/Kap</span><span class="pv2">Rp '+((arw.belanja/curM*12)/pop.p26/1e6).toFixed(2)+' Jt</span></div>';if(pd&&pop)h+='<div class="ppr"><span class="pl2">PDRB/Kap</span><span class="pv2">Rp '+(pdrbAnnual(pd.adhb)/pop.p26*1e9/1e6).toFixed(1)+' Jt</span></div>';return h;}

// ═══ MAP ═══
function initMap(id,styleFn,popupFn){if(!D.geo||!document.getElementById(id))return;lmap=L.map(id,{scrollWheelZoom:false}).setView([-3.7,128.2],6);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{attribution:'©CartoDB',maxZoom:12}).addTo(lmap);glayer=L.geoJSON(D.geo,{style:styleFn,onEachFeature:(f,layer)=>{layer.bindPopup(popupFn(f));layer.on('mouseover',()=>layer.setStyle({weight:3,color:'#1565C0',fillOpacity:.9}));layer.on('mouseout',()=>glayer.resetStyle(layer));}}).addTo(lmap);lmap.fitBounds(glayer.getBounds().pad(0.05));}

// ═══ EVENTS ═══
function bindEvents(){const sAnalM=document.getElementById('sAnalM'),bMove=document.getElementById('bMove');if(sAnalM)sAnalM.onchange=e=>{analM=+e.target.value;render();};if(bMove)bMove.onclick=()=>{analCmpMove=!analCmpMove;render();};}
document.getElementById('subTabs').addEventListener('click',e=>{const t=e.target.dataset?.tab;if(t){tab=t;render();}});
loadAll();
</script>
</body>
</html>
