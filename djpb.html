<style>

.kc.cg1::before{background:var(--mint)}.kc.cr::before{background:var(--coral)}.kc.cb2::before{background:var(--sky)}.kc.cgo::before{background:var(--gold)}.kc.cp::before{background:var(--purple)}.kc.cc::before{background:var(--cyan)}
.kl{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin-bottom:.4rem}

table.dt tbody td{padding:.5rem .6rem;text-align:right;font-family:'JetBrains Mono',monospace;font-size:.74rem;border-bottom:1px solid var(--border);white-space:nowrap}table.dt tbody td:first-child{text-align:left;font-family:'Inter',sans-serif;font-weight:500;color:var(--text)}

table.dt tbody tr:hover{background:#F8FAFD}
.bc{display:flex;align-items:center;gap:.4rem;justify-content:flex-end}.bt{width:50px;height:5px;background:var(--surface);border-radius:3px;overflow:hidden;flex-shrink:0}.bf{height:100%;border-radius:3px;transition:width .4s ease}

.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--ocean);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

.inflasi-latest{display:flex;flex-wrap:wrap;gap:.8rem;margin-bottom:1.4rem}
.ic{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.65rem .9rem;box-shadow:var(--shadow);min-width:125px}.ic .il{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);margin-bottom:.25rem}.ic .iv{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.2rem;font-weight:800}.ic .im{font-size:.68rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-top:.15rem}
.mc{height:400px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}

.leaflet-popup-content-wrapper{border-radius:10px!important;font-family:'Inter',sans-serif;font-size:.78rem}.leaflet-popup-content{margin:10px 14px!important}
.ppt{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.82rem;margin-bottom:5px}.ppr{display:flex;justify-content:space-between;gap:1rem;padding:2px 0;font-size:.73rem}.ppr .pl2{color:var(--sub)}.ppr .pv2{font-family:'JetBrains Mono',monospace;font-weight:600}
.insight{background:linear-gradient(135deg,#EBF5FF,#F0F7FF);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.2rem;margin-bottom:1rem;font-size:.8rem;color:var(--slate);line-height:1.6}.insight strong{color:var(--text)}
.sbw{display:flex;align-items:center;gap:.5rem;margin:.2rem 0}.sbt{flex:1;height:7px;background:var(--surface);border-radius:4px;overflow:hidden;max-width:110px}.sbf{height:100%;border-radius:4px}.sv{font-family:'JetBrains Mono',monospace;font-size:.76rem;font-weight:700;min-width:32px}

<body>
<header class="header"><div class="hi"><div class="ht">
<div class="hb"><h1><span class="bm">BAILEO</span><span>Kanwil DJPb Provinsi Maluku</span>Dashboard Kewilayahan Data Provinsi Maluku<span class="ba">Bingkai Analitik Interaktif Laporan Ekonomi Operasional</span></h1></div>
<div><span class="cb" id="cutoffBadge">—</span></div>
</div><div class="st">
<div class="stb active">DJPb</div>
<a href="bps.html" class="stb">BPS</a>
<div class="stb disabled">Bank Indonesia</div>
</div></div></header>
<nav class="sub-tabs" id="subTabs"></nav>
<main class="main" id="mainContent"><div class="loading"><div class="spinner"></div><span>Memuat data…</span></div></main>
<footer class="footer"><a href="index.html" style="color:var(--ocean);text-decoration:none">← Beranda</a> · Sumber data: DJPb · BPS · Bank Indonesia</footer>

<script>
// ═══ CONFIG ═══
const FILES={apbn:'data/djpb/apbn.csv',apbd:'data/djpb/apbd.csv',inflasi:'data/djpb/inflasi.csv',kur:'data/djpb/kur.csv',geo:'data/geo/maluku.geojson'};
const BI_TARGET_LOW=1.5,BI_TARGET_HIGH=3.5;
const WEIGHT_SCHEMES={equal:[33.34,33.33,33.33],absorption:[50,25,25],efficiency:[25,50,25],stability:[25,25,50]};
const KOMP={p_pajak_dn:{l:'Pajak Dalam Negeri',g:'pendapatan',o:1},p_pajak_ln:{l:'Pajak Perdagangan Intl.',g:'pendapatan',o:2},p_pnbp_lain:{l:'PNBP Lainnya',g:'pendapatan',o:3},p_blu:{l:'Pendapatan BLU',g:'pendapatan',o:4},b_pegawai:{l:'Belanja Pegawai',g:'belanja',o:5},b_barang:{l:'Belanja Barang',g:'belanja',o:6},b_modal:{l:'Belanja Modal',g:'belanja',o:7},b_bansos:{l:'Bantuan Sosial',g:'belanja',o:8},b_dbh:{l:'Dana Bagi Hasil',g:'tkdd',o:9},b_dakfisik:{l:'DAK Fisik',g:'tkdd',o:10},b_daknonfisik:{l:'DAK Non Fisik',g:'tkdd',o:11},b_dau:{l:'Dana Alokasi Umum',g:'tkdd',o:12},b_infis:{l:'Dana Insentif Daerah',g:'tkdd',o:13},b_danadesa:{l:'Dana Desa',g:'tkdd',o:14}};
const GRP={pendapatan:'Pendapatan Negara',belanja:'Belanja K/L',tkdd:'Transfer ke Daerah & Dana Desa'};
const GC={pendapatan:{bar:'#66BB6A'},belanja:{bar:'#EF5350'},tkdd:{bar:'#2196F3'}};
const BLN=['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
const BLN_F=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const LOC_C={'Ambon':'#2196F3','Tual':'#EF5350','Maluku':'#1B3A5C','MalukuTengah':'#7E57C2','Nasional':'#94A3B8'};
const LOC_L={'Ambon':'Kota Ambon','Tual':'Kota Tual','Maluku':'Prov. Maluku','MalukuTengah':'Maluku Tengah','Nasional':'Nasional'};
const KAB_PAL=['#2196F3','#EF5350','#66BB6A','#F5A623','#7E57C2','#26C6DA','#FF7043','#8D6E63','#78909C','#EC407A','#1B3A5C'];
const KOMP_PALETTES={pendapatan:['#2E7D32','#66BB6A','#A5D6A7','#C8E6C9'],belanja:['#C62828','#EF5350','#EF9A9A','#FFCDD2'],tkdd:['#0D47A1','#1976D2','#42A5F5','#64B5F6','#90CAF9','#BBDEFB']};
function w2a(w){return w.startsWith('Kota')?w:'Kabupaten '+w;}
const PEMDA_INF={'Kota Ambon':'Ambon','Kota Tual':'Tual','Kabupaten Maluku Tengah':'MalukuTengah'};
// KUR wilayah → APBD pemda mapping
function kurWil2pemda(w){if(w.startsWith('Kota'))return w;return w.replace('Kab. ','Kabupaten ');}

// ═══ STATE ═══
let D={apbn:[],apbd:[],inflasi:[],kur:[],geo:null};
let tab='apbn',apbnY,apbnM,apbnCmp='',apbnKomp='',apbdM,apbdMetric='pendapatan',apbdGrp='',apbdCmp='',analM=null,analCmpMove=false,infRange=24,infLocs=['Maluku','Ambon','Tual','MalukuTengah','Nasional'];
let kurYearFrom=null,kurYearTo=null,kurSkema='',kurSektor='',kurWilayah='';
let charts={},lmap=null,glayer=null;

// ═══ LOAD ═══
async function fcsv(p){const r=await fetch(p);if(!r.ok)throw new Error(p);return Papa.parse((await r.text()).trim(),{header:true,skipEmptyLines:true,dynamicTyping:false,delimitersToGuess:[',',';','\t','|']}).data;}
function parseNum(s){if(!s||s==='-'||s.trim()==='-')return 0;return parseFloat(s.replace(/,/g,'').replace(/\s/g,''))||0;}

async function loadAll(){
  try{
    const[a,b,c,k,geo]=await Promise.all([
      fcsv(FILES.apbn).catch(()=>[]),fcsv(FILES.apbd).catch(()=>[]),fcsv(FILES.inflasi).catch(()=>[]),
      fcsv(FILES.kur).catch(()=>[]),
      fetch(FILES.geo).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    D.apbn=a.filter(r=>r.thang&&r.komp_ang).map(r=>({thn:+r.thang,bln:+r.bulan,cut:r.tgl_cutoff,kode:r.komp_ang.trim(),pagu:+r.pagu_target||0,real:+r.realisasi||0}));
    D.apbd=b.filter(r=>r.thang).map(r=>({thn:+r.thang,bln:+r.bulan,cut:r.tgl_cutoff,pemda:r.nama_pemda.trim(),pendapatan:+r.pendapatan||0,belanja:+r.belanja||0,pembiayaan:+r.pembiayaan||0,silpa:+r.SILPA||0}));
    D.inflasi=c.filter(r=>r.waktu).map(r=>({waktu:r.waktu.trim(),loc:r.nama_pemda.trim(),mom:r.inflasi_bulanan!==''&&r.inflasi_bulanan!=null?+r.inflasi_bulanan:null,yoy:r.inflasi_tahunan!==''&&r.inflasi_tahunan!=null?+r.inflasi_tahunan:null}));
    // KUR: parse Indonesian number format
    D.kur=k.filter(r=>r.Tahun||r.TAHUN).map(r=>({
      thn:+(r.Tahun||r.TAHUN),bln:+(r.BULAN||r.Bulan)||0,
      bank:(r.NAMA_BANK||r.nama_bank||'').trim(),
      skema:(r.NAMA_SKEMA||r.nama_skema||'').trim(),
      sektor:(r.NAMA_SEKTOR||r.nama_sektor||'').trim(),
      wilayah:(r.NAMA_WILAYAH||r.nama_wilayah||'').trim(),
      debitur:parseNum(r.JML_DEBITUR||r.jml_debitur),
      penyaluran:parseNum(r.JML_PENYALURAN||r.jml_penyaluran||r[' JML_PENYALURAN ']),
      outstanding:parseNum(r.JML_OUTSTANDING||r.jml_outstanding||r[' JML_OUTSTANDING '])
    }));
    D.geo=geo;
    if(D.apbn.length){const yrs=[...new Set(D.apbn.map(r=>r.thn))].sort((a,b)=>b-a);apbnY=yrs[0];apbnM=Math.max(...D.apbn.filter(r=>r.thn===apbnY).map(r=>r.bln));}
    if(D.apbd.length){apbdM=Math.max(...D.apbd.map(r=>r.bln));analM=apbdM;}
    if(D.kur.length){const yrs=[...new Set(D.kur.map(r=>r.thn))].sort((a,b)=>b-a);kurYear=yrs[0];}
    render();
  }catch(e){document.getElementById('mainContent').innerHTML='<div class="errmsg">Gagal memuat: '+e.message+'</div>';}
}

// ═══ HELPERS ═══
function fmt(n){if(Math.abs(n)>=1e12)return(n/1e12).toFixed(2);if(Math.abs(n)>=1e9)return(n/1e9).toFixed(2);if(Math.abs(n)>=1e6)return(n/1e6).toFixed(1);return n.toLocaleString('id-ID');}
function fU(n){if(Math.abs(n)>=1e12)return'T';if(Math.abs(n)>=1e9)return'M';if(Math.abs(n)>=1e6)return'Jt';return'';}
function fM(n){return'Rp '+(n/1e9).toFixed(2)+' M';}
function pCl(p){return p<20?'pl':p<50?'pm':'ph';}
function bCo(p){return p<20?'#FF8F00':p<50?'#2196F3':'#66BB6A';}
function gf(t,b){return D.apbn.filter(r=>r.thn===t&&r.bln===b);}
function sg(rows,g){return rows.filter(r=>KOMP[r.kode]&&KOMP[r.kode].g===g).reduce((a,r)=>({pagu:a.pagu+r.pagu,real:a.real+r.real}),{pagu:0,real:0});}
function dC(){Object.values(charts).forEach(c=>c.destroy());charts={};}
function dM(){if(lmap){lmap.remove();lmap=null;glayer=null;}}
function cCol(v,mn,mx){if(v==null)return'#E2E8F0';const t=mx===mn?.5:Math.max(0,Math.min(1,(v-mn)/(mx-mn)));const cs=[[227,242,253],[66,165,245],[21,101,192]];const i=t<.5?0:1,lt=t<.5?t*2:(t-.5)*2;return`rgb(${Math.round(cs[i][0]+(cs[i+1][0]-cs[i][0])*lt)},${Math.round(cs[i][1]+(cs[i+1][1]-cs[i][1])*lt)},${Math.round(cs[i][2]+(cs[i+1][2]-cs[i][2])*lt)})`;}
function sCol(s){return s>=70?'#2E7D32':s>=50?'#66BB6A':s>=30?'#FF8F00':'#C62828';}
function getInf(loc){const rows=D.inflasi.filter(r=>r.loc===loc&&r.yoy!==null).sort((a,b)=>a.waktu.localeCompare(b.waktu));return rows.length?rows[rows.length-1].yoy:null;}

// ═══ TABS & RENDER ═══
const TABS=[{id:'apbn',l:'APBN'},{id:'apbd',l:'APBD'},{id:'inflasi',l:'Inflasi'},{id:'kur',l:'KUR'},{id:'analisis',l:'Analisis'}];
function render(){
  dC();dM();
  document.getElementById('subTabs').innerHTML=TABS.map(t=>'<div class="stab'+(t.id===tab?' active':'')+'" data-tab="'+t.id+'">'+t.l+'</div>').join('');
  document.getElementById('cutoffBadge').textContent='BAILEO';
  const main=document.getElementById('mainContent');
  if(tab==='apbn')main.innerHTML=renderAPBN();
  else if(tab==='apbd')main.innerHTML=renderAPBD();
  else if(tab==='inflasi')main.innerHTML=renderInflasi();
  else if(tab==='kur')main.innerHTML=renderKUR();
  else main.innerHTML=renderAnalisis();
  bindEvents();bindCharts();
}
function bindCharts(){

function mkKpi(t,d,pv,cmpAvail,cls){const pc=d.pagu?(d.real/d.pagu*100):0;let y='';if(cmpAvail&&pv.real){const df=(d.real-pv.real)/pv.real*100;const lbl=apbnCmp==='mom'?'MoM':'YoY';y='<span class="yoy '+(df>=0?'yu':'yd')+'">'+(df>=0?'▲':'▼')+' '+Math.abs(df).toFixed(1)+'% '+lbl+'</span>';}return'<div class="kc '+cls+'"><div class="kl">'+t+'</div><div class="kv">'+fmt(d.real)+'<span class="u">'+fU(d.real)+'</span></div><div class="ks"><span class="kpa">Pagu: '+fmt(d.pagu)+fU(d.pagu)+'</span><span class="kpe '+pCl(pc)+'">'+pc.toFixed(1)+'%</span>'+y+'</div></div>';}
function apbnTbl(c,pv,cmpAvail){const gs=['pendapatan','belanja','tkdd'];const cmpLbl=apbnCmp==='mom'?'Bulan Lalu':(apbnY-1);let h='<table class="dt"><thead><tr><th>Komponen</th><th>Pagu</th><th>Realisasi</th><th>%</th>'+(cmpAvail?'<th>Real '+cmpLbl+'</th><th>Δ</th>':'')+'<th style="width:70px"></th></tr></thead><tbody>';for(const g of gs){const gt=sg(c,g),gp=sg(pv,g),gpc=gt.pagu?(gt.real/gt.pagu*100):0;h+='<tr class="grp"><td>'+GRP[g]+'</td><td>'+(gt.pagu/1e9).toFixed(2)+'</td><td>'+(gt.real/1e9).toFixed(2)+'</td><td><span class="kpe '+pCl(gpc)+'">'+gpc.toFixed(1)+'%</span></td>'+(cmpAvail?'<td>'+(gp.real/1e9).toFixed(2)+'</td><td>'+(gp.real?((gt.real-gp.real)/gp.real*100).toFixed(1)+'%':'—')+'</td>':'')+'<td><div class="bc"><div class="bt"><div class="bf" style="width:'+Math.min(gpc,100)+'%;background:'+GC[g].bar+'"></div></div></div></td></tr>';Object.entries(KOMP).filter(([,v])=>v.g===g).sort((a,b)=>a[1].o-b[1].o).forEach(([k,m])=>{const rw=c.find(r=>r.kode===k);if(!rw)return;const pc=rw.pagu?(rw.real/rw.pagu*100):0,pr=pv.find(r=>r.kode===k);h+='<tr><td style="padding-left:1.4rem">'+m.l+'</td><td>'+(rw.pagu/1e9).toFixed(2)+'</td><td>'+(rw.real/1e9).toFixed(2)+'</td><td><span class="kpe '+pCl(pc)+'">'+pc.toFixed(1)+'%</span></td>'+(cmpAvail?'<td>'+(pr?(pr.real/1e9).toFixed(2):'—')+'</td><td>'+(pr&&pr.real?((rw.real-pr.real)/pr.real*100).toFixed(1)+'%':'—')+'</td>':'')+'<td><div class="bc"><div class="bt"><div class="bf" style="width:'+Math.min(pc,100)+'%;background:'+bCo(pc)+'"></div></div></div></td></tr>';});}return h+'</tbody></table>';}
function drawAPBN(){const c=gf(apbnY,apbnM);let compEntries=Object.entries(KOMP);if(apbnKomp)compEntries=compEntries.filter(([,v])=>v.g===apbnKomp);const compsSorted=apbnKomp?compEntries.sort((a,b)=>{const rA=c.find(x=>x.kode===a[0]),rB=c.find(x=>x.kode===b[0]);return(rB?.pagu||0)-(rA?.pagu||0);}):compEntries.sort((a,b)=>{const gO={pendapatan:1,belanja:2,tkdd:3};if(gO[a[1].g]!==gO[b[1].g])return gO[a[1].g]-gO[b[1].g];const rA=c.find(x=>x.kode===a[0]),rB=c.find(x=>x.kode===b[0]);return(rB?.pagu||0)-(rA?.pagu||0);});
const realPct=compsSorted.map(([k])=>{const r=c.find(x=>x.kode===k);return r&&r.pagu>0?Math.min(r.real/r.pagu*100,100):0;});const actualPct=compsSorted.map(([k])=>{const r=c.find(x=>x.kode===k);return r&&r.pagu>0?r.real/r.pagu*100:0;});const sisaPct=realPct.map(v=>100-v);const barColors=compsSorted.map(([,v])=>GC[v.g].bar);

let donutLabels,donutData,donutColors;if(apbnKomp){const pal=KOMP_PALETTES[apbnKomp];const kig=Object.entries(KOMP).filter(([,v])=>v.g===apbnKomp).sort((a,b)=>a[1].o-b[1].o);donutLabels=kig.map(([,v])=>v.l);donutData=kig.map(([k])=>{const r=c.find(x=>x.kode===k);return r?r.real/1e9:0;});donutColors=kig.map((_,i)=>pal[i%pal.length]);}else{const gs=['pendapatan','belanja','tkdd'];donutLabels=gs.map(g=>GRP[g]);donutData=gs.map(g=>sg(c,g).real/1e9);donutColors=gs.map(g=>GC[g].bar);}
charts.donut=new Chart(document.getElementById('cDonut'),{type:'doughnut',data:{labels:donutLabels,datasets:[{data:donutData,backgroundColor:donutColors,borderWidth:2,borderColor:'#fff',hoverOffset:8}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{font:{size:10},usePointStyle:true,padding:12}},tooltip:{callbacks:{label:c=>c.label+': Rp '+c.parsed.toFixed(2)+' M'}}}}});
const gs=['pendapatan','belanja','tkdd'];const aM=[...new Set(D.apbn.filter(r=>r.thn===apbnY).map(r=>r.bln))].sort((a,b)=>a-b),ds=gs.map(g=>({label:GRP[g],data:aM.map(m=>sg(gf(apbnY,m),g).real/1e9),borderColor:GC[g].bar,backgroundColor:GC[g].bar+'18',fill:true,tension:.35,pointRadius:4,borderWidth:2.5}));if(apbnCmp==='yoy'){const py=apbnY-1,pm=[...new Set(D.apbn.filter(r=>r.thn===py).map(r=>r.bln))];gs.forEach(g=>{ds.push({label:GRP[g]+' ('+py+')',data:aM.map(m=>pm.includes(m)?sg(gf(py,m),g).real/1e9:null),borderColor:GC[g].bar+'55',borderDash:[6,4],fill:false,tension:.35,pointRadius:3,borderWidth:2});});}

function renderAPBD(){if(!D.apbd.length)return'<div class="errmsg">apbd.csv tidak ditemukan</div>';const mos=[...new Set(D.apbd.map(r=>r.bln))].sort((a,b)=>a-b);const grpFilter=r=>{if(!apbdGrp)return true;if(apbdGrp==='provinsi')return r.pemda.startsWith('Provinsi');if(apbdGrp==='kabupaten')return r.pemda.startsWith('Kabupaten');if(apbdGrp==='kota')return r.pemda.startsWith('Kota');return true;};const c=D.apbd.filter(r=>r.bln===apbdM).filter(grpFilter);const tP=c.reduce((s,r)=>s+r.pendapatan,0),tB=c.reduce((s,r)=>s+r.belanja,0),tS=c.reduce((s,r)=>s+r.silpa,0);let pv=[];if(apbdCmp==='mom'&&apbdM>1)pv=D.apbd.filter(r=>r.bln===apbdM-1).filter(grpFilter);const pvP=pv.reduce((s,r)=>s+r.pendapatan,0),pvB=pv.reduce((s,r)=>s+r.belanja,0),pvS=pv.reduce((s,r)=>s+r.silpa,0);const cmpAvail=apbdCmp==='mom'&&apbdM>1;function delta(cur,prev){if(!cmpAvail||!prev)return'';const df=(cur-prev)/Math.abs(prev)*100;return'<span class="yoy '+(df>=0?'yu':'yd')+'">'+(df>=0?'▲':'▼')+' '+Math.abs(df).toFixed(1)+'%</span>';}const grpLbl=!apbdGrp?'Semua Pemda':apbdGrp==='provinsi'?'Provinsi':apbdGrp==='kabupaten'?'10 Kabupaten':'2 Kota';
return`<div><div class="controls"><div class="cg"><label>s.d.</label><select id="sMa">${mos.map(m=>'<option value="'+m+'"'+(m===apbdM?' selected':'')+'>'+BLN_F[m]+'</option>').join('')}</select></div><div class="cg"><label>Kelompok</label><select id="sGrp"><option value=""${!apbdGrp?' selected':''}>Semua</option><option value="provinsi"${apbdGrp==='provinsi'?' selected':''}>Provinsi</option><option value="kabupaten"${apbdGrp==='kabupaten'?' selected':''}>Kabupaten</option><option value="kota"${apbdGrp==='kota'?' selected':''}>Kota</option></select></div><div class="cg"><label>Bandingkan</label><select id="sACmp"><option value=""${!apbdCmp?' selected':''}>Tidak</option><option value="mom"${apbdCmp==='mom'?' selected':''}>vs Bulan Lalu</option></select></div><div class="spacer"></div><div class="cg"><label>Peta</label><select id="sMe"><option value="pendapatan"${apbdMetric==='pendapatan'?' selected':''}>Pendapatan</option><option value="belanja"${apbdMetric==='belanja'?' selected':''}>Belanja</option><option value="silpa"${apbdMetric==='silpa'?' selected':''}>SILPA</option></select></div></div>
<div class="kg"><div class="kc cg1"><div class="kl">Pendapatan (${grpLbl})</div><div class="kv">${fmt(tP)}<span class="u">${fU(tP)}</span></div><div class="ks">${delta(tP,pvP)}</div></div><div class="kc cr"><div class="kl">Belanja (${grpLbl})</div><div class="kv">${fmt(tB)}<span class="u">${fU(tB)}</span></div><div class="ks">${delta(tB,pvB)}</div></div><div class="kc cb2"><div class="kl">SILPA (${grpLbl})</div><div class="kv">${fmt(tS)}<span class="u">${fU(tS)}</span></div><div class="ks"><span class="kpa">${tS>=0?'Surplus':'Defisit'}</span>${delta(tS,pvS)}</div></div></div>
<div class="panels"><div class="panel"><div class="pt">Pendapatan vs Belanja${apbdGrp?' — '+grpLbl:''}</div><div class="cw"><canvas id="cApbd" height="340"></canvas></div></div><div class="panel"><div class="pt">Peta ${apbdMetric}</div><div id="mapApbd" class="mc"></div><div class="ml"><span>Rendah</span><div class="lb"><span style="background:#E3F2FD"></span><span style="background:#42A5F5"></span><span style="background:#1565C0"></span></div><span>Tinggi</span></div></div></div>
<div class="panel pf"><div class="pt">Rincian APBD${apbdGrp?' — '+grpLbl:''}</div><div class="tw">${apbdTbl(c)}</div></div></div>`;}
function apbdTbl(rows){const sorted=[...rows].sort((a,b)=>a.pemda.startsWith('Provinsi')?-1:b.pemda.startsWith('Provinsi')?1:b.pendapatan-a.pendapatan);let h='<table class="dt"><thead><tr><th>Pemda</th><th>Pendapatan</th><th>Belanja</th><th>Pembiayaan</th><th>SILPA</th></tr></thead><tbody>';sorted.forEach(r=>{h+='<tr'+(r.pemda.startsWith('Provinsi')?' class="grp"':'')+'><td>'+r.pemda+'</td><td>'+(r.pendapatan/1e9).toFixed(2)+'</td><td>'+(r.belanja/1e9).toFixed(2)+'</td><td>'+(r.pembiayaan/1e9).toFixed(2)+'</td><td style="color:'+(r.silpa>=0?'var(--mint)':'var(--coral)')+'">'+(r.silpa/1e9).toFixed(2)+'</td></tr>';});return h+'</tbody></table>';}
function drawAPBD(){const grpFilter=r=>{if(!apbdGrp)return true;if(apbdGrp==='provinsi')return r.pemda.startsWith('Provinsi');if(apbdGrp==='kabupaten')return r.pemda.startsWith('Kabupaten');if(apbdGrp==='kota')return r.pemda.startsWith('Kota');return true;};const c=D.apbd.filter(r=>r.bln===apbdM).filter(grpFilter).sort((a,b)=>a.pemda.startsWith('Provinsi')?-1:b.pemda.startsWith('Provinsi')?1:b.pendapatan-a.pendapatan);charts.apbd=new Chart(document.getElementById('cApbd'),{type:'bar',data:{labels:c.map(r=>r.pemda.replace('Kabupaten ','Kab. ')),datasets:[{label:'Pendapatan',data:c.map(r=>r.pendapatan/1e9),backgroundColor:'#66BB6A',borderRadius:4,barPercentage:.7},{label:'Belanja',data:c.map(r=>r.belanja/1e9),backgroundColor:'#EF5350',borderRadius:4,barPercentage:.7}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{position:'top',labels:{font:{size:10},usePointStyle:true,padding:12}},tooltip:{callbacks:{label:c=>c.dataset.label+': Rp '+c.parsed.x.toFixed(2)+' M'}}},scales:{y:{ticks:{font:{size:9}},grid:{display:false}},x:{ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v.toLocaleString()},grid:{color:'#F1F5F9'}}}}});}
function apbdMapStyle(f){const c=D.apbd.filter(r=>r.bln===apbdM&&!r.pemda.startsWith('Provinsi'));const vals=c.map(r=>r[apbdMetric]||0);const mn=Math.min(...vals),mx=Math.max(...vals);const p=w2a(f.properties.WADMKK);const row=c.find(r=>r.pemda===p);return{fillColor:cCol(row?row[apbdMetric]||0:0,mn,mx),weight:1.5,color:'#fff',fillOpacity:.8};}
function apbdPopup(f){const p=w2a(f.properties.WADMKK);const r=D.apbd.filter(x=>x.bln===apbdM).find(x=>x.pemda===p);let h='<div class="ppt">'+f.properties.WADMKK+'</div>';if(r){h+='<div class="ppr"><span class="pl2">Pendapatan</span><span class="pv2">'+(r.pendapatan/1e9).toFixed(2)+' M</span></div><div class="ppr"><span class="pl2">Belanja</span><span class="pv2">'+(r.belanja/1e9).toFixed(2)+' M</span></div><div class="ppr"><span class="pl2">SILPA</span><span class="pv2" style="color:'+(r.silpa>=0?'var(--mint)':'var(--coral)')+'">'+(r.silpa/1e9).toFixed(2)+' M</span></div>';}return h;}

function kurFiltered(){let d=D.kur;if(kurYearFrom)d=d.filter(r=>r.thn>=kurYearFrom);if(kurYearTo)d=d.filter(r=>r.thn<=kurYearTo);if(kurSkema)d=d.filter(r=>r.skema===kurSkema);if(kurSektor)d=d.filter(r=>r.sektor===kurSektor);if(kurWilayah)d=d.filter(r=>r.wilayah===kurWilayah);return d;}
function kurByWilayah(d){const map={};d.forEach(r=>{const w=r.wilayah;if(!map[w])map[w]={wilayah:w,debitur:0,penyaluran:0,outstanding:0};map[w].debitur+=r.debitur;map[w].penyaluran+=r.penyaluran;map[w].outstanding+=r.outstanding;});return Object.values(map).sort((a,b)=>b.penyaluran-a.penyaluran);}

    <div class="cg"><label>Sektor</label><select id="sKurSe"><option value="">Semua</option>${sektors.map(s=>'<option value="'+s+'"'+(kurSektor===s?' selected':'')+'>'+s.substring(0,30)+'</option>').join('')}</select></div>

  <div class="panel pf"><div class="pt">Rincian per Kab/Kota</div><div class="tw">${kurTbl(kurByWilayah(d))}</div></div></div>`;}
function kurTbl(rows){let h='<table class="dt"><thead><tr><th>Wilayah</th><th>Debitur</th><th>Penyaluran</th><th>Outstanding</th><th>Rata-rata/Debitur</th></tr></thead><tbody>';rows.forEach(r=>{h+='<tr><td>'+r.wilayah+'</td><td>'+r.debitur.toLocaleString('id-ID')+'</td><td>'+(r.penyaluran/1e9).toFixed(2)+' M</td><td>'+(r.outstanding/1e9).toFixed(2)+' M</td><td>'+(r.debitur?fmt(r.penyaluran/r.debitur)+fU(r.penyaluran/r.debitur):'—')+'</td></tr>';});const tP=rows.reduce((s,r)=>s+r.penyaluran,0),tD=rows.reduce((s,r)=>s+r.debitur,0),tO=rows.reduce((s,r)=>s+r.outstanding,0);h+='<tr class="grp"><td>Total</td><td>'+tD.toLocaleString('id-ID')+'</td><td>'+(tP/1e9).toFixed(2)+' M</td><td>'+(tO/1e9).toFixed(2)+' M</td><td>'+(tD?fmt(tP/tD)+fU(tP/tD):'—')+'</td></tr>';return h+'</tbody></table>';}

const bySektor={};d.forEach(r=>{if(!bySektor[r.sektor])bySektor[r.sektor]=0;bySektor[r.sektor]+=r.penyaluran;});const seLabels=Object.keys(bySektor).sort((a,b)=>bySektor[b]-bySektor[a]).slice(0,5);charts.kurSektor=new Chart(document.getElementById('cKurSektor'),{type:'bar',data:{labels:seLabels.map(s=>s.length>25?s.substring(0,25)+'…':s),datasets:[{data:seLabels.map(s=>bySektor[s]/1e9),backgroundColor:KAB_PAL.slice(0,5),borderRadius:4,barPercentage:.65}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>seLabels[items[0].dataIndex],label:c=>'Rp '+c.parsed.x.toFixed(2)+' M'}}},scales:{y:{ticks:{font:{size:8}},grid:{display:false}},x:{ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v.toLocaleString()},grid:{color:'#F1F5F9'}}}}});}

function kurPopup(f){const d=kurFiltered();const byW=kurByWilayah(d);const w=f.properties.WADMKK;const wn=w.startsWith('Kota')?w:'Kab. '+w;const row=byW.find(r=>r.wilayah===wn||r.wilayah===w);let h='<div class="ppt">'+w+'</div>';if(row){h+='<div class="ppr"><span class="pl2">Penyaluran</span><span class="pv2">'+(row.penyaluran/1e9).toFixed(2)+' M</span></div><div class="ppr"><span class="pl2">Debitur</span><span class="pv2">'+row.debitur.toLocaleString()+'</span></div>';}else h+='<div style="color:var(--muted);font-size:.75rem">Belum ada data KUR</div>';return h;}

function computeScores(month){const m=month||analM||apbdM;const c=D.apbd.filter(r=>r.bln===m&&!r.pemda.startsWith('Provinsi'));const malI=getInf('Maluku');return c.map(r=>{const rb=r.pendapatan>0?Math.min(r.belanja/r.pendapatan,1.5):0;const sB_raw=Math.min(rb/0.8,1);const sr=r.pendapatan>0?Math.abs(r.silpa)/r.pendapatan:1;const sS_raw=Math.max(0,1-sr);const lk=PEMDA_INF[r.pemda];const li=lk?getInf(lk):malI;let dev=2;if(li!==null){if(li<BI_TARGET_LOW)dev=BI_TARGET_LOW-li;else if(li>BI_TARGET_HIGH)dev=li-BI_TARGET_HIGH;else dev=0;}const sI_raw=Math.max(0,1-dev/3);const scores={};for(const[name,w]of Object.entries(WEIGHT_SCHEMES)){scores[name]=sB_raw*w[0]+sS_raw*w[1]+sI_raw*w[2];}const vals=Object.values(scores);return{pemda:r.pemda,skor:Math.round(scores.equal),scoreMin:Math.round(Math.min(...vals)),scoreMax:Math.round(Math.max(...vals)),sB_pct:Math.round(sB_raw*100),sS_pct:Math.round(sS_raw*100),sI_pct:Math.round(sI_raw*100),pendapatan:r.pendapatan,belanja:r.belanja,silpa:r.silpa,rb,sr,inflasi:li,dev};}).sort((a,b)=>b.skor-a.skor);}
function renderAnalisis(){if(!D.apbd.length)return'<div class="errmsg">Data APBD diperlukan</div>';const mos=[...new Set(D.apbd.map(r=>r.bln))].sort((a,b)=>a-b);const curM=analM||apbdM;const sc=computeScores(curM);const scPrev=analCmpMove&&curM>1?computeScores(curM-1):null;const best=sc[0],worst=sc[sc.length-1];let ins=`<strong>${best.pemda.replace('Kabupaten ','Kab. ')}</strong> menempati posisi teratas (${best.skor}/100), <strong>${worst.pemda.replace('Kabupaten ','Kab. ')}</strong> terendah (${worst.skor}/100). `;const hs=sc.filter(s=>s.sr>.7).map(s=>s.pemda.replace('Kabupaten ','Kab. '));if(hs.length)ins+=`SILPA relatif paling tinggi vs peers: <strong>${hs.join(', ')}</strong>.`;
return`<div><div class="controls"><div class="cg"><label>s.d.</label><select id="sAnalM">${mos.map(m=>'<option value="'+m+'"'+(m===curM?' selected':'')+'>'+BLN_F[m]+'</option>').join('')}</select></div><div class="spacer"></div><button class="tbtn ${analCmpMove?'active':''}" id="bMove"${curM<=1?' disabled':''}>⇄ Pergerakan vs Bulan Lalu</button></div>
<div class="insight">${ins}</div>
<div class="panels"><div class="panel"><div class="pt">Skor Komposit — ${BLN_F[curM]}</div><div class="ps">Bobot seimbang (33/33/33); rentang = sensitivitas bobot. Inflasi diukur terhadap target BI 2.5% ± 1%.</div><div class="tw">${scoreTbl(sc,scPrev)}</div></div><div class="panel"><div class="pt">Peta Skor</div><div id="mapAnal" class="mc"></div><div class="ml"><span>Rendah</span><div class="lb"><span style="background:#FFCDD2"></span><span style="background:#FFB74D"></span><span style="background:#66BB6A"></span><span style="background:#2E7D32"></span></div><span>Tinggi</span></div></div></div>
<div class="panels"><div class="panel pf"><div class="pt">Fiskal vs Inflasi${analCmpMove?' — dengan Pergerakan':''}</div><div class="ps">X: SILPA/Pendapatan · Y: Inflasi YoY${analCmpMove?' — ○ = bulan lalu':' — pita hijau = target BI'}</div><div class="cw"><canvas id="cScatter" height="300"></canvas></div></div></div></div>`;}
function scoreTbl(sc,scPrev){let h='<table class="dt"><thead><tr><th>Kab/Kota</th><th>Skor</th><th>Rentang</th>'+(scPrev?'<th>Δ</th>':'')+'<th>Belanja</th><th>SILPA</th><th>Inflasi</th><th style="width:100px"></th></tr></thead><tbody>';sc.forEach(s=>{const c=sCol(s.skor);let delta='';if(scPrev){const p=scPrev.find(x=>x.pemda===s.pemda);if(p){const d=s.skor-p.skor;delta='<td style="color:'+(d>=0?'var(--mint)':'var(--coral)')+'">'+(d>=0?'+':'')+d+'</td>';}else delta='<td>—</td>';}const rw=s.scoreMax-s.scoreMin;const rcol=rw>15?'var(--amber)':'var(--muted)';h+='<tr><td>'+s.pemda.replace('Kabupaten ','Kab. ')+'</td><td><span class="sv" style="color:'+c+'">'+s.skor+'</span></td><td style="font-family:JetBrains Mono;font-size:.7rem;color:'+rcol+'">'+s.scoreMin+'–'+s.scoreMax+'</td>'+delta+'<td>'+s.sB_pct+'%</td><td>'+s.sS_pct+'%</td><td>'+s.sI_pct+'%</td><td><div class="sbw"><div class="sbt"><div class="sbf" style="width:'+s.skor+'%;background:'+c+'"></div></div></div></td></tr>';});return h+'</tbody></table>';}
function drawAnal(){const curM=analM||apbdM;const scCur=computeScores(curM).filter(s=>s.inflasi!==null);const scPrev=analCmpMove&&curM>1?computeScores(curM-1).filter(s=>s.inflasi!==null):null;
const curColors=scCur.map(s=>(s.inflasi>=BI_TARGET_LOW&&s.inflasi<=BI_TARGET_HIGH)?'#66BB6A':(s.inflasi>BI_TARGET_HIGH?'#EF5350':'#FF8F00'));
const allX=scCur.map(s=>s.sr*100);const allY=[...scCur.map(s=>s.inflasi),BI_TARGET_LOW,BI_TARGET_HIGH];if(scPrev){allX.push(...scPrev.map(s=>s.sr*100));allY.push(...scPrev.map(s=>s.inflasi));}
const xDataMin=Math.min(...allX),xDataMax=Math.max(...allX);const xRange=Math.max(xDataMax-xDataMin,10),xPad=xRange*0.15;const xMin=Math.max(0,xDataMin-xPad),xMax=xDataMax+xPad;const yDataMin=Math.min(...allY),yDataMax=Math.max(...allY);const yPad=Math.max((yDataMax-yDataMin)*0.15,0.5);const yMin=yDataMin-yPad,yMax=yDataMax+yPad;
const datasets=[{type:'scatter',label:'Saat ini',data:scCur.map(s=>({x:s.sr*100,y:s.inflasi})),backgroundColor:curColors,borderColor:curColors,borderWidth:1,pointRadius:8,pointHoverRadius:11},
{type:'line',label:'__bi_high__',data:[{x:xMin,y:BI_TARGET_HIGH},{x:xMax,y:BI_TARGET_HIGH}],borderColor:'rgba(102,187,106,.6)',borderWidth:1,borderDash:[5,3],pointRadius:0,fill:false,tension:0},
{type:'line',label:'__bi_low__',data:[{x:xMin,y:BI_TARGET_LOW},{x:xMax,y:BI_TARGET_LOW}],borderColor:'rgba(102,187,106,.6)',borderWidth:1,borderDash:[5,3],pointRadius:0,fill:false,tension:0}];
if(scPrev){datasets.push({type:'scatter',label:'Bulan Lalu',data:scPrev.map(s=>({x:s.sr*100,y:s.inflasi})),backgroundColor:'transparent',borderColor:'#94A3B8',borderWidth:1.5,pointRadius:5,pointHoverRadius:7,pointStyle:'circle'});scCur.forEach(s=>{const p=scPrev.find(x=>x.pemda===s.pemda);if(p)datasets.push({type:'line',label:'__mv__'+s.pemda,data:[{x:p.sr*100,y:p.inflasi},{x:s.sr*100,y:s.inflasi}],showLine:true,borderColor:'rgba(148,163,184,.5)',borderWidth:1,borderDash:[3,3],pointRadius:0});});}
charts.scatter=new Chart(document.getElementById('cScatter'),{type:'scatter',data:{datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{filter:item=>!item.text||!item.text.startsWith('__'),font:{size:10},usePointStyle:true,padding:12}},tooltip:{filter:it=>!it.dataset.label?.startsWith('__'),callbacks:{title:items=>{const it=items[0];const isCurr=it.dataset.label==='Saat ini';const arr=isCurr?scCur:scPrev;return(isCurr?'':'[Lalu] ')+arr[it.dataIndex].pemda.replace('Kabupaten ','Kab. ');},label:ctx=>{const isCurr=ctx.dataset.label==='Saat ini';const arr=isCurr?scCur:scPrev;const s=arr[ctx.dataIndex];const zone=s.inflasi>=BI_TARGET_LOW&&s.inflasi<=BI_TARGET_HIGH?' ✓ target':s.inflasi>BI_TARGET_HIGH?' ↑ atas':' ↓ bawah';return'SILPA: '+(s.sr*100).toFixed(1)+'% · Inf: '+s.inflasi.toFixed(2)+'%'+zone;}}}},scales:{x:{type:'linear',position:'bottom',min:xMin,max:xMax,title:{display:true,text:'SILPA/Pendapatan (%)',font:{size:10,weight:'600'},color:'#64748B'},grid:{color:'#F1F5F9'},ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v+'%'}},y:{type:'linear',min:yMin,max:yMax,title:{display:true,text:'Inflasi YoY (%) — garis hijau = target BI',font:{size:10,weight:'600'},color:'#64748B'},grid:{color:'#F1F5F9'},ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v+'%'}}}}});}
function analMapStyle(f){const sc=computeScores(analM||apbdM);const p=w2a(f.properties.WADMKK);const s=sc.find(x=>x.pemda===p);return{fillColor:s?sCol(s.skor):'#E2E8F0',weight:1.5,color:'#fff',fillOpacity:.75};}
function analPopup(f){const sc=computeScores(analM||apbdM);const p=w2a(f.properties.WADMKK);const s=sc.find(x=>x.pemda===p);let h='<div class="ppt">'+f.properties.WADMKK+'</div>';if(s)h+='<div class="ppr"><span class="pl2">Skor</span><span class="pv2" style="color:'+sCol(s.skor)+'">'+s.skor+'/100</span></div><div class="ppr"><span class="pl2">Rasio Belanja</span><span class="pv2">'+(s.rb*100).toFixed(1)+'%</span></div>';return h;}

// ═══ MAP ═══
function initMap(id,styleFn,popupFn){if(!D.geo||!document.getElementById(id))return;lmap=L.map(id,{scrollWheelZoom:false}).setView([-3.7,128.2],6);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{attribution:'©CartoDB',maxZoom:12}).addTo(lmap);glayer=L.geoJSON(D.geo,{style:styleFn,onEachFeature:(f,layer)=>{layer.bindPopup(popupFn(f));layer.on('mouseover',()=>layer.setStyle({weight:3,color:'#1565C0',fillOpacity:.9}));layer.on('mouseout',()=>glayer.resetStyle(layer));}}).addTo(lmap);lmap.fitBounds(glayer.getBounds().pad(0.05));}

// ═══ EVENTS ═══
function bindEvents(){
  const sY=document.getElementById('sY'),sM=document.getElementById('sM'),sCmp=document.getElementById('sCmp'),sKomp=document.getElementById('sKomp'),sMa=document.getElementById('sMa'),sMe=document.getElementById('sMe'),sGrp=document.getElementById('sGrp'),sACmp=document.getElementById('sACmp'),sRange=document.getElementById('sRange'),pillLoc=document.getElementById('pillLoc'),sAnalM=document.getElementById('sAnalM'),bMove=document.getElementById('bMove'),sKurYF=document.getElementById('sKurYF'),sKurYT=document.getElementById('sKurYT'),sKurWil=document.getElementById('sKurWil'),sKurSk=document.getElementById('sKurSk'),sKurSe=document.getElementById('sKurSe');
  if(sY)sY.onchange=e=>{apbnY=+e.target.value;apbnM=Math.max(...D.apbn.filter(r=>r.thn===apbnY).map(r=>r.bln));render();};
  if(sM)sM.onchange=e=>{apbnM=+e.target.value;render();};
  if(sCmp)sCmp.onchange=e=>{apbnCmp=e.target.value;render();};
  if(sKomp)sKomp.onchange=e=>{apbnKomp=e.target.value;render();};
  if(sMa)sMa.onchange=e=>{apbdM=+e.target.value;render();};
  if(sMe)sMe.onchange=e=>{apbdMetric=e.target.value;render();};
  if(sGrp)sGrp.onchange=e=>{apbdGrp=e.target.value;render();};
  if(sACmp)sACmp.onchange=e=>{apbdCmp=e.target.value;render();};
  if(sRange)sRange.onchange=e=>{infRange=+e.target.value;render();};
  if(pillLoc)pillLoc.addEventListener('click',e=>{const p=e.target.closest('.pill');if(!p)return;const loc=p.dataset.loc;if(infLocs.includes(loc)){if(infLocs.length>1)infLocs=infLocs.filter(l=>l!==loc);}else infLocs.push(loc);render();});
  if(sAnalM)sAnalM.onchange=e=>{analM=+e.target.value;render();};
  if(bMove)bMove.onclick=()=>{analCmpMove=!analCmpMove;render();};
  if(sKurYF)sKurYF.onchange=e=>{kurYearFrom=e.target.value?+e.target.value:null;render();};
  if(sKurYT)sKurYT.onchange=e=>{kurYearTo=e.target.value?+e.target.value:null;render();};
  if(sKurSk)sKurSk.onchange=e=>{kurSkema=e.target.value;render();};
  if(sKurSe)sKurSe.onchange=e=>{kurSektor=e.target.value;render();};
  if(sKurWil)sKurWil.onchange=e=>{kurWilayah=e.target.value;render();};
}
document.getElementById('subTabs').addEventListener('click',e=>{const t=e.target.dataset?.tab;if(t){tab=t;render();}});
loadAll();
</script>
