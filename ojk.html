<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAILEO — OJK · Dashboard Kewilayahan Provinsi Maluku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700;8..60,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<style>
:root{--navy:#0C2B33;--deep:#081D22;--slate:#12414B;--ocean:#1C7A82;--sky:#3FA9B5;--cyan:#6FB8B0;--gold:#C08A34;--amber:#B8722E;--coral:#B5503E;--mint:#4C8863;--purple:#5B5A8C;--teal:#2E7D6B;--surface:#F5F1E8;--card:#FFFFFF;--border:#DDD4C2;--text:#211D16;--sub:#6B6152;--muted:#A79E8C;--radius:4px;--shadow:0 1px 2px rgba(20,16,8,.05)}
*{margin:0;padding:0;box-sizing:border-box}html{font-size:15px}body{font-family:'Inter',system-ui,sans-serif;background:var(--surface);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,var(--navy) 0%,var(--slate) 50%,var(--ocean) 100%);position:relative;overflow:hidden}
.header::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0px,rgba(255,255,255,.05) 1px,transparent 1px,transparent 34px);pointer-events:none}
.hi{max-width:1440px;margin:0 auto;padding:1.4rem 2rem 0;position:relative;z-index:1}
.ht{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.hb h1{font-family:'Source Serif 4',serif;font-weight:800;font-size:1.45rem;color:#fff;letter-spacing:-0.02em;line-height:1.2}
.hb h1 span{display:block;font-weight:500;font-size:.78rem;color:rgba(255,255,255,.55);letter-spacing:.01em;margin-bottom:3px}
.hb .bm{font-family:'Source Serif 4',serif;font-weight:700;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:2px;display:block}
.hb .ba{font-size:.58rem;font-weight:400;letter-spacing:.04em;color:rgba(255,255,255,.22);margin-top:2px;display:block;text-transform:none;font-family:'Inter',sans-serif}
.cb{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:.75rem;font-weight:500;padding:.3rem .7rem;border-radius:99px;font-family:'JetBrains Mono',monospace}
.st{display:flex;gap:0;margin-top:1.2rem}.stb{padding:.6rem 1.3rem;font-size:.8rem;font-weight:600;color:rgba(255,255,255,.4);border-radius:var(--radius) var(--radius) 0 0;cursor:pointer;transition:all .2s;font-family:'Source Serif 4',serif;text-decoration:none}.stb.active{background:var(--surface);color:var(--ocean);cursor:default}.stb.disabled{opacity:.4;cursor:default}.stb.disabled::after{content:'Segera';font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--gold);color:var(--navy);padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:middle}
.sub-tabs{display:flex;gap:2px;background:var(--card);border-bottom:1.5px solid var(--border);max-width:1440px;margin:0 auto;padding:0 2rem}
.stab{padding:.7rem 1.2rem;font-size:.8rem;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s;font-family:'Source Serif 4',serif}.stab:hover{color:var(--text)}.stab.active{color:var(--ocean);border-bottom-color:var(--ocean)}
.main{max-width:1440px;margin:0 auto;padding:1.5rem 2rem 3rem}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-bottom:1.4rem}
.kc{background:var(--card);border-radius:var(--radius);padding:1rem 1.1rem;box-shadow:none;border:1px solid var(--border);position:relative;overflow:hidden}.kc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kc.cg1::before{background:var(--mint)}.kc.cr::before{background:var(--coral)}.kc.cb2::before{background:var(--sky)}.kc.cgo::before{background:var(--gold)}.kc.cp::before{background:var(--purple)}.kc.cc::before{background:var(--cyan)}.kc.ct::before{background:var(--teal)}
.kl{font-size:.72rem;font-weight:600;letter-spacing:.01em;color:var(--sub);margin-bottom:.4rem}
.kv{font-family:'Source Serif 4',serif;font-size:1.45rem;font-weight:800;letter-spacing:-0.03em;color:var(--text);line-height:1.1}.kv .u{font-size:.65rem;font-weight:600;color:var(--sub);margin-left:2px}
.ks{display:flex;align-items:center;gap:.5rem;margin-top:.4rem;font-size:.7rem;color:var(--sub);flex-wrap:wrap}
.kpa{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted)}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.4rem}
.panel{background:var(--card);border-radius:var(--radius);padding:1.2rem;box-shadow:none;border:1px solid var(--border)}
.pt{font-family:'Source Serif 4',serif;font-size:.85rem;font-weight:700;color:var(--text);margin-bottom:.9rem}
.ps{font-size:.72rem;color:var(--sub);margin-top:-.5rem;margin-bottom:.9rem}
.pf{grid-column:1/-1}
.cw{position:relative;width:100%}.cw canvas{width:100%!important}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.dt{width:100%;border-collapse:collapse;font-size:.76rem}
table.dt thead th{font-family:'Source Serif 4',serif;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);padding:.55rem .6rem;text-align:right;border-bottom:2px solid var(--border);white-space:nowrap}table.dt thead th:first-child{text-align:left}
table.dt tbody td{padding:.5rem .6rem;text-align:right;font-family:'JetBrains Mono',monospace;font-size:.74rem;border-bottom:1px solid var(--border);white-space:nowrap}table.dt tbody td:first-child{text-align:left;font-family:'Inter',sans-serif;font-weight:500;color:var(--text)}
table.dt tbody tr.grp td{font-family:'Source Serif 4',serif;font-weight:700;font-size:.78rem;color:var(--text);background:var(--surface);border-bottom:1.5px solid var(--border)}
table.dt tbody tr:hover{background:#FAF7F0}
.mc{height:400px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.ml{display:flex;align-items:center;gap:.5rem;margin-top:.6rem;font-size:.68rem;color:var(--sub)}.ml .lb{display:flex;height:10px;border-radius:3px;overflow:hidden;flex:1;max-width:180px}.ml .lb span{flex:1}
.leaflet-popup-content-wrapper{border-radius:10px!important;font-family:'Inter',sans-serif;font-size:.78rem}.leaflet-popup-content{margin:10px 14px!important}
.ppt{font-family:'Source Serif 4',serif;font-weight:700;font-size:.82rem;margin-bottom:5px}.ppr{display:flex;justify-content:space-between;gap:1rem;padding:2px 0;font-size:.73rem}.ppr .pl2{color:var(--sub)}.ppr .pv2{font-family:'JetBrains Mono',monospace;font-weight:600}
.insight{background:linear-gradient(135deg,#F3F0E6,#F6F2E7);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.2rem;margin-bottom:1rem;font-size:.8rem;color:var(--slate);line-height:1.6}.insight strong{color:var(--text)}
.footer{max-width:1440px;margin:0 auto;padding:1rem 2rem;text-align:center;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border);display:flex;justify-content:center;gap:.6rem;flex-wrap:wrap}.footer a{color:var(--ocean);text-decoration:none;font-weight:600}
.loading{display:flex;align-items:center;justify-content:center;min-height:50vh;gap:.7rem;color:var(--sub);font-weight:500}
.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--ocean);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.errmsg{background:#F6EAE6;border:1px solid #E3C4B8;border-radius:var(--radius);padding:1.5rem;text-align:center;color:var(--coral);font-weight:500;margin:2rem}
.npl-flag{display:inline-block;font-size:.65rem;font-weight:700;padding:1px 6px;border-radius:4px}.npl-ok{background:#E7EDE1;color:#3B6E4E}.npl-warn{background:#F2E6D4;color:#8C4A1E}.npl-bad{background:#F6E9E4;color:#8C3B2C}
@media(max-width:900px){.panels{grid-template-columns:1fr}.main{padding:1rem}.hi{padding:1rem 1rem 0}.sub-tabs{padding:0 1rem}.mc{height:300px}}
@media(max-width:600px){html{font-size:14px}.kg{grid-template-columns:1fr 1fr}.kv{font-size:1.2rem}.hb h1{font-size:1.15rem}.stab{padding:.6rem .7rem;font-size:.73rem}}
</style>
</head>
<body>
<header class="header"><div class="hi"><div class="ht">
<div class="hb"><h1><span class="bm">BAILEO</span><span>Kanwil DJPb Provinsi Maluku</span>Dashboard Kewilayahan Data Provinsi Maluku<span class="ba">Bingkai Analitik Interaktif Laporan Ekonomi Operasional</span></h1></div>
<div><span class="cb" id="cutoffBadge">—</span></div>
</div><div class="st">
<a href="djpb.html" class="stb">DJPb</a>
<a href="bps.html" class="stb">BPS</a>
<div class="stb active">OJK</div>
<a href="bi.html" class="stb">Bank Indonesia</a>
</div></div></header>
<nav class="sub-tabs" id="subTabs"></nav>
<main class="main" id="mainContent"><div class="loading"><div class="spinner"></div><span>Memuat data…</span></div></main>
<footer class="footer"><a href="index.html">&larr; Beranda</a><span>Sumber data disusun dari DJPb, BPS, OJK, dan Bank Indonesia.</span></footer>

<script>
const FILES={kredit:'data/ojk/kredit.csv',npl:'data/ojk/npl.csv',snlik:'data/ojk/snlik.csv',geo:'data/geo/maluku.geojson'};
const SEG_PAL={Investasi:'#5B5A8C',Konsumsi:'#3FA9B5','Modal Kerja':'#C08A34'};
const KAB_PAL=['#3FA9B5','#B5503E','#4C8863','#C08A34','#5B5A8C','#6FB8B0','#C1663B','#8A7560','#8B8676','#A85B72','#12414B'];

let D={kredit:[],npl:[],snlik:null,geo:null};
let tab='kredit';
let charts={},lmap=null,glayer=null;

async function fcsv(p){const r=await fetch(p);if(!r.ok)throw new Error(p);return Papa.parse((await r.text()).trim(),{header:true,skipEmptyLines:true,dynamicTyping:false,delimitersToGuess:[',',';','\t','|']}).data;}

function normKK(raw){
  let s=raw.trim();
  s=s.replace(/^KAB\.\s*/i,'Kabupaten ');
  s=s.replace(/^KOTA\s+/i,'Kota ');
  // Title-case
  s=s.replace(/\w\S*/g,t=>t.charAt(0).toUpperCase()+t.substr(1).toLowerCase());
  return s;
}
function shortKK(s){return s.replace('Kabupaten ','Kab. ').replace('Kepulauan ','Kep. ');}
// Map feature name → kredit kab_kota
function feat2kk(f){return f.properties.WADMKK;}

async function loadAll(){
  try{
    const[kr,np,sn,geo]=await Promise.all([
      fcsv(FILES.kredit).catch(()=>[]),
      fcsv(FILES.npl).catch(()=>[]),
      fcsv(FILES.snlik).catch(()=>[]),
      fetch(FILES.geo).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    D.kredit=kr.map(r=>({
      periode:r.periode,kk:normKK(r.kab_kota),seg:r.segmen_kredit.trim(),
      outstanding:+r.outstanding_rp_juta||0,growth:+r.pertumbuhan_yoy_persen||0
    }));
    D.npl=np.map(r=>({
      periode:r.periode,kk:normKK(r.kab_kota),seg:r.segmen_kredit.trim(),
      npl:+r.npl_persen||0
    }));
    if(sn.length){D.snlik={literasi:+sn[0].indeks_literasi||0,inklusi:+sn[0].indeks_inklusi||0,periode:sn[0].periode};}
    D.geo=geo;

    // Derive cutoff
    if(D.kredit.length){
      const p=D.kredit[0].periode;
      document.getElementById('cutoffBadge').textContent='Data: '+p;
    }
    render();
  }catch(e){document.getElementById('mainContent').innerHTML='<div class="errmsg">Gagal memuat: '+e.message+'</div>';}
}

function fmt(n){if(Math.abs(n)>=1e6)return(n/1e6).toFixed(2);if(Math.abs(n)>=1e3)return(n/1e3).toFixed(1);return n.toLocaleString('id-ID');}
function fU(n){if(Math.abs(n)>=1e6)return'T';if(Math.abs(n)>=1e3)return'M';return'';}
function dC(){Object.values(charts).forEach(c=>c.destroy());charts={};}
function dM(){if(lmap){lmap.remove();lmap=null;glayer=null;}}
function cCol(v,mn,mx){if(v==null)return'#DDD4C2';const t=mx===mn?.5:Math.max(0,Math.min(1,(v-mn)/(mx-mn)));const cs=[[236,230,208],[79,168,174],[12,43,51]];const i=t<.5?0:1,lt=t<.5?t*2:(t-.5)*2;return`rgb(${Math.round(cs[i][0]+(cs[i+1][0]-cs[i][0])*lt)},${Math.round(cs[i][1]+(cs[i+1][1]-cs[i][1])*lt)},${Math.round(cs[i][2]+(cs[i+1][2]-cs[i][2])*lt)})`;}
function nplCol(v){return v>=10?'#8C3B2C':v>=5?'#8C4A1E':v>=3?'#B8722E':'#3B6E4E';}
function nplCls(v){return v>=10?'npl-bad':v>=5?'npl-warn':'npl-ok';}

// ── Aggregate helpers ──
function byKK(arr){const m={};arr.forEach(r=>{if(!m[r.kk])m[r.kk]={kk:r.kk,total:0,segs:{}};m[r.kk].total+=r.outstanding;if(!m[r.kk].segs[r.seg])m[r.kk].segs[r.seg]=0;m[r.kk].segs[r.seg]+=r.outstanding;});return Object.values(m).sort((a,b)=>b.total-a.total);}
function byKK_npl(kreditArr,nplArr){const m={};kreditArr.forEach(r=>{if(!m[r.kk])m[r.kk]={kk:r.kk,totalKredit:0,totalWeightedNPL:0,segs:{}};m[r.kk].totalKredit+=r.outstanding;const np=nplArr.find(n=>n.kk===r.kk&&n.seg===r.seg);const nplVal=np?np.npl:0;m[r.kk].totalWeightedNPL+=r.outstanding*nplVal/100;m[r.kk].segs[r.seg]={outstanding:r.outstanding,npl:nplVal};});Object.values(m).forEach(v=>{v.nplWeighted=v.totalKredit>0?v.totalWeightedNPL/v.totalKredit*100:0;});return Object.values(m).sort((a,b)=>b.nplWeighted-a.nplWeighted);}

// ── TABS & RENDER ──
const TABS=[{id:'kredit',l:'Kredit Perbankan'},{id:'npl',l:'Kualitas Kredit (NPL)'}];
function render(){
  dC();dM();
  document.getElementById('subTabs').innerHTML=TABS.map(t=>'<div class="stab'+(t.id===tab?' active':'')+'" data-tab="'+t.id+'">'+t.l+'</div>').join('');
  const main=document.getElementById('mainContent');
  if(tab==='kredit')main.innerHTML=renderKredit();
  else main.innerHTML=renderNPL();
  drawCharts();
}
function drawCharts(){
  if(tab==='kredit'){drawKredit();initMap('mapKredit',kreditMapStyle,kreditPopup);}
  else{drawNPL();initMap('mapNPL',nplMapStyle,nplPopup);}
}

// ═══ KREDIT ═══
function renderKredit(){
  if(!D.kredit.length)return'<div class="errmsg">kredit.csv tidak ditemukan</div>';
  const agg=byKK(D.kredit);
  const totO=D.kredit.reduce((s,r)=>s+r.outstanding,0);
  const totI=D.kredit.filter(r=>r.seg==='Investasi').reduce((s,r)=>s+r.outstanding,0);
  const totK=D.kredit.filter(r=>r.seg==='Konsumsi').reduce((s,r)=>s+r.outstanding,0);
  const totM=D.kredit.filter(r=>r.seg==='Modal Kerja').reduce((s,r)=>s+r.outstanding,0);
  const snlik=D.snlik;
  return`<div>
<p style="font-size:.72rem;color:var(--sub);margin-bottom:1rem"><em>Data kredit perbankan berdasarkan jenis penggunaan, tingkat kab/kota. Periode: ${D.kredit[0]?.periode||'—'}.</em></p>
<div class="kg">
  <div class="kc cb2"><div class="kl">Total Outstanding</div><div class="kv">${fmt(totO)}<span class="u">${fU(totO)} Rp Juta</span></div></div>
  <div class="kc cp"><div class="kl">Investasi</div><div class="kv">${fmt(totI)}<span class="u">${fU(totI)}</span></div><div class="ks"><span class="kpa">${(totI/totO*100).toFixed(1)}% dari total</span></div></div>
  <div class="kc cgo"><div class="kl">Konsumsi</div><div class="kv">${fmt(totK)}<span class="u">${fU(totK)}</span></div><div class="ks"><span class="kpa">${(totK/totO*100).toFixed(1)}% dari total</span></div></div>
  <div class="kc ct"><div class="kl">Modal Kerja</div><div class="kv">${fmt(totM)}<span class="u">${fU(totM)}</span></div><div class="ks"><span class="kpa">${(totM/totO*100).toFixed(1)}% dari total</span></div></div>
  ${snlik?'<div class="kc cg1"><div class="kl">SNLIK Literasi '+snlik.periode+'</div><div class="kv">'+snlik.literasi.toFixed(1)+'<span class="u">%</span></div></div><div class="kc cc"><div class="kl">SNLIK Inklusi '+snlik.periode+'</div><div class="kv">'+snlik.inklusi.toFixed(1)+'<span class="u">%</span></div></div>':''}
</div>
<div class="panels">
  <div class="panel"><div class="pt">Outstanding per Kab/Kota (Miliar Rp)</div><div class="ps">Warna: Investasi · Konsumsi · Modal Kerja</div><div class="cw"><canvas id="cKreditBar" height="340"></canvas></div></div>
  <div class="panel"><div class="pt">Peta Total Outstanding</div><div id="mapKredit" class="mc"></div><div class="ml"><span>Rendah</span><div class="lb"><span style="background:#EAF2EF"></span><span style="background:#3FA9B5"></span><span style="background:#1F8A93"></span></div><span>Tinggi</span></div></div>
</div>
<div class="panels">
  <div class="panel"><div class="pt">Komposisi per Segmen</div><div class="cw"><canvas id="cKreditDonut" height="260"></canvas></div></div>
  <div class="panel"><div class="pt">Pertumbuhan Kredit YoY (%)</div><div class="cw"><canvas id="cGrowth" height="260"></canvas></div></div>
</div>
<div class="panel pf"><div class="pt">Rincian Kredit per Kab/Kota</div><div class="tw">${kreditTbl(agg)}</div></div></div>`;
}
function kreditTbl(agg){
  const segs=['Investasi','Konsumsi','Modal Kerja'];
  let h='<table class="dt"><thead><tr><th>Kab/Kota</th>';
  segs.forEach(s=>h+='<th>'+s+'</th>');
  h+='<th>Total</th><th>% Total</th></tr></thead><tbody>';
  const grandTotal=agg.reduce((s,r)=>s+r.total,0);
  agg.forEach(r=>{
    h+='<tr><td>'+shortKK(r.kk)+'</td>';
    segs.forEach(s=>h+='<td>'+(r.segs[s]?(r.segs[s]/1e3).toFixed(1):'—')+'</td>');
    h+='<td style="font-weight:700">'+(r.total/1e3).toFixed(1)+'</td>';
    h+='<td>'+(r.total/grandTotal*100).toFixed(1)+'%</td></tr>';
  });
  h+='<tr class="grp"><td>Total</td>';
  segs.forEach(s=>{const v=agg.reduce((sum,r)=>sum+(r.segs[s]||0),0);h+='<td>'+(v/1e3).toFixed(1)+'</td>';});
  h+='<td>'+(grandTotal/1e3).toFixed(1)+'</td><td>100%</td></tr>';
  return h+'</tbody></table><p style="font-size:.68rem;color:var(--muted);margin-top:.5rem">Satuan: Miliar Rp (outstanding dalam Rp Juta ÷ 1.000)</p>';
}
function drawKredit(){
  const agg=byKK(D.kredit);
  const segs=['Investasi','Konsumsi','Modal Kerja'];
  charts.kreditBar=new Chart(document.getElementById('cKreditBar'),{type:'bar',
    data:{labels:agg.map(r=>shortKK(r.kk)),
      datasets:segs.map(s=>({label:s,data:agg.map(r=>(r.segs[s]||0)/1e3),backgroundColor:SEG_PAL[s],borderRadius:3,barPercentage:.75}))},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
      plugins:{legend:{position:'top',labels:{font:{size:10},usePointStyle:true,padding:12}},
        tooltip:{callbacks:{label:c=>c.dataset.label+': '+(c.parsed.x).toFixed(1)+' M'}}},
      scales:{x:{stacked:true,ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v.toLocaleString()},grid:{color:'#ECE6D8'}},
        y:{stacked:true,ticks:{font:{size:9}},grid:{display:false}}}}});
  // Donut
  const segTotals=segs.map(s=>D.kredit.filter(r=>r.seg===s).reduce((sum,r)=>sum+r.outstanding,0)/1e3);
  charts.kreditDonut=new Chart(document.getElementById('cKreditDonut'),{type:'doughnut',
    data:{labels:segs,datasets:[{data:segTotals,backgroundColor:segs.map(s=>SEG_PAL[s]),borderWidth:2,borderColor:'#fff',hoverOffset:8}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',
      plugins:{legend:{position:'bottom',labels:{font:{size:10},usePointStyle:true,padding:12}},
        tooltip:{callbacks:{label:c=>c.label+': '+c.parsed.toFixed(1)+' M'}}}}});
  // Growth bar
  const growthData={};D.kredit.forEach(r=>{if(!growthData[r.kk])growthData[r.kk]={kk:r.kk,segs:{}};growthData[r.kk].segs[r.seg]=r.growth;});
  const gArr=Object.values(growthData).sort((a,b)=>{const aT=Object.values(a.segs).reduce((s,v)=>s+v,0)/Object.keys(a.segs).length;const bT=Object.values(b.segs).reduce((s,v)=>s+v,0)/Object.keys(b.segs).length;return bT-aT;});
  charts.growth=new Chart(document.getElementById('cGrowth'),{type:'bar',
    data:{labels:gArr.map(r=>shortKK(r.kk)),
      datasets:segs.map(s=>({label:s,data:gArr.map(r=>r.segs[s]||0),backgroundColor:SEG_PAL[s],borderRadius:3,barPercentage:.75}))},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
      plugins:{legend:{position:'top',labels:{font:{size:10},usePointStyle:true,padding:12}},
        tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.x.toFixed(1)+'%'}}},
      scales:{x:{ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v+'%'},grid:{color:'#ECE6D8'}},
        y:{ticks:{font:{size:8}},grid:{display:false}}}}});
}
function kreditMapStyle(f){
  const agg=byKK(D.kredit);const vals=agg.map(r=>r.total);
  const mn=Math.min(...vals),mx=Math.max(...vals);
  const w=feat2kk(f);
  const row=agg.find(r=>r.kk===w||shortKK(r.kk).replace('Kab. ','')===w.replace('Kabupaten ',''));
  return{fillColor:cCol(row?row.total:0,mn,mx),weight:1.5,color:'#fff',fillOpacity:.8};
}
function kreditPopup(f){
  const agg=byKK(D.kredit);const w=feat2kk(f);
  const row=agg.find(r=>r.kk===w||shortKK(r.kk).replace('Kab. ','')===w.replace('Kabupaten ',''));
  let h='<div class="ppt">'+w+'</div>';
  if(row){
    h+='<div class="ppr"><span class="pl2">Total</span><span class="pv2">'+(row.total/1e3).toFixed(1)+' M</span></div>';
    ['Investasi','Konsumsi','Modal Kerja'].forEach(s=>{if(row.segs[s])h+='<div class="ppr"><span class="pl2">'+s+'</span><span class="pv2">'+(row.segs[s]/1e3).toFixed(1)+' M</span></div>';});
  }else h+='<div style="color:var(--muted);font-size:.75rem">Data gabungan kab/kota lain</div>';
  return h;
}

// ═══ NPL ═══
function renderNPL(){
  if(!D.npl.length)return'<div class="errmsg">npl.csv tidak ditemukan</div>';
  const agg=byKK_npl(D.kredit,D.npl);
  const totKredit=D.kredit.reduce((s,r)=>s+r.outstanding,0);
  const totWeightedNPL=agg.reduce((s,r)=>s+r.totalWeightedNPL,0);
  const avgNPL=totKredit>0?totWeightedNPL/totKredit*100:0;
  const high=agg.filter(r=>r.nplWeighted>=5);
  let ins='';
  if(high.length)ins+=`<strong>${high.map(r=>shortKK(r.kk)).join(', ')}</strong> memiliki NPL tertimbang ≥5% — perlu perhatian khusus. `;
  ins+=`NPL rata-rata tertimbang Provinsi Maluku: <strong>${avgNPL.toFixed(2)}%</strong>.`;
  return`<div>
<p style="font-size:.72rem;color:var(--sub);margin-bottom:1rem"><em>Rasio NPL kredit perbankan per segmen, tingkat kab/kota. Periode: ${D.npl[0]?.periode||'—'}.</em></p>
<div class="kg">
  <div class="kc ${avgNPL>=5?'cr':'cg1'}"><div class="kl">NPL Tertimbang Provinsi</div><div class="kv">${avgNPL.toFixed(2)}<span class="u">%</span></div></div>
  <div class="kc cr"><div class="kl">Kab/Kota NPL ≥ 5%</div><div class="kv">${high.length}<span class="u">/ ${agg.length}</span></div></div>
  ${D.snlik?'<div class="kc cg1"><div class="kl">SNLIK Literasi</div><div class="kv">'+D.snlik.literasi.toFixed(1)+'<span class="u">%</span></div></div><div class="kc cc"><div class="kl">SNLIK Inklusi</div><div class="kv">'+D.snlik.inklusi.toFixed(1)+'<span class="u">%</span></div></div>':''}
</div>
<div class="insight">${ins}</div>
<div class="panels">
  <div class="panel"><div class="pt">NPL per Kab/Kota & Segmen</div><div class="ps">NPL tertimbang = Σ(outstanding × NPL) / total outstanding</div><div class="cw"><canvas id="cNPLBar" height="340"></canvas></div></div>
  <div class="panel"><div class="pt">Peta NPL Tertimbang</div><div id="mapNPL" class="mc"></div><div class="ml"><span>Rendah (sehat)</span><div class="lb"><span style="background:#CBD9C6"></span><span style="background:#D9A15C"></span><span style="background:#B5503E"></span></div><span>Tinggi (risiko)</span></div></div>
</div>
<div class="panel pf"><div class="pt">Rincian NPL per Kab/Kota & Segmen</div><div class="tw">${nplTbl(agg)}</div></div></div>`;
}
function nplTbl(agg){
  const segs=['Investasi','Konsumsi','Modal Kerja'];
  let h='<table class="dt"><thead><tr><th>Kab/Kota</th>';
  segs.forEach(s=>h+='<th>NPL '+s+'</th>');
  h+='<th>NPL Tertimbang</th><th>Status</th></tr></thead><tbody>';
  agg.forEach(r=>{
    h+='<tr><td>'+shortKK(r.kk)+'</td>';
    segs.forEach(s=>{const v=r.segs[s]?r.segs[s].npl:null;if(v!==null)h+='<td style="color:'+nplCol(v)+'">'+v.toFixed(2)+'%</td>';else h+='<td>—</td>';});
    h+='<td style="font-weight:700;color:'+nplCol(r.nplWeighted)+'">'+r.nplWeighted.toFixed(2)+'%</td>';
    h+='<td><span class="npl-flag '+nplCls(r.nplWeighted)+'">'+(r.nplWeighted>=10?'Tinggi':r.nplWeighted>=5?'Perhatian':'Sehat')+'</span></td></tr>';
  });
  return h+'</tbody></table>';
}
function drawNPL(){
  const agg=byKK_npl(D.kredit,D.npl);
  const segs=['Investasi','Konsumsi','Modal Kerja'];
  charts.nplBar=new Chart(document.getElementById('cNPLBar'),{type:'bar',
    data:{labels:agg.map(r=>shortKK(r.kk)),
      datasets:segs.map(s=>({label:s,data:agg.map(r=>r.segs[s]?r.segs[s].npl:0),backgroundColor:SEG_PAL[s],borderRadius:3,barPercentage:.75}))},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
      plugins:{legend:{position:'top',labels:{font:{size:10},usePointStyle:true,padding:12}},
        tooltip:{callbacks:{label:c=>c.dataset.label+' NPL: '+c.parsed.x.toFixed(2)+'%'}}},
      scales:{x:{ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v+'%'},grid:{color:'#ECE6D8'}},
        y:{ticks:{font:{size:8}},grid:{display:false}}}}});
}
function nplMapStyle(f){
  const agg=byKK_npl(D.kredit,D.npl);
  const w=feat2kk(f);
  const row=agg.find(r=>r.kk===w||shortKK(r.kk).replace('Kab. ','')===w.replace('Kabupaten ',''));
  const v=row?row.nplWeighted:0;
  const col=v>=10?'#8C3B2C':v>=5?'#B8722E':v>=3?'#C99A3E':'#4C8863';
  return{fillColor:col,weight:1.5,color:'#fff',fillOpacity:.75};
}
function nplPopup(f){
  const agg=byKK_npl(D.kredit,D.npl);
  const w=feat2kk(f);
  const row=agg.find(r=>r.kk===w||shortKK(r.kk).replace('Kab. ','')===w.replace('Kabupaten ',''));
  let h='<div class="ppt">'+w+'</div>';
  if(row){
    h+='<div class="ppr"><span class="pl2">NPL Tertimbang</span><span class="pv2" style="color:'+nplCol(row.nplWeighted)+'">'+row.nplWeighted.toFixed(2)+'%</span></div>';
    ['Investasi','Konsumsi','Modal Kerja'].forEach(s=>{if(row.segs[s])h+='<div class="ppr"><span class="pl2">'+s+'</span><span class="pv2">'+row.segs[s].npl.toFixed(2)+'%</span></div>';});
  }else h+='<div style="color:var(--muted);font-size:.75rem">Data gabungan kab/kota lain</div>';
  return h;
}

// ═══ MAP ═══
function initMap(id,styleFn,popupFn){if(!D.geo||!document.getElementById(id))return;lmap=L.map(id,{scrollWheelZoom:false}).setView([-3.7,128.2],6);L.tileLayer('https://basemaps.cartocdn.com/rastertiles/light_nolabels/{z}/{x}/{y}.png?key=cb1_2maz_1_6368be7eb1cbab521800398b',{attribution:'©CartoDB',maxZoom:12}).addTo(lmap);glayer=L.geoJSON(D.geo,{style:styleFn,onEachFeature:(f,layer)=>{layer.bindPopup(popupFn(f));layer.on('mouseover',()=>layer.setStyle({weight:3,color:'#1F8A93',fillOpacity:.9}));layer.on('mouseout',()=>glayer.resetStyle(layer));}}).addTo(lmap);lmap.fitBounds(glayer.getBounds().pad(0.05));}

// ═══ EVENTS ═══
document.getElementById('subTabs').addEventListener('click',e=>{const t=e.target.dataset?.tab;if(t){tab=t;render();}});
loadAll();
</script>
</body>
</html>
