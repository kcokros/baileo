<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAILEO — Dashboard Kewilayahan Provinsi Maluku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<style>
:root{--navy:#0A1628;--deep:#122240;--slate:#1B3A5C;--ocean:#1565A0;--sky:#2196F3;--cyan:#26C6DA;--gold:#F5A623;--amber:#FF8F00;--coral:#EF5350;--mint:#66BB6A;--purple:#7E57C2;--surface:#F4F7FC;--card:#FFFFFF;--border:#E2E8F0;--text:#1E293B;--sub:#64748B;--muted:#94A3B8;--radius:12px;--shadow:0 1px 3px rgba(10,22,40,.06),0 4px 12px rgba(10,22,40,.04)}
*{margin:0;padding:0;box-sizing:border-box}html{font-size:15px}body{font-family:'Inter',system-ui,sans-serif;background:var(--surface);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,var(--navy) 0%,var(--slate) 50%,var(--ocean) 100%);position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-50%;left:-20%;width:140%;height:200%;background:radial-gradient(ellipse at 30% 80%,rgba(33,150,243,.12) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(38,198,218,.08) 0%,transparent 50%);pointer-events:none}
.header-inner{max-width:1440px;margin:0 auto;padding:1.4rem 2rem 0;position:relative;z-index:1}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.header-brand h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.45rem;color:#fff;letter-spacing:-0.02em;line-height:1.2}
.header-brand h1 span{display:block;font-weight:500;font-size:.78rem;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.header-brand .baileo-mark{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:2px;display:block}
.header-brand .baileo-acronym{font-size:.58rem;font-weight:400;letter-spacing:.04em;color:rgba(255,255,255,.22);margin-top:2px;display:block;text-transform:none;font-family:'Inter',sans-serif}
.cutoff-badge{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:.75rem;font-weight:500;padding:.3rem .7rem;border-radius:99px;font-family:'JetBrains Mono',monospace}
.source-tabs{display:flex;gap:0;margin-top:1.2rem}
.source-tab{padding:.6rem 1.3rem;font-size:.8rem;font-weight:600;color:rgba(255,255,255,.4);border-radius:var(--radius) var(--radius) 0 0;cursor:default;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif}
.source-tab.active{background:var(--surface);color:var(--ocean)}
.source-tab.disabled{opacity:.4}
.source-tab.disabled::after{content:'Segera';font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--gold);color:var(--navy);padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:middle}
.sub-tabs{display:flex;gap:2px;background:var(--card);border-bottom:1.5px solid var(--border);max-width:1440px;margin:0 auto;padding:0 2rem}
.sub-tab{padding:.7rem 1.2rem;font-size:.8rem;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s;font-family:'Plus Jakarta Sans',sans-serif}
.sub-tab:hover{color:var(--text)}.sub-tab.active{color:var(--ocean);border-bottom-color:var(--ocean)}
.main{max-width:1440px;margin:0 auto;padding:1.5rem 2rem 3rem}
.controls{display:flex;align-items:center;gap:.7rem;margin-bottom:1.4rem;flex-wrap:wrap}
.control-group{display:flex;align-items:center;gap:.35rem}
.control-group label{font-size:.72rem;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
.control-group select{font-family:'Inter',sans-serif;font-size:.82rem;font-weight:500;padding:.38rem .65rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;outline:none}
.control-group select:focus{border-color:var(--ocean)}
.spacer{flex:1}
.toggle-btn{font-family:'Inter',sans-serif;font-size:.78rem;font-weight:600;padding:.4rem .9rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--sub);cursor:pointer;transition:all .2s}
.toggle-btn.active{background:var(--ocean);border-color:var(--ocean);color:#fff}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-bottom:1.4rem}
.kpi-card{background:var(--card);border-radius:var(--radius);padding:1.1rem 1.2rem;box-shadow:var(--shadow);border:1px solid var(--border);position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-card.c-green::before{background:var(--mint)}.kpi-card.c-red::before{background:var(--coral)}.kpi-card.c-blue::before{background:var(--sky)}.kpi-card.c-gold::before{background:var(--gold)}.kpi-card.c-purple::before{background:var(--purple)}.kpi-card.c-cyan::before{background:var(--cyan)}
.kpi-label{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin-bottom:.5rem}
.kpi-value{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.55rem;font-weight:800;letter-spacing:-0.03em;color:var(--text);line-height:1.1}
.kpi-value .unit{font-size:.68rem;font-weight:600;color:var(--sub);margin-left:2px}
.kpi-sub{display:flex;align-items:center;gap:.5rem;margin-top:.45rem;font-size:.72rem;color:var(--sub);flex-wrap:wrap}
.kpi-pagu{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted)}
.kpi-persen{font-weight:700;padding:2px 6px;border-radius:5px;font-size:.7rem;font-family:'JetBrains Mono',monospace}
.persen-low{background:#FFF3E0;color:#E65100}.persen-mid{background:#E3F2FD;color:#1565C0}.persen-high{background:#E8F5E9;color:#2E7D32}
.kpi-yoy{font-size:.7rem;font-weight:600;font-family:'JetBrains Mono',monospace}.yoy-up{color:var(--mint)}.yoy-down{color:var(--coral)}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.4rem}
.panel{background:var(--card);border-radius:var(--radius);padding:1.2rem;box-shadow:var(--shadow);border:1px solid var(--border)}
.panel-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:.85rem;font-weight:700;color:var(--text);margin-bottom:.9rem}
.panel-sub{font-size:.72rem;color:var(--sub);margin-top:-.5rem;margin-bottom:.9rem}
.panel-full{grid-column:1/-1}
.chart-wrap{position:relative;width:100%}.chart-wrap canvas{width:100%!important}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.dt{width:100%;border-collapse:collapse;font-size:.78rem}
table.dt thead th{font-family:'Plus Jakarta Sans',sans-serif;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);padding:.6rem .7rem;text-align:right;border-bottom:2px solid var(--border);white-space:nowrap}
table.dt thead th:first-child{text-align:left}
table.dt tbody td{padding:.55rem .7rem;text-align:right;font-family:'JetBrains Mono',monospace;font-size:.76rem;border-bottom:1px solid var(--border);white-space:nowrap}
table.dt tbody td:first-child{text-align:left;font-family:'Inter',sans-serif;font-weight:500;color:var(--text)}
table.dt tbody tr.grp td{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.8rem;color:var(--text);background:var(--surface);border-bottom:1.5px solid var(--border);padding-top:.7rem}
table.dt tbody tr:hover{background:#F8FAFD}
.bar-cell{display:flex;align-items:center;gap:.4rem;justify-content:flex-end}
.bar-track{width:55px;height:5px;background:var(--surface);border-radius:3px;overflow:hidden;flex-shrink:0}
.bar-fill{height:100%;border-radius:3px;transition:width .4s ease}
.footer{max-width:1440px;margin:0 auto;padding:1rem 2rem;text-align:center;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border)}
.loading{display:flex;align-items:center;justify-content:center;min-height:50vh;gap:.7rem;color:var(--sub);font-weight:500}
.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--ocean);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{background:#FFF3F3;border:1px solid #FECACA;border-radius:var(--radius);padding:1.5rem;text-align:center;color:var(--coral);font-weight:500;margin:2rem}
.inflasi-latest{display:flex;flex-wrap:wrap;gap:.8rem;margin-bottom:1.4rem}
.inflasi-chip{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.7rem 1rem;box-shadow:var(--shadow);min-width:130px}
.inflasi-chip .ic-loc{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);margin-bottom:.3rem}
.inflasi-chip .ic-val{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.3rem;font-weight:800}
.inflasi-chip .ic-mom{font-size:.7rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-top:.2rem}

/* Map */
.map-container{height:420px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.map-legend{display:flex;align-items:center;gap:.5rem;margin-top:.7rem;font-size:.7rem;color:var(--sub)}
.map-legend .lg-bar{display:flex;height:10px;border-radius:3px;overflow:hidden;flex:1;max-width:200px}
.map-legend .lg-bar span{flex:1}
.map-legend .lg-labels{display:flex;justify-content:space-between;flex:1;max-width:200px;font-family:'JetBrains Mono',monospace;font-size:.65rem}
.leaflet-popup-content-wrapper{border-radius:10px!important;font-family:'Inter',sans-serif;font-size:.8rem}
.leaflet-popup-content{margin:10px 14px!important}
.popup-title{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.85rem;margin-bottom:6px}
.popup-row{display:flex;justify-content:space-between;gap:1rem;padding:2px 0;font-size:.75rem}
.popup-row .pr-label{color:var(--sub)}.popup-row .pr-val{font-family:'JetBrains Mono',monospace;font-weight:600}

/* Analisis */
.insight-box{background:linear-gradient(135deg,#EBF5FF,#F0F7FF);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.2rem;margin-bottom:1rem;font-size:.82rem;color:var(--slate);line-height:1.6}
.insight-box strong{color:var(--text)}
.score-bar-wrap{display:flex;align-items:center;gap:.6rem;margin:.3rem 0}
.score-bar-track{flex:1;height:8px;background:var(--surface);border-radius:4px;overflow:hidden;max-width:120px}
.score-bar-fill{height:100%;border-radius:4px}
.score-val{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;min-width:35px}

@media(max-width:900px){.panels{grid-template-columns:1fr}.main{padding:1rem}.header-inner{padding:1rem 1rem 0}.sub-tabs{padding:0 1rem}.map-container{height:320px}}
@media(max-width:600px){html{font-size:14px}.kpi-grid{grid-template-columns:1fr 1fr}.kpi-value{font-size:1.25rem}.header-brand h1{font-size:1.15rem}.sub-tab{padding:.6rem .7rem;font-size:.75rem}}
</style>
</head>
<body>
<header class="header"><div class="header-inner">
<div class="header-top">
<div class="header-brand"><h1><span class="baileo-mark">BAILEO</span><span>Kanwil DJPb Provinsi Maluku</span>Dashboard Kewilayahan<span class="baileo-acronym">Bingkai Analitik Interaktif Laporan Ekonomi Operasional</span></h1></div>
<div class="header-meta"><span class="cutoff-badge" id="cutoffBadge">—</span></div>
</div>
<div class="source-tabs">
<div class="source-tab active">DJPb</div>
<div class="source-tab disabled">BPS</div>
<div class="source-tab disabled">Bank Indonesia</div>
</div>
</div></header>
<nav class="sub-tabs" id="subTabs">
<div class="sub-tab active" data-tab="apbn">APBN</div>
<div class="sub-tab" data-tab="apbd">APBD</div>
<div class="sub-tab" data-tab="inflasi">Inflasi</div>
<div class="sub-tab" data-tab="analisis">Analisis</div>
</nav>
<main class="main" id="mainContent"><div class="loading" id="loadingScreen"><div class="spinner"></div><span>Memuat data…</span></div></main>
<footer class="footer">Sumber data: DJPb (OMSPAN/MEBE) · BPS · Bank Indonesia — Data dimuat otomatis dari CSV repositori</footer>

<script>
const CSV_APBN='apbn.csv',CSV_APBD='apbd.csv',CSV_INFLASI='inflasi.csv',GEOJSON_PATH='maluku.geojson';
const KOMP={p_pajak_dn:{l:'Pajak Dalam Negeri',g:'pendapatan',o:1},p_pajak_ln:{l:'Pajak Perdagangan Intl.',g:'pendapatan',o:2},p_pnbp_lain:{l:'PNBP Lainnya',g:'pendapatan',o:3},p_blu:{l:'Pendapatan BLU',g:'pendapatan',o:4},b_pegawai:{l:'Belanja Pegawai',g:'belanja',o:5},b_barang:{l:'Belanja Barang',g:'belanja',o:6},b_modal:{l:'Belanja Modal',g:'belanja',o:7},b_bansos:{l:'Bantuan Sosial',g:'belanja',o:8},b_dbh:{l:'Dana Bagi Hasil',g:'tkdd',o:9},b_dakfisik:{l:'DAK Fisik',g:'tkdd',o:10},b_daknonfisik:{l:'DAK Non Fisik',g:'tkdd',o:11},b_dau:{l:'Dana Alokasi Umum',g:'tkdd',o:12},b_infis:{l:'Dana Insentif Daerah',g:'tkdd',o:13},b_danadesa:{l:'Dana Desa',g:'tkdd',o:14}};
const GRP={pendapatan:'Pendapatan Negara',belanja:'Belanja K/L',tkdd:'Transfer ke Daerah & Dana Desa'};
const GC={pendapatan:{bar:'#66BB6A'},belanja:{bar:'#EF5350'},tkdd:{bar:'#2196F3'}};
const BLN=['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
const BLN_F=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const LOC_C={'Ambon':'#2196F3','Tual':'#EF5350','Maluku':'#1B3A5C','MalukuTengah':'#7E57C2','Nasional':'#94A3B8'};
const LOC_L={'Ambon':'Kota Ambon','Tual':'Kota Tual','Maluku':'Prov. Maluku','MalukuTengah':'Maluku Tengah','Nasional':'Nasional'};

// Map WADMKK → APBD nama_pemda
function wadmkkToAPBD(w){return w.startsWith('Kota')?w:'Kabupaten '+w;}
// Map APBD nama_pemda → inflasi loc
const PEMDA_INFLASI={'Kota Ambon':'Ambon','Kota Tual':'Tual','Kabupaten Maluku Tengah':'MalukuTengah'};

let apbnData=[],apbdData=[],inflasiData=[],geoData=null;
let activeTab='apbn',apbnYear,apbnMonth,apbnYoY=false,apbdMonth,apbdMetric='pendapatan';
let charts={},leafletMap=null,geoLayer=null;

async function fetchCSV(p){const r=await fetch(p);if(!r.ok)throw new Error(p);return Papa.parse((await r.text()).trim(),{header:true,skipEmptyLines:true,dynamicTyping:false}).data;}

async function loadAll(){
  try{
    const[a,b,c,g]=await Promise.all([
      fetchCSV(CSV_APBN).catch(()=>[]),fetchCSV(CSV_APBD).catch(()=>[]),fetchCSV(CSV_INFLASI).catch(()=>[]),
      fetch(GEOJSON_PATH).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    apbnData=a.filter(r=>r.thang&&r.komp_ang).map(r=>({thn:+r.thang,bln:+r.bulan,cut:r.tgl_cutoff,kode:r.komp_ang.trim(),pagu:+r.pagu_target||0,real:+r.realisasi||0}));
    apbdData=b.filter(r=>r.thang).map(r=>({thn:+r.thang,bln:+r.bulan,cut:r.tgl_cutoff,pemda:r.nama_pemda.trim(),pendapatan:+r.pendapatan||0,belanja:+r.belanja||0,pembiayaan:+r.pembiayaan||0,silpa:+r.SILPA||0}));
    inflasiData=c.filter(r=>r.waktu).map(r=>({waktu:r.waktu.trim(),loc:r.nama_pemda.trim(),mom:r.inflasi_bulanan!==''&&r.inflasi_bulanan!=null?+r.inflasi_bulanan:null,yoy:r.inflasi_tahunan!==''&&r.inflasi_tahunan!=null?+r.inflasi_tahunan:null}));
    geoData=g;
    if(apbnData.length){const yrs=[...new Set(apbnData.map(r=>r.thn))].sort((a,b)=>b-a);apbnYear=yrs[0];apbnMonth=Math.max(...apbnData.filter(r=>r.thn===apbnYear).map(r=>r.bln));}
    if(apbdData.length)apbdMonth=Math.max(...apbdData.map(r=>r.bln));
    render();
  }catch(e){document.getElementById('loadingScreen').innerHTML='<div class="error-msg">Gagal memuat: '+e.message+'</div>';}
}

function fmt(n){if(Math.abs(n)>=1e12)return(n/1e12).toFixed(2);if(Math.abs(n)>=1e9)return(n/1e9).toFixed(2);if(Math.abs(n)>=1e6)return(n/1e6).toFixed(1);return n.toLocaleString('id-ID');}
function fU(n){if(Math.abs(n)>=1e12)return'T';if(Math.abs(n)>=1e9)return'M';if(Math.abs(n)>=1e6)return'Jt';return'';}
function fM(n){return'Rp '+(n/1e9).toFixed(2)+' M';}
function pC(p){return p<20?'persen-low':p<50?'persen-mid':'persen-high';}
function bCol(p){return p<20?'#FF8F00':p<50?'#2196F3':'#66BB6A';}
function gf(t,b){return apbnData.filter(r=>r.thn===t&&r.bln===b);}
function sg(rows,g){return rows.filter(r=>KOMP[r.kode]&&KOMP[r.kode].g===g).reduce((a,r)=>({pagu:a.pagu+r.pagu,real:a.real+r.real}),{pagu:0,real:0});}
function destroyCharts(){Object.values(charts).forEach(c=>c.destroy());charts={};}
function destroyMap(){if(leafletMap){leafletMap.remove();leafletMap=null;geoLayer=null;}}

function choroplethColor(val,min,max){
  if(val==null)return'#E2E8F0';
  const t=max===min?0.5:Math.max(0,Math.min(1,(val-min)/(max-min)));
  const colors=[[227,242,253],[66,165,245],[21,101,192]];
  const i=t<0.5?0:1, lt=t<0.5?t*2:(t-0.5)*2;
  const r=Math.round(colors[i][0]+(colors[i+1][0]-colors[i][0])*lt);
  const g=Math.round(colors[i][1]+(colors[i+1][1]-colors[i][1])*lt);
  const b=Math.round(colors[i][2]+(colors[i+1][2]-colors[i][2])*lt);
  return`rgb(${r},${g},${b})`;
}
function scoreColor(s){
  if(s>=70)return'#2E7D32';if(s>=50)return'#66BB6A';if(s>=30)return'#FF8F00';return'#C62828';
}

// ═══ RENDER ═══
function render(){
  destroyCharts();destroyMap();
  const main=document.getElementById('mainContent');
  let cutoff='—';
  if(activeTab==='apbn'&&apbnData.length){const r=apbnData.find(r=>r.thn===apbnYear&&r.bln===apbnMonth);if(r)cutoff=r.cut;}
  else if((activeTab==='apbd'||activeTab==='analisis')&&apbdData.length){const r=apbdData.find(r=>r.bln===apbdMonth);if(r)cutoff=r.cut;}
  else if(activeTab==='inflasi'&&inflasiData.length)cutoff=inflasiData[inflasiData.length-1].waktu;
  document.getElementById('cutoffBadge').textContent='Data s.d. '+cutoff;

  if(activeTab==='apbn')main.innerHTML=renderAPBN();
  else if(activeTab==='apbd')main.innerHTML=renderAPBD();
  else if(activeTab==='inflasi')main.innerHTML=renderInflasi();
  else main.innerHTML=renderAnalisis();
  bindEvents();
  if(activeTab==='apbn')drawAPBNCharts();
  else if(activeTab==='apbd'){drawAPBDCharts();initAPBDMap();}
  else if(activeTab==='inflasi')drawInflasiCharts();
  else{drawAnalisisCharts();initAnalisisMap();}
}

// ═══ APBN ═══
function renderAPBN(){
  if(!apbnData.length)return'<div class="error-msg">File apbn.csv tidak ditemukan</div>';
  const yrs=[...new Set(apbnData.map(r=>r.thn))].sort((a,b)=>b-a);
  const mos=[...new Set(apbnData.filter(r=>r.thn===apbnYear).map(r=>r.bln))].sort((a,b)=>a-b);
  const curr=gf(apbnYear,apbnMonth),prev=gf(apbnYear-1,apbnMonth);
  const p=sg(curr,'pendapatan'),b=sg(curr,'belanja'),t=sg(curr,'tkdd');
  const pp=sg(prev,'pendapatan'),bp=sg(prev,'belanja'),tp=sg(prev,'tkdd');
  const totP=p.pagu+b.pagu+t.pagu,totR=p.real+b.real+t.real,serapan=totP?(totR/totP*100):0;
  return`<div>
  <div class="controls">
    <div class="control-group"><label>Tahun</label><select id="sY">${yrs.map(y=>'<option value="'+y+'"'+(y===apbnYear?' selected':'')+'>'+y+'</option>').join('')}</select></div>
    <div class="control-group"><label>s.d.</label><select id="sM">${mos.map(m=>'<option value="'+m+'"'+(m===apbnMonth?' selected':'')+'>'+BLN_F[m]+'</option>').join('')}</select></div>
    <div class="spacer"></div><button class="toggle-btn ${apbnYoY?'active':''}" id="bYoY">⇄ YoY</button>
  </div>

}
function kpiCard(title,d,prev,cls){const pct=d.pagu?(d.real/d.pagu*100):0;let yoy='';if(apbnYoY&&prev.real){const df=(d.real-prev.real)/prev.real*100;yoy='<span class="kpi-yoy '+(df>=0?'yoy-up':'yoy-down')+'">'+(df>=0?'▲':'▼')+' '+Math.abs(df).toFixed(1)+'% YoY</span>';}return'<div class="kpi-card '+cls+'"><div class="kpi-label">'+title+'</div><div class="kpi-value">'+fmt(d.real)+'<span class="unit">'+fU(d.real)+'</span></div><div class="kpi-sub"><span class="kpi-pagu">Pagu: '+fmt(d.pagu)+fU(d.pagu)+'</span><span class="kpi-persen '+pC(pct)+'">'+pct.toFixed(1)+'%</span>'+yoy+'</div></div>';}

function initAPBDMap(){
  if(!geoData)return;
  const curr=apbdData.filter(r=>r.bln===apbdMonth&&!r.pemda.startsWith('Provinsi'));
  const vals=curr.map(r=>r[apbdMetric]||0);
  const mn=Math.min(...vals),mx=Math.max(...vals);
  leafletMap=L.map('mapApbd',{scrollWheelZoom:false}).setView([-3.7,128.2],6);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{attribution:'©CartoDB',maxZoom:12}).addTo(leafletMap);
  geoLayer=L.geoJSON(geoData,{
    style:feat=>{const pemda=wadmkkToAPBD(feat.properties.WADMKK);const row=curr.find(r=>r.pemda===pemda);const v=row?row[apbdMetric]||0:0;return{fillColor:choroplethColor(v,mn,mx),weight:1.5,color:'#fff',fillOpacity:.8};},
    onEachFeature:(feat,layer)=>{
      const pemda=wadmkkToAPBD(feat.properties.WADMKK);const row=curr.find(r=>r.pemda===pemda);

}

function getLatestInflasi(loc){
  const rows=inflasiData.filter(r=>r.loc===loc&&r.yoy!==null).sort((a,b)=>a.waktu.localeCompare(b.waktu));
  return rows.length?rows[rows.length-1].yoy:null;
}
function getMalukuInflasiForMonth(thn,bln){
  const key=thn+'/'+String(bln).padStart(2,'0')+'/01';
  const r=inflasiData.find(x=>x.loc==='Maluku'&&x.waktu===key&&x.yoy!==null);
  return r?r.yoy:null;
}
function getNasionalInflasi(){return getLatestInflasi('Nasional');}

function computeScores(){
  const curr=apbdData.filter(r=>r.bln===apbdMonth&&!r.pemda.startsWith('Provinsi'));
  const nasInflasi=getNasionalInflasi()||2.5;
  const malukuInflasi=getLatestInflasi('Maluku')||nasInflasi;

  return curr.map(r=>{
    // 1. Rasio Belanja (higher=better, spending their revenue)
    const rasioBelanja=r.pendapatan>0?Math.min(r.belanja/r.pendapatan,1.5):0;
    const skorBelanja=Math.min(rasioBelanja/0.8*40,40); // max 40pts at 80%+ spending ratio

    // 2. SILPA efficiency (lower SILPA ratio = better, not sitting on money)
    const silpaRatio=r.pendapatan>0?Math.abs(r.silpa)/r.pendapatan:1;
    const skorSilpa=Math.max(0,30-silpaRatio*30); // max 30pts

    // 3. Inflation proximity to national (closer=better)
    const locKey=PEMDA_INFLASI[r.pemda];
    const locInflasi=locKey?getLatestInflasi(locKey):malukuInflasi;
    const infDev=locInflasi!==null?Math.abs(locInflasi-nasInflasi):2;
    const skorInflasi=Math.max(0,30-infDev*5); // max 30pts

    const total=Math.round(skorBelanja+skorSilpa+skorInflasi);
    return{pemda:r.pemda,skor:total,skorBelanja:Math.round(skorBelanja),skorSilpa:Math.round(skorSilpa),skorInflasi:Math.round(skorInflasi),
      pendapatan:r.pendapatan,belanja:r.belanja,silpa:r.silpa,rasioBelanja,silpaRatio,inflasi:locInflasi,infDev};
  }).sort((a,b)=>b.skor-a.skor);
}

function renderAnalisis(){
  if(!apbdData.length||!inflasiData.length)return'<div class="error-msg">Data APBD dan/atau Inflasi diperlukan untuk analisis</div>';
  const scores=computeScores();
  const nasInf=getNasionalInflasi()||0;
  const malInf=getLatestInflasi('Maluku')||0;

  // Insight text
  const best=scores[0],worst=scores[scores.length-1];
  const highSilpa=scores.filter(s=>s.silpaRatio>0.5).map(s=>s.pemda.replace('Kabupaten ','Kab. '));
  const highInf=scores.filter(s=>s.inflasi!==null&&s.inflasi>nasInf+1).map(s=>s.pemda.replace('Kabupaten ','Kab. '));

  let insight=`<strong>${best.pemda.replace('Kabupaten ','Kab. ')}</strong> memiliki skor kinerja tertinggi (${best.skor}/100), sementara <strong>${worst.pemda.replace('Kabupaten ','Kab. ')}</strong> terendah (${worst.skor}/100). `;
  if(highSilpa.length)insight+=`Perhatian pada <strong>${highSilpa.join(', ')}</strong> yang memiliki rasio SILPA tinggi (>50% pendapatan), mengindikasikan kapasitas fiskal belum terserap optimal. `;
  if(highInf.length)insight+=`Inflasi di <strong>${highInf.join(', ')}</strong> berada >1pp di atas rata-rata nasional (${nasInf.toFixed(2)}%).`;

  return`<div>
  <div class="insight-box">${insight}</div>

  <div class="panels">
    <div class="panel"><div class="panel-title">Skor Kinerja Kewilayahan</div>
      <div class="panel-sub">Komposit: Rasio Belanja (40) + Efisiensi SILPA (30) + Stabilitas Inflasi (30)</div>
      <div class="table-wrap">${scoreTable(scores)}</div></div>
    <div class="panel"><div class="panel-title">Peta Skor Kinerja</div><div id="mapAnalisis" class="map-container"></div>
      <div class="map-legend"><span>Rendah</span><div class="lg-bar"><span style="background:#FFCDD2"></span><span style="background:#FFB74D"></span><span style="background:#66BB6A"></span><span style="background:#2E7D32"></span></div><span>Tinggi</span></div></div>
  </div>

  <div class="panels">
    <div class="panel panel-full"><div class="panel-title">Fiskal vs Inflasi — Scatter per Kab/Kota</div>
      <div class="panel-sub">Sumbu X: Rasio SILPA/Pendapatan · Sumbu Y: Inflasi YoY · Kuadran kanan-atas = SILPA tinggi + inflasi tinggi (zona perhatian)</div>
      <div class="chart-wrap"><canvas id="cScatter" height="300"></canvas></div></div>
  </div>

  <div class="panels">
    <div class="panel panel-full"><div class="panel-title">Belanja Riil (Deflasi Inflasi) — APBN</div>
      <div class="panel-sub">Realisasi belanja K/L disesuaikan dengan inflasi YoY Maluku untuk melihat pertumbuhan daya beli riil</div>
      <div class="chart-wrap"><canvas id="cRealBelanja" height="220"></canvas></div></div>
  </div>
  </div>`;
}

function scoreTable(scores){
  let h='<table class="dt"><thead><tr><th>Kab/Kota</th><th>Skor</th><th>Belanja</th><th>SILPA</th><th>Inflasi</th><th style="width:140px"></th></tr></thead><tbody>';
  scores.forEach(s=>{
    const col=scoreColor(s.skor);
    h+='<tr><td>'+s.pemda.replace('Kabupaten ','Kab. ')+'</td>';
    h+='<td><span class="score-val" style="color:'+col+'">'+s.skor+'</span></td>';
    h+='<td>'+s.skorBelanja+'/40</td><td>'+s.skorSilpa+'/30</td><td>'+s.skorInflasi+'/30</td>';
    h+='<td><div class="score-bar-wrap"><div class="score-bar-track"><div class="score-bar-fill" style="width:'+s.skor+'%;background:'+col+'"></div></div></div></td></tr>';
  });
  return h+'</tbody></table>';
}

function initAnalisisMap(){
  if(!geoData)return;
  const scores=computeScores();
  leafletMap=L.map('mapAnalisis',{scrollWheelZoom:false}).setView([-3.7,128.2],6);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{attribution:'©CartoDB',maxZoom:12}).addTo(leafletMap);
  geoLayer=L.geoJSON(geoData,{
    style:feat=>{const pemda=wadmkkToAPBD(feat.properties.WADMKK);const s=scores.find(x=>x.pemda===pemda);const col=s?scoreColor(s.skor):'#E2E8F0';return{fillColor:col,weight:1.5,color:'#fff',fillOpacity:.75};},
    onEachFeature:(feat,layer)=>{
      const pemda=wadmkkToAPBD(feat.properties.WADMKK);const s=scores.find(x=>x.pemda===pemda);
      let popup='<div class="popup-title">'+feat.properties.WADMKK+'</div>';
      if(s){
        popup+='<div class="popup-row"><span class="pr-label">Skor Kinerja</span><span class="pr-val" style="color:'+scoreColor(s.skor)+'">'+s.skor+'/100</span></div>';
        popup+='<div class="popup-row"><span class="pr-label">Rasio Belanja</span><span class="pr-val">'+(s.rasioBelanja*100).toFixed(1)+'%</span></div>';
        popup+='<div class="popup-row"><span class="pr-label">SILPA/Pendapatan</span><span class="pr-val">'+(s.silpaRatio*100).toFixed(1)+'%</span></div>';
        if(s.inflasi!==null)popup+='<div class="popup-row"><span class="pr-label">Inflasi YoY</span><span class="pr-val">'+s.inflasi.toFixed(2)+'%</span></div>';
      }
      layer.bindPopup(popup);
      layer.on('mouseover',()=>layer.setStyle({weight:3,color:'#1565C0',fillOpacity:.9}));
      layer.on('mouseout',()=>geoLayer.resetStyle(layer));
    }
  }).addTo(leafletMap);
  leafletMap.fitBounds(geoLayer.getBounds().pad(0.05));
}

function drawAnalisisCharts(){
  const scores=computeScores();
  const nasInf=getNasionalInflasi()||2.5;

  // Scatter: SILPA ratio vs Inflasi
  const scatterData=scores.filter(s=>s.inflasi!==null).map(s=>({x:s.silpaRatio*100,y:s.inflasi,label:s.pemda.replace('Kabupaten ','Kab. ')}));
  charts.scatter=new Chart(document.getElementById('cScatter'),{
    type:'scatter',
    data:{datasets:[{
      data:scatterData.map(d=>({x:d.x,y:d.y})),
      backgroundColor:scatterData.map(d=>d.y>nasInf&&d.x>50?'#EF5350':'#2196F3'),
      pointRadius:8,pointHoverRadius:11,
    }]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},
        tooltip:{callbacks:{title:function(items){const i=items[0].dataIndex;return scatterData[i].label;},label:function(ctx){const i=ctx.dataIndex;return'SILPA: '+scatterData[i].x.toFixed(1)+'%  |  Inflasi: '+scatterData[i].y.toFixed(2)+'%';}}},
        annotation:undefined},
      scales:{
        x:{title:{display:true,text:'Rasio SILPA / Pendapatan (%)',font:{family:'Inter',size:10,weight:'600'},color:'#64748B'},grid:{color:'#F1F5F9'},ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v+'%'}},
        y:{title:{display:true,text:'Inflasi YoY (%)',font:{family:'Inter',size:10,weight:'600'},color:'#64748B'},grid:{color:'#F1F5F9'},ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v+'%'}}
      }}
  });

  // Real belanja line
  const yrs=[...new Set(apbnData.map(r=>r.thn))].sort();
  const allM=[...new Set(apbnData.map(r=>r.bln))].sort((a,b)=>a-b);
  // Build series: for each year+month, get belanja real and deflate by Maluku inflation
  const nominalDS={label:'Belanja Nominal',data:[],borderColor:'#EF5350',backgroundColor:'#EF535018',fill:true,tension:.3,pointRadius:4,borderWidth:2.5};
  const realDS={label:'Belanja Riil (deflasi)',data:[],borderColor:'#1B3A5C',backgroundColor:'#1B3A5C18',fill:true,tension:.3,pointRadius:4,borderWidth:2.5,borderDash:[5,3]};
  const labels=[];
  yrs.forEach(yr=>{
    const mos=[...new Set(apbnData.filter(r=>r.thn===yr).map(r=>r.bln))].sort((a,b)=>a-b);
    mos.forEach(m=>{
      const bel=sg(gf(yr,m),'belanja');
      const inf=getMalukuInflasiForMonth(yr,m);
      labels.push(BLN[m]+' '+String(yr).slice(2));
      nominalDS.data.push(bel.real/1e9);
      realDS.data.push(inf!==null?bel.real/(1+inf/100)/1e9:bel.real/1e9);
    });
  });
  charts.realBel=new Chart(document.getElementById('cRealBelanja'),{
    type:'line',data:{labels,datasets:[nominalDS,realDS]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'top',labels:{font:{family:'Inter',size:10},usePointStyle:true,pointStyle:'circle',padding:12}},tooltip:{mode:'index',intersect:false,callbacks:{label:c=>c.dataset.label+': Rp '+(c.parsed.y?.toFixed(2)||'—')+' M'}}},
      scales:{x:{grid:{display:false},ticks:{font:{family:'Inter',size:9}}},y:{grid:{color:'#F1F5F9'},ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v.toLocaleString()},title:{display:true,text:'Miliar Rp',font:{family:'Inter',size:9,weight:'600'},color:'#94A3B8'}}}}
  });
}

// ═══ EVENTS ═══
function bindEvents(){
  const sY=document.getElementById('sY'),sM=document.getElementById('sM'),bY=document.getElementById('bYoY'),sMa=document.getElementById('sMApbd'),sMe=document.getElementById('sMetric');
  if(sY)sY.onchange=e=>{apbnYear=+e.target.value;apbnMonth=Math.max(...apbnData.filter(r=>r.thn===apbnYear).map(r=>r.bln));render();};
  if(sM)sM.onchange=e=>{apbnMonth=+e.target.value;render();};
  if(bY)bY.onclick=()=>{apbnYoY=!apbnYoY;render();};
  if(sMa)sMa.onchange=e=>{apbdMonth=+e.target.value;render();};
  if(sMe)sMe.onchange=e=>{apbdMetric=e.target.value;render();};
}
document.getElementById('subTabs').addEventListener('click',e=>{const tab=e.target.dataset.tab;if(!tab)return;activeTab=tab;document.querySelectorAll('.sub-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));render();});
loadAll();
</script>
