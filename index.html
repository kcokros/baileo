<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAILEO — Dashboard Kewilayahan Provinsi Maluku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<style>
:root{--navy:#0A1628;--deep:#122240;--slate:#1B3A5C;--ocean:#1565A0;--sky:#2196F3;--cyan:#26C6DA;--gold:#F5A623;--amber:#FF8F00;--coral:#EF5350;--mint:#66BB6A;--purple:#7E57C2;--surface:#F4F7FC;--card:#FFFFFF;--border:#E2E8F0;--text:#1E293B;--sub:#64748B;--muted:#94A3B8;--radius:12px;--shadow:0 1px 3px rgba(10,22,40,.06),0 4px 12px rgba(10,22,40,.04)}
*{margin:0;padding:0;box-sizing:border-box}html{font-size:15px}body{font-family:'Inter',system-ui,sans-serif;background:var(--surface);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,var(--navy) 0%,var(--slate) 50%,var(--ocean) 100%);position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-50%;left:-20%;width:140%;height:200%;background:radial-gradient(ellipse at 30% 80%,rgba(33,150,243,.12) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(38,198,218,.08) 0%,transparent 50%);pointer-events:none}
.hi{max-width:1440px;margin:0 auto;padding:1.4rem 2rem 0;position:relative;z-index:1}
.ht{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.hb h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.45rem;color:#fff;letter-spacing:-0.02em;line-height:1.2}
.hb h1 span{display:block;font-weight:500;font-size:.78rem;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.hb .bm{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:2px;display:block}
.hb .ba{font-size:.58rem;font-weight:400;letter-spacing:.04em;color:rgba(255,255,255,.22);margin-top:2px;display:block;text-transform:none;font-family:'Inter',sans-serif}
.cb{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:.75rem;font-weight:500;padding:.3rem .7rem;border-radius:99px;font-family:'JetBrains Mono',monospace}
.st{display:flex;gap:0;margin-top:1.2rem}.stb{padding:.6rem 1.3rem;font-size:.8rem;font-weight:600;color:rgba(255,255,255,.4);border-radius:var(--radius) var(--radius) 0 0;cursor:pointer;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif}.stb.active{background:var(--surface);color:var(--ocean)}.stb.disabled{opacity:.4;cursor:default}.stb.disabled::after{content:'Segera';font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--gold);color:var(--navy);padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:middle}
.sub-tabs{display:flex;gap:2px;background:var(--card);border-bottom:1.5px solid var(--border);max-width:1440px;margin:0 auto;padding:0 2rem}
.stab{padding:.7rem 1.2rem;font-size:.8rem;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s;font-family:'Plus Jakarta Sans',sans-serif}.stab:hover{color:var(--text)}.stab.active{color:var(--ocean);border-bottom-color:var(--ocean)}
.main{max-width:1440px;margin:0 auto;padding:1.5rem 2rem 3rem}
.controls{display:flex;align-items:center;gap:.7rem;margin-bottom:1.4rem;flex-wrap:wrap}
.cg{display:flex;align-items:center;gap:.35rem}.cg label{font-size:.72rem;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}.cg select{font-family:'Inter',sans-serif;font-size:.82rem;font-weight:500;padding:.38rem .65rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;outline:none}.cg select:focus{border-color:var(--ocean)}
.spacer{flex:1}
.tbtn{font-family:'Inter',sans-serif;font-size:.78rem;font-weight:600;padding:.4rem .9rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--sub);cursor:pointer;transition:all .2s}.tbtn.active{background:var(--ocean);border-color:var(--ocean);color:#fff}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-bottom:1.4rem}
.kc{background:var(--card);border-radius:var(--radius);padding:1rem 1.1rem;box-shadow:var(--shadow);border:1px solid var(--border);position:relative;overflow:hidden}.kc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kc.cg1::before{background:var(--mint)}.kc.cr::before{background:var(--coral)}.kc.cb2::before{background:var(--sky)}.kc.cgo::before{background:var(--gold)}.kc.cp::before{background:var(--purple)}.kc.cc::before{background:var(--cyan)}
.kl{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin-bottom:.4rem}
.kv{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.45rem;font-weight:800;letter-spacing:-0.03em;color:var(--text);line-height:1.1}.kv .u{font-size:.65rem;font-weight:600;color:var(--sub);margin-left:2px}
.ks{display:flex;align-items:center;gap:.5rem;margin-top:.4rem;font-size:.7rem;color:var(--sub);flex-wrap:wrap}
.kpa{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted)}
.kpe{font-weight:700;padding:2px 6px;border-radius:5px;font-size:.68rem;font-family:'JetBrains Mono',monospace}
.pl{background:#FFF3E0;color:#E65100}.pm{background:#E3F2FD;color:#1565C0}.ph{background:#E8F5E9;color:#2E7D32}
.yoy{font-size:.68rem;font-weight:600;font-family:'JetBrains Mono',monospace}.yu{color:var(--mint)}.yd{color:var(--coral)}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.4rem}
.panel{background:var(--card);border-radius:var(--radius);padding:1.2rem;box-shadow:var(--shadow);border:1px solid var(--border)}
.pt{font-family:'Plus Jakarta Sans',sans-serif;font-size:.85rem;font-weight:700;color:var(--text);margin-bottom:.9rem}
.ps{font-size:.72rem;color:var(--sub);margin-top:-.5rem;margin-bottom:.9rem}
.pf{grid-column:1/-1}
.cw{position:relative;width:100%}.cw canvas{width:100%!important}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.dt{width:100%;border-collapse:collapse;font-size:.76rem}
table.dt thead th{font-family:'Plus Jakarta Sans',sans-serif;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);padding:.55rem .6rem;text-align:right;border-bottom:2px solid var(--border);white-space:nowrap}table.dt thead th:first-child{text-align:left}
table.dt tbody td{padding:.5rem .6rem;text-align:right;font-family:'JetBrains Mono',monospace;font-size:.74rem;border-bottom:1px solid var(--border);white-space:nowrap}table.dt tbody td:first-child{text-align:left;font-family:'Inter',sans-serif;font-weight:500;color:var(--text)}
table.dt tbody tr.grp td{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.78rem;color:var(--text);background:var(--surface);border-bottom:1.5px solid var(--border)}
table.dt tbody tr:hover{background:#F8FAFD}
.bc{display:flex;align-items:center;gap:.4rem;justify-content:flex-end}.bt{width:50px;height:5px;background:var(--surface);border-radius:3px;overflow:hidden;flex-shrink:0}.bf{height:100%;border-radius:3px;transition:width .4s ease}
.footer{max-width:1440px;margin:0 auto;padding:1rem 2rem;text-align:center;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border)}
.loading{display:flex;align-items:center;justify-content:center;min-height:50vh;gap:.7rem;color:var(--sub);font-weight:500}
.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--ocean);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.errmsg{background:#FFF3F3;border:1px solid #FECACA;border-radius:var(--radius);padding:1.5rem;text-align:center;color:var(--coral);font-weight:500;margin:2rem}
.inflasi-latest{display:flex;flex-wrap:wrap;gap:.8rem;margin-bottom:1.4rem}
.ic{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.65rem .9rem;box-shadow:var(--shadow);min-width:125px}.ic .il{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);margin-bottom:.25rem}.ic .iv{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.2rem;font-weight:800}.ic .im{font-size:.68rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-top:.15rem}
.mc{height:400px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.ml{display:flex;align-items:center;gap:.5rem;margin-top:.6rem;font-size:.68rem;color:var(--sub)}.ml .lb{display:flex;height:10px;border-radius:3px;overflow:hidden;flex:1;max-width:180px}.ml .lb span{flex:1}
.leaflet-popup-content-wrapper{border-radius:10px!important;font-family:'Inter',sans-serif;font-size:.78rem}.leaflet-popup-content{margin:10px 14px!important}
.ppt{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.82rem;margin-bottom:5px}.ppr{display:flex;justify-content:space-between;gap:1rem;padding:2px 0;font-size:.73rem}.ppr .pl2{color:var(--sub)}.ppr .pv2{font-family:'JetBrains Mono',monospace;font-weight:600}
.insight{background:linear-gradient(135deg,#EBF5FF,#F0F7FF);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.2rem;margin-bottom:1rem;font-size:.8rem;color:var(--slate);line-height:1.6}.insight strong{color:var(--text)}
.sbw{display:flex;align-items:center;gap:.5rem;margin:.2rem 0}.sbt{flex:1;height:7px;background:var(--surface);border-radius:4px;overflow:hidden;max-width:110px}.sbf{height:100%;border-radius:4px}.sv{font-family:'JetBrains Mono',monospace;font-size:.76rem;font-weight:700;min-width:32px}
@media(max-width:900px){.panels{grid-template-columns:1fr}.main{padding:1rem}.hi{padding:1rem 1rem 0}.sub-tabs{padding:0 1rem}.mc{height:300px}}
@media(max-width:600px){html{font-size:14px}.kg{grid-template-columns:1fr 1fr}.kv{font-size:1.2rem}.hb h1{font-size:1.15rem}.stab{padding:.6rem .7rem;font-size:.73rem}}
</style>
</head>
<body>
<header class="header"><div class="hi"><div class="ht">
<div class="hb"><h1><span class="bm">BAILEO</span><span>Kanwil DJPb Provinsi Maluku</span>Dashboard Kewilayahan<span class="ba">Bingkai Analitik Interaktif Laporan Ekonomi Operasional</span></h1></div>
<div><span class="cb" id="cutoffBadge">—</span></div>
</div><div class="st">
<div class="stb active" id="srcDJPb">DJPb</div>
<div class="stb" id="srcBPS">BPS</div>
<div class="stb disabled">Bank Indonesia</div>
</div></div></header>
<nav class="sub-tabs" id="subTabs"></nav>
<main class="main" id="mainContent"><div class="loading"><div class="spinner"></div><span>Memuat data…</span></div></main>
<footer class="footer">Sumber data: DJPb (OMSPAN/MEBE) · BPS · Bank Indonesia — Data dimuat otomatis dari CSV repositori</footer>

<script>
// ═══ CONFIG ═══
const FILES={apbn:'apbn.csv',apbd:'apbd.csv',inflasi:'inflasi.csv',pdrb:'pdrb.csv',penduduk:'penduduk.csv',kemiskinan:'kemiskinan.csv',ipm:'ipm.csv',pengangguran:'pengangguran.csv',gini:'gini.csv',geo:'maluku.geojson'};
const KOMP={p_pajak_dn:{l:'Pajak Dalam Negeri',g:'pendapatan',o:1},p_pajak_ln:{l:'Pajak Perdagangan Intl.',g:'pendapatan',o:2},p_pnbp_lain:{l:'PNBP Lainnya',g:'pendapatan',o:3},p_blu:{l:'Pendapatan BLU',g:'pendapatan',o:4},b_pegawai:{l:'Belanja Pegawai',g:'belanja',o:5},b_barang:{l:'Belanja Barang',g:'belanja',o:6},b_modal:{l:'Belanja Modal',g:'belanja',o:7},b_bansos:{l:'Bantuan Sosial',g:'belanja',o:8},b_dbh:{l:'Dana Bagi Hasil',g:'tkdd',o:9},b_dakfisik:{l:'DAK Fisik',g:'tkdd',o:10},b_daknonfisik:{l:'DAK Non Fisik',g:'tkdd',o:11},b_dau:{l:'Dana Alokasi Umum',g:'tkdd',o:12},b_infis:{l:'Dana Insentif Daerah',g:'tkdd',o:13},b_danadesa:{l:'Dana Desa',g:'tkdd',o:14}};
const GRP={pendapatan:'Pendapatan Negara',belanja:'Belanja K/L',tkdd:'Transfer ke Daerah & Dana Desa'};
const GC={pendapatan:{bar:'#66BB6A'},belanja:{bar:'#EF5350'},tkdd:{bar:'#2196F3'}};
const BLN=['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
const BLN_F=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const LOC_C={'Ambon':'#2196F3','Tual':'#EF5350','Maluku':'#1B3A5C','MalukuTengah':'#7E57C2','Nasional':'#94A3B8'};
const LOC_L={'Ambon':'Kota Ambon','Tual':'Kota Tual','Maluku':'Prov. Maluku','MalukuTengah':'Maluku Tengah','Nasional':'Nasional'};
const KAB_PAL=['#2196F3','#EF5350','#66BB6A','#F5A623','#7E57C2','#26C6DA','#FF7043','#8D6E63','#78909C','#EC407A','#1B3A5C'];
function w2a(w){return w.startsWith('Kota')?w:'Kabupaten '+w;}
function b2a(n){return n==='Ambon'?'Kota Ambon':n==='Tual'?'Kota Tual':'Kabupaten '+n;}
function b2w(n){return n==='Ambon'?'Kota Ambon':n==='Tual'?'Kota Tual':n;}
const PEMDA_INF={'Kota Ambon':'Ambon','Kota Tual':'Tual','Kabupaten Maluku Tengah':'MalukuTengah'};

// ═══ STATE ═══
let D={apbn:[],apbd:[],inflasi:[],pdrb:[],penduduk:[],kemiskinan:[],ipm:[],pengangguran:[],gini:[],geo:null};
let source='djpb',tab='apbn',apbnY,apbnM,apbnYoY=false,apbdM,apbdMetric='pendapatan';
let charts={},lmap=null,glayer=null;

// ═══ LOAD ═══
async function fcsv(p){const r=await fetch(p);if(!r.ok)throw new Error(p);return Papa.parse((await r.text()).trim(),{header:true,skipEmptyLines:true,dynamicTyping:false}).data;}
async function loadAll(){
  try{
    const[a,b,c,p,pop,k,ipm,ng,gi,geo]=await Promise.all([
      fcsv(FILES.apbn).catch(()=>[]),fcsv(FILES.apbd).catch(()=>[]),fcsv(FILES.inflasi).catch(()=>[]),
      fcsv(FILES.pdrb).catch(()=>[]),fcsv(FILES.penduduk).catch(()=>[]),fcsv(FILES.kemiskinan).catch(()=>[]),
      fcsv(FILES.ipm).catch(()=>[]),fcsv(FILES.pengangguran).catch(()=>[]),fcsv(FILES.gini).catch(()=>[]),
      fetch(FILES.geo).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    D.apbn=a.filter(r=>r.thang&&r.komp_ang).map(r=>({thn:+r.thang,bln:+r.bulan,cut:r.tgl_cutoff,kode:r.komp_ang.trim(),pagu:+r.pagu_target||0,real:+r.realisasi||0}));
    D.apbd=b.filter(r=>r.thang).map(r=>({thn:+r.thang,bln:+r.bulan,cut:r.tgl_cutoff,pemda:r.nama_pemda.trim(),pendapatan:+r.pendapatan||0,belanja:+r.belanja||0,pembiayaan:+r.pembiayaan||0,silpa:+r.SILPA||0}));
    D.inflasi=c.filter(r=>r.waktu).map(r=>({waktu:r.waktu.trim(),loc:r.nama_pemda.trim(),mom:r.inflasi_bulanan!==''&&r.inflasi_bulanan!=null?+r.inflasi_bulanan:null,yoy:r.inflasi_tahunan!==''&&r.inflasi_tahunan!=null?+r.inflasi_tahunan:null}));
    D.pdrb=p.map(r=>({kk:r.kab_kota.trim(),adhb:+r.pdrb_adhb_q1||0,qtq:+r.growth_qtq_q1||0}));
    D.penduduk=pop.map(r=>({kk:r.kab_kota.trim(),p24:+r.pop_2024||0,p25:+r.pop_2025||0,p26:+r.pop_2026||0}));
    D.kemiskinan=k.map(r=>({kk:r.kab_kota.trim(),m23:+r.miskin_2023||0,m24:+r.miskin_2024||0,m25:+r.miskin_2025||0}));
    D.ipm=ipm.map(r=>({kk:r.kab_kota.trim(),i23:+r.ipm_2023||0,i24:+r.ipm_2024||0,i25:+r.ipm_2025||0}));
    D.pengangguran=ng.map(r=>({kk:r.kab_kota.trim(),n23:+r.nganggur_2023||0,n24:+r.nganggur_2024||0,n25:+r.nganggur_2025||0}));
    D.gini=gi.map(r=>({kk:r.kab_kota.trim(),g23:+r.gini_2023||0,g24:+r.gini_2024||0,g25:+r.gini_2025||0}));
    D.geo=geo;
    if(D.apbn.length){const yrs=[...new Set(D.apbn.map(r=>r.thn))].sort((a,b)=>b-a);apbnY=yrs[0];apbnM=Math.max(...D.apbn.filter(r=>r.thn===apbnY).map(r=>r.bln));}
    if(D.apbd.length)apbdM=Math.max(...D.apbd.map(r=>r.bln));
    render();
  }catch(e){document.getElementById('mainContent').innerHTML='<div class="errmsg">Gagal memuat: '+e.message+'</div>';}
}

// ═══ HELPERS ═══
function fmt(n){if(Math.abs(n)>=1e12)return(n/1e12).toFixed(2);if(Math.abs(n)>=1e9)return(n/1e9).toFixed(2);if(Math.abs(n)>=1e6)return(n/1e6).toFixed(1);return n.toLocaleString('id-ID');}
function fU(n){if(Math.abs(n)>=1e12)return'T';if(Math.abs(n)>=1e9)return'M';if(Math.abs(n)>=1e6)return'Jt';return'';}
function fM(n){return'Rp '+(n/1e9).toFixed(2)+' M';}
function pCl(p){return p<20?'pl':p<50?'pm':'ph';}
function bCo(p){return p<20?'#FF8F00':p<50?'#2196F3':'#66BB6A';}
function gf(t,b){return D.apbn.filter(r=>r.thn===t&&r.bln===b);}
function sg(rows,g){return rows.filter(r=>KOMP[r.kode]&&KOMP[r.kode].g===g).reduce((a,r)=>({pagu:a.pagu+r.pagu,real:a.real+r.real}),{pagu:0,real:0});}
function dC(){Object.values(charts).forEach(c=>c.destroy());charts={};}
function dM(){if(lmap){lmap.remove();lmap=null;glayer=null;}}
function cCol(v,mn,mx){if(v==null)return'#E2E8F0';const t=mx===mn?.5:Math.max(0,Math.min(1,(v-mn)/(mx-mn)));const cs=[[227,242,253],[66,165,245],[21,101,192]];const i=t<.5?0:1,lt=t<.5?t*2:(t-.5)*2;return`rgb(${Math.round(cs[i][0]+(cs[i+1][0]-cs[i][0])*lt)},${Math.round(cs[i][1]+(cs[i+1][1]-cs[i][1])*lt)},${Math.round(cs[i][2]+(cs[i+1][2]-cs[i][2])*lt)})`;}
function sCol(s){return s>=70?'#2E7D32':s>=50?'#66BB6A':s>=30?'#FF8F00':'#C62828';}
function getInf(loc){const rows=D.inflasi.filter(r=>r.loc===loc&&r.yoy!==null).sort((a,b)=>a.waktu.localeCompare(b.waktu));return rows.length?rows[rows.length-1].yoy:null;}
function bpsLookup(kk,arr,field){const r=arr.find(x=>x.kk===kk);return r?r[field]:null;}

// ═══ TABS ═══
const DJPB_TABS=[{id:'apbn',l:'APBN'},{id:'apbd',l:'APBD'},{id:'inflasi',l:'Inflasi'},{id:'analisis',l:'Analisis'}];
const BPS_TABS=[{id:'profil',l:'Profil Wilayah'},{id:'analisis',l:'Analisis'}];

function setSubTabs(){
  const tabs=source==='djpb'?DJPB_TABS:BPS_TABS;
  if(!tabs.find(t=>t.id===tab))tab=tabs[0].id;
  document.getElementById('subTabs').innerHTML=tabs.map(t=>'<div class="stab'+(t.id===tab?' active':'')+'" data-tab="'+t.id+'">'+t.l+'</div>').join('');
}

// ═══ RENDER ═══
function render(){
  dC();dM();setSubTabs();
  const main=document.getElementById('mainContent');
  document.getElementById('cutoffBadge').textContent='BAILEO';
  if(source==='djpb'){
    if(tab==='apbn')main.innerHTML=renderAPBN();
    else if(tab==='apbd')main.innerHTML=renderAPBD();
    else if(tab==='inflasi')main.innerHTML=renderInflasi();
    else main.innerHTML=renderAnalisisDJPb();
  }else{
    if(tab==='profil')main.innerHTML=renderBPS();
    else main.innerHTML=renderAnalisisFull();
  }
  bindEvents();bindCharts();
}

function bindCharts(){
  if(source==='djpb'){
    if(tab==='apbn')drawAPBN();else if(tab==='apbd'){drawAPBD();initMap('mapApbd',apbdMapStyle,apbdPopup);}
    else if(tab==='inflasi')drawInflasi();else{drawAnalDJPb();initMap('mapAnal',analMapStyle,analPopup);}
  }else{
    if(tab==='profil'){drawBPS();initMap('mapBPS',bpsMapStyle,bpsPopup);}

function computeScores(){
  const c=D.apbd.filter(r=>r.bln===apbdM&&!r.pemda.startsWith('Provinsi'));const nasI=getInf('Nasional')||2.5,malI=getInf('Maluku')||nasI;
  return c.map(r=>{const rb=r.pendapatan>0?Math.min(r.belanja/r.pendapatan,1.5):0,sB=Math.min(rb/.8*40,40),sr=r.pendapatan>0?Math.abs(r.silpa)/r.pendapatan:1,sS=Math.max(0,30-sr*30);
    const lk=PEMDA_INF[r.pemda],li=lk?getInf(lk):malI,id=li!==null?Math.abs(li-nasI):2,sI=Math.max(0,30-id*5);const tot=Math.round(sB+sS+sI);
    return{pemda:r.pemda,skor:tot,sB:Math.round(sB),sS:Math.round(sS),sI:Math.round(sI),pendapatan:r.pendapatan,belanja:r.belanja,silpa:r.silpa,rb,sr,inflasi:li,id};}).sort((a,b)=>b.skor-a.skor);}

  const totPDRB=D.pdrb.reduce((s,r)=>s+r.adhb,0);
  const totPop=D.penduduk.reduce((s,r)=>s+r.p26,0);
  const pdrbPC=totPop?(totPDRB/totPop*1e9).toFixed(0):'-'; // Rp per kapita (PDRB in Miliar)
  return`<div>
  <div class="kg">
    <div class="kc cp"><div class="kl">IPM Rata-rata 2025</div><div class="kv">${avgIPM}</div></div>
    <div class="kc cr"><div class="kl">Kemiskinan Rata-rata</div><div class="kv">${avgMiskin}<span class="u">%</span></div></div>
    <div class="kc cb2"><div class="kl">PDRB Total Q1 2026</div><div class="kv">${(totPDRB/1e3).toFixed(2)}<span class="u">T</span></div></div>
    <div class="kc cgo"><div class="kl">Gini Rata-rata</div><div class="kv">${avgGini}</div></div>
    <div class="kc cg1"><div class="kl">Penduduk 2026</div><div class="kv">${(totPop/1e6).toFixed(2)}<span class="u">Jt</span></div></div>
  </div>
  <div class="panels">
    <div class="panel"><div class="pt">PDRB ADHB Q1 2026 & Per Kapita</div><div class="cw"><canvas id="cPDRB" height="340"></canvas></div></div>
    <div class="panel"><div class="pt">Peta IPM 2025</div><div id="mapBPS" class="mc"></div><div class="ml"><span>Rendah</span><div class="lb"><span style="background:#FFCDD2"></span><span style="background:#FFF9C4"></span><span style="background:#C8E6C9"></span></div><span>Tinggi</span></div></div>
  </div>
  <div class="panels">
    <div class="panel"><div class="pt">IPM vs Kemiskinan 2025</div><div class="ps">Tiap titik = satu kab/kota</div><div class="cw"><canvas id="cIPMvsMiskin" height="280"></canvas></div></div>
    <div class="panel"><div class="pt">Tren Kemiskinan 2023–2025</div><div class="cw"><canvas id="cMiskinTrend" height="280"></canvas></div></div>
  </div>
  <div class="panel pf"><div class="pt">Profil Kab/Kota</div><div class="tw">${bpsTbl()}</div></div></div>`;}

function bpsTbl(){let h='<table class="dt"><thead><tr><th>Kab/Kota</th><th>Penduduk</th><th>PDRB (M)</th><th>PDRB/Kap (Jt)</th><th>IPM</th><th>Miskin %</th><th>Gini</th><th>Nganggur</th></tr></thead><tbody>';
  const sorted=[...D.pdrb].sort((a,b)=>b.adhb-a.adhb);
  sorted.forEach(r=>{const pop=bpsLookup(r.kk,D.penduduk,'p26')||1;const ipm=bpsLookup(r.kk,D.ipm,'i25');const mis=bpsLookup(r.kk,D.kemiskinan,'m25');const gi=bpsLookup(r.kk,D.gini,'g25');const ng=bpsLookup(r.kk,D.pengangguran,'n25');const pc=r.adhb/pop*1e9/1e6;
    h+='<tr><td>'+r.kk+'</td><td>'+pop.toLocaleString('id-ID')+'</td><td>'+r.adhb.toFixed(2)+'</td><td>'+pc.toFixed(1)+'</td><td>'+(ipm?ipm.toFixed(2):'—')+'</td><td style="color:'+(mis>20?'var(--coral)':mis>15?'var(--amber)':'var(--mint)')+'">'+(mis?mis.toFixed(2)+'%':'—')+'</td><td>'+(gi?gi.toFixed(3):'—')+'</td><td>'+(ng?ng.toLocaleString('id-ID'):'—')+'</td></tr>';});
  return h+'</tbody></table>';}

function drawBPS(){
  // PDRB bar + per capita line
  const sorted=[...D.pdrb].sort((a,b)=>b.adhb-a.adhb);const labels=sorted.map(r=>r.kk.replace('Kepulauan ','Kep. '));
  const pcData=sorted.map(r=>{const pop=bpsLookup(r.kk,D.penduduk,'p26')||1;return r.adhb/pop*1e9/1e6;});
  charts.pdrb=new Chart(document.getElementById('cPDRB'),{type:'bar',data:{labels,datasets:[{label:'PDRB (Miliar)',data:sorted.map(r=>r.adhb),backgroundColor:'#2196F3',borderRadius:4,barPercentage:.6,yAxisID:'y'},{label:'Per Kapita (Juta Rp)',data:pcData,type:'line',borderColor:'#F5A623',backgroundColor:'#F5A62333',pointRadius:5,borderWidth:2.5,yAxisID:'y1',tension:.3}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{position:'top',labels:{font:{size:10},usePointStyle:true,padding:12}}},scales:{y:{ticks:{font:{size:8}},grid:{display:false}},x:{position:'bottom',ticks:{font:{family:'JetBrains Mono',size:9}},grid:{color:'#F1F5F9'}},y1:{position:'top',ticks:{font:{family:'JetBrains Mono',size:8},callback:v=>v.toFixed(0)+'Jt'},grid:{display:false}}}}});

  // IPM vs Miskin scatter
  const scD=D.ipm.map(r=>({x:r.i25,y:bpsLookup(r.kk,D.kemiskinan,'m25')||0,l:r.kk})).filter(d=>d.y>0);
  charts.ipmMis=new Chart(document.getElementById('cIPMvsMiskin'),{type:'scatter',data:{datasets:[{data:scD.map(d=>({x:d.x,y:d.y})),backgroundColor:scD.map(d=>d.y>20?'#EF5350':d.y>15?'#FF8F00':'#66BB6A'),pointRadius:8,pointHoverRadius:11}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>scD[items[0].dataIndex].l,label:ctx=>'IPM: '+scD[ctx.dataIndex].x.toFixed(2)+' | Miskin: '+scD[ctx.dataIndex].y.toFixed(2)+'%'}}},scales:{x:{title:{display:true,text:'IPM',font:{size:10,weight:'600'},color:'#64748B'},grid:{color:'#F1F5F9'}},y:{title:{display:true,text:'Kemiskinan (%)',font:{size:10,weight:'600'},color:'#64748B'},grid:{color:'#F1F5F9'},ticks:{callback:v=>v+'%'}}}}});

  // Kemiskinan trend
  const kks=D.kemiskinan.map(r=>r.kk);
  charts.misTrend=new Chart(document.getElementById('cMiskinTrend'),{type:'line',data:{labels:['2023','2024','2025'],datasets:kks.map((k,i)=>({label:k.replace('Kepulauan ','Kep. '),data:[bpsLookup(k,D.kemiskinan,'m23'),bpsLookup(k,D.kemiskinan,'m24'),bpsLookup(k,D.kemiskinan,'m25')],borderColor:KAB_PAL[i%KAB_PAL.length],tension:.3,pointRadius:4,borderWidth:2,fill:false}))},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{font:{size:8},usePointStyle:true,boxWidth:8,padding:8}},tooltip:{mode:'index',intersect:false}},scales:{x:{grid:{display:false}},y:{grid:{color:'#F1F5F9'},ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v+'%'}}}}});
}
function bpsMapStyle(f){const w=f.properties.WADMKK;const kk=w.startsWith('Kota')?w.replace('Kota ',''):w;const r=D.ipm.find(x=>x.kk===kk||x.kk===w.replace('Kota ',''));const v=r?r.i25:null;if(!v)return{fillColor:'#E2E8F0',weight:1.5,color:'#fff',fillOpacity:.7};const mn=60,mx=85;const t=Math.max(0,Math.min(1,(v-mn)/(mx-mn)));const col=t<.33?`rgb(${239},${83+t*3*100},${80})`:t<.66?`rgb(${255},${235},${59})`:(`rgb(${102-t*60},${187},${106})`);return{fillColor:col,weight:1.5,color:'#fff',fillOpacity:.75};}
function bpsPopup(f){const w=f.properties.WADMKK;const kk=w.startsWith('Kota')?w.replace('Kota ',''):w;const ipm=D.ipm.find(x=>x.kk===kk||x.kk===w.replace('Kota ',''));const mis=D.kemiskinan.find(x=>x.kk===kk||x.kk===w.replace('Kota ',''));const pop=D.penduduk.find(x=>x.kk===kk||x.kk===w.replace('Kota ',''));
  let h='<div class="ppt">'+w+'</div>';if(ipm)h+='<div class="ppr"><span class="pl2">IPM 2025</span><span class="pv2">'+ipm.i25.toFixed(2)+'</span></div>';if(mis)h+='<div class="ppr"><span class="pl2">Kemiskinan</span><span class="pv2" style="color:'+(mis.m25>20?'var(--coral)':'var(--mint)')+'">'+mis.m25.toFixed(2)+'%</span></div>';if(pop)h+='<div class="ppr"><span class="pl2">Penduduk</span><span class="pv2">'+pop.p26.toLocaleString()+'</span></div>';return h;}

// ═══ FULL ANALISIS (BPS + DJPb cross) ═══
function renderAnalisisFull(){
  if(!D.pdrb.length||!D.apbd.length)return'<div class="errmsg">Data BPS + APBD diperlukan</div>';
  const c=D.apbd.filter(r=>r.bln===apbdM&&!r.pemda.startsWith('Provinsi'));
  // Build cross data
  const cross=D.pdrb.map(r=>{
    const apem=b2a(r.kk),arw=c.find(x=>x.pemda===apem);
    const pop=bpsLookup(r.kk,D.penduduk,'p26')||1;const ipm=bpsLookup(r.kk,D.ipm,'i25')||0;const mis=bpsLookup(r.kk,D.kemiskinan,'m25')||0;const gi=bpsLookup(r.kk,D.gini,'g25')||0;
    const bel=arw?arw.belanja:0,pend=arw?arw.pendapatan:0,silpa=arw?arw.silpa:0;
    const belPC=bel/pop,belPDRB=r.adhb>0?bel/1e9/r.adhb*100:0; // belanja as % of PDRB (annualized rough)
    return{kk:r.kk,pemda:apem,pdrb:r.adhb,qtq:r.qtq,pop,ipm,mis,gi,bel,pend,silpa,belPC,belPDRB};
  }).sort((a,b)=>b.pdrb-a.pdrb);

  // Insights
  const highMisBel=cross.filter(r=>r.mis>20&&r.belPC<cross.reduce((s,r)=>s+r.belPC,0)/cross.length);
  let ins=`Analisis lintas data: `;
  if(highMisBel.length)ins+=`<strong>${highMisBel.map(r=>r.kk).join(', ')}</strong> memiliki kemiskinan >20% namun belanja per kapita di bawah rata-rata — potensi under-investment. `;
  const topPDRBpc=cross.map(r=>({kk:r.kk,pc:r.pdrb/r.pop*1e9/1e6})).sort((a,b)=>b.pc-a.pc);
  ins+=`PDRB per kapita tertinggi: <strong>${topPDRBpc[0].kk}</strong> (Rp ${topPDRBpc[0].pc.toFixed(1)} Jt), terendah: <strong>${topPDRBpc[topPDRBpc.length-1].kk}</strong> (Rp ${topPDRBpc[topPDRBpc.length-1].pc.toFixed(1)} Jt).`;

  return`<div><div class="insight">${ins}</div>
  <div class="panels">
    <div class="panel"><div class="pt">Belanja per Kapita vs Kemiskinan</div><div class="ps">Titik merah = kemiskinan >20% & belanja rendah</div><div class="cw"><canvas id="cBelPC" height="300"></canvas></div></div>
    <div class="panel"><div class="pt">Peta Belanja per Kapita</div><div id="mapFull" class="mc"></div><div class="ml"><span>Rendah</span><div class="lb"><span style="background:#E3F2FD"></span><span style="background:#42A5F5"></span><span style="background:#1565C0"></span></div><span>Tinggi</span></div></div>
  </div>
  <div class="panels">
    <div class="panel"><div class="pt">Belanja / PDRB (%)</div><div class="ps">Intensitas fiskal relatif terhadap ukuran ekonomi lokal</div><div class="cw"><canvas id="cBelPDRB" height="300"></canvas></div></div>
    <div class="panel"><div class="pt">Pertumbuhan PDRB vs Gini</div><div class="ps">Kualitas pertumbuhan — apakah inklusif?</div><div class="cw"><canvas id="cGrowthGini" height="300"></canvas></div></div>
  </div>
  <div class="panel pf"><div class="pt">Tabel Lintas Data</div><div class="tw">${crossTbl(cross)}</div></div></div>`;}

function crossTbl(cross){let h='<table class="dt"><thead><tr><th>Kab/Kota</th><th>Penduduk</th><th>PDRB (M)</th><th>PDRB/Kap</th><th>Belanja/Kap</th><th>Bel/PDRB</th><th>IPM</th><th>Miskin</th><th>Gini</th></tr></thead><tbody>';
  cross.forEach(r=>{const pc=r.pdrb/r.pop*1e9/1e6;
    h+='<tr><td>'+r.kk+'</td><td>'+r.pop.toLocaleString('id-ID')+'</td><td>'+r.pdrb.toFixed(0)+'</td><td>'+pc.toFixed(1)+' Jt</td><td>Rp '+(r.belPC/1e3).toFixed(0)+' rb</td><td>'+r.belPDRB.toFixed(1)+'%</td><td>'+r.ipm.toFixed(2)+'</td><td style="color:'+(r.mis>20?'var(--coral)':'var(--mint)')+'">'+r.mis.toFixed(2)+'%</td><td>'+r.gi.toFixed(3)+'</td></tr>';});
  return h+'</tbody></table>';}

function drawAnalFull(){
  const c=D.apbd.filter(r=>r.bln===apbdM&&!r.pemda.startsWith('Provinsi'));
  const cross=D.pdrb.map(r=>{const apem=b2a(r.kk),arw=c.find(x=>x.pemda===apem);const pop=bpsLookup(r.kk,D.penduduk,'p26')||1;const mis=bpsLookup(r.kk,D.kemiskinan,'m25')||0;const gi=bpsLookup(r.kk,D.gini,'g25')||0;const bel=arw?arw.belanja:0;return{kk:r.kk,pdrb:r.adhb,qtq:r.qtq,pop,mis,gi,bel,belPC:bel/pop,belPDRB:r.adhb>0?bel/1e9/r.adhb*100:0};});
  const avgBPC=cross.reduce((s,r)=>s+r.belPC,0)/cross.length;

  // Belanja per capita vs Kemiskinan
  charts.belPC=new Chart(document.getElementById('cBelPC'),{type:'scatter',data:{datasets:[{data:cross.map(r=>({x:r.belPC/1e6,y:r.mis})),backgroundColor:cross.map(r=>r.mis>20&&r.belPC<avgBPC?'#EF5350':'#2196F3'),pointRadius:8,pointHoverRadius:11}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>cross[items[0].dataIndex].kk,label:ctx=>'Bel/Kap: Rp '+cross[ctx.dataIndex].belPC.toFixed(0)+' | Miskin: '+cross[ctx.dataIndex].mis.toFixed(2)+'%'}}},scales:{x:{title:{display:true,text:'Belanja per Kapita (Juta Rp)',font:{size:10,weight:'600'},color:'#64748B'},grid:{color:'#F1F5F9'}},y:{title:{display:true,text:'Kemiskinan (%)',font:{size:10,weight:'600'},color:'#64748B'},grid:{color:'#F1F5F9'},ticks:{callback:v=>v+'%'}}}}});

  // Belanja/PDRB bar
  const sorted=[...cross].sort((a,b)=>b.belPDRB-a.belPDRB);
  charts.belPDRB=new Chart(document.getElementById('cBelPDRB'),{type:'bar',data:{labels:sorted.map(r=>r.kk.replace('Kepulauan ','Kep. ')),datasets:[{data:sorted.map(r=>r.belPDRB),backgroundColor:sorted.map(r=>r.belPDRB>10?'#2196F3':r.belPDRB>5?'#66BB6A':'#FF8F00'),borderRadius:4,barPercentage:.7}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'Belanja/PDRB: '+c.parsed.x.toFixed(1)+'%'}}},scales:{y:{ticks:{font:{size:8}},grid:{display:false}},x:{grid:{color:'#F1F5F9'},ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v+'%'}}}}});

  // Growth vs Gini scatter
  charts.growGini=new Chart(document.getElementById('cGrowthGini'),{type:'scatter',data:{datasets:[{data:cross.map(r=>({x:r.qtq,y:r.gi})),backgroundColor:cross.map(r=>r.qtq<-5?'#EF5350':r.gi>.28?'#FF8F00':'#66BB6A'),pointRadius:8,pointHoverRadius:11}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>cross[items[0].dataIndex].kk,label:ctx=>'Growth: '+cross[ctx.dataIndex].qtq.toFixed(2)+'% | Gini: '+cross[ctx.dataIndex].gi.toFixed(3)}}},scales:{x:{title:{display:true,text:'Pertumbuhan PDRB q-to-q (%)',font:{size:10,weight:'600'},color:'#64748B'},grid:{color:'#F1F5F9'},ticks:{callback:v=>v+'%'}},y:{title:{display:true,text:'Gini Rasio',font:{size:10,weight:'600'},color:'#64748B'},grid:{color:'#F1F5F9'}}}}});
}
function fullMapStyle(f){const c=D.apbd.filter(r=>r.bln===apbdM&&!r.pemda.startsWith('Provinsi'));const cross=D.pdrb.map(r=>{const apem=b2a(r.kk);const arw=c.find(x=>x.pemda===apem);const pop=bpsLookup(r.kk,D.penduduk,'p26')||1;return{kk:r.kk,belPC:arw?arw.belanja/pop:0};});const vals=cross.map(r=>r.belPC);const mn=Math.min(...vals),mx=Math.max(...vals);const p=w2a(f.properties.WADMKK);const kk=f.properties.WADMKK.startsWith('Kota')?f.properties.WADMKK.replace('Kota ',''):f.properties.WADMKK;const r=cross.find(x=>x.kk===kk||x.kk===f.properties.WADMKK.replace('Kota ',''));return{fillColor:cCol(r?r.belPC:0,mn,mx),weight:1.5,color:'#fff',fillOpacity:.8};}
function fullPopup(f){const w=f.properties.WADMKK;const kk=w.startsWith('Kota')?w.replace('Kota ',''):w;const c=D.apbd.filter(r=>r.bln===apbdM&&!r.pemda.startsWith('Provinsi'));const apem=b2a(kk==='Ambon'?'Ambon':kk==='Tual'?'Tual':kk);const arw=c.find(x=>x.pemda===apem)||c.find(x=>x.pemda===w2a(w));const pop=D.penduduk.find(x=>x.kk===kk||x.kk===(w.startsWith('Kota')?w.replace('Kota ',''):w));const pd=D.pdrb.find(x=>x.kk===kk||x.kk===(w.startsWith('Kota')?w.replace('Kota ',''):w));
  let h='<div class="ppt">'+w+'</div>';if(arw&&pop){h+='<div class="ppr"><span class="pl2">Bel/Kapita</span><span class="pv2">Rp '+(arw.belanja/pop.p26/1e3).toFixed(0)+' rb</span></div>';}if(pd){h+='<div class="ppr"><span class="pl2">PDRB Q1</span><span class="pv2">'+pd.adhb.toFixed(0)+' M</span></div>';}return h;}

// ═══ MAP GENERIC ═══
function initMap(id,styleFn,popupFn){
  if(!D.geo||!document.getElementById(id))return;
  lmap=L.map(id,{scrollWheelZoom:false}).setView([-3.7,128.2],6);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{attribution:'©CartoDB',maxZoom:12}).addTo(lmap);
  glayer=L.geoJSON(D.geo,{style:styleFn,onEachFeature:(f,layer)=>{layer.bindPopup(popupFn(f));layer.on('mouseover',()=>layer.setStyle({weight:3,color:'#1565C0',fillOpacity:.9}));layer.on('mouseout',()=>glayer.resetStyle(layer));}}).addTo(lmap);
  lmap.fitBounds(glayer.getBounds().pad(0.05));
}

// ═══ EVENTS ═══
function bindEvents(){
  const sY=document.getElementById('sY'),sM=document.getElementById('sM'),bY=document.getElementById('bYoY'),sMa=document.getElementById('sMa'),sMe=document.getElementById('sMe');
  if(sY)sY.onchange=e=>{apbnY=+e.target.value;apbnM=Math.max(...D.apbn.filter(r=>r.thn===apbnY).map(r=>r.bln));render();};
  if(sM)sM.onchange=e=>{apbnM=+e.target.value;render();};
  if(bY)bY.onclick=()=>{apbnYoY=!apbnYoY;render();};
  if(sMa)sMa.onchange=e=>{apbdM=+e.target.value;render();};
  if(sMe)sMe.onchange=e=>{apbdMetric=e.target.value;render();};
}
document.getElementById('subTabs').addEventListener('click',e=>{const t=e.target.dataset?.tab;if(t){tab=t;render();}});
document.getElementById('srcDJPb').addEventListener('click',()=>{source='djpb';tab='apbn';document.getElementById('srcDJPb').classList.add('active');document.getElementById('srcBPS').classList.remove('active');render();});
document.getElementById('srcBPS').addEventListener('click',()=>{source='bps';tab='profil';document.getElementById('srcBPS').classList.add('active');document.getElementById('srcDJPb').classList.remove('active');render();});
loadAll();
</script>
