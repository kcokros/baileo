<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAILEO — Bank Indonesia · Dashboard Kewilayahan Provinsi Maluku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--navy:#0A1628;--deep:#122240;--slate:#1B3A5C;--ocean:#1565A0;--sky:#2196F3;--cyan:#26C6DA;--gold:#F5A623;--amber:#FF8F00;--coral:#EF5350;--mint:#66BB6A;--purple:#7E57C2;--teal:#00897B;--surface:#F4F7FC;--card:#FFFFFF;--border:#E2E8F0;--text:#1E293B;--sub:#64748B;--muted:#94A3B8;--radius:12px;--shadow:0 1px 3px rgba(10,22,40,.06),0 4px 12px rgba(10,22,40,.04)}
*{margin:0;padding:0;box-sizing:border-box}html{font-size:15px}body{font-family:'Inter',system-ui,sans-serif;background:var(--surface);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,var(--navy) 0%,var(--slate) 50%,var(--ocean) 100%);position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-50%;left:-20%;width:140%;height:200%;background:radial-gradient(ellipse at 30% 80%,rgba(33,150,243,.12) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(38,198,218,.08) 0%,transparent 50%);pointer-events:none}
.hi{max-width:1440px;margin:0 auto;padding:1.4rem 2rem 0;position:relative;z-index:1}
.ht{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.hb h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.45rem;color:#fff;letter-spacing:-0.02em;line-height:1.2}
.hb h1 span{display:block;font-weight:500;font-size:.78rem;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.hb .bm{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:2px;display:block}
.hb .ba{font-size:.58rem;font-weight:400;letter-spacing:.04em;color:rgba(255,255,255,.22);margin-top:2px;display:block;text-transform:none;font-family:'Inter',sans-serif}
.cb{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:.75rem;font-weight:500;padding:.3rem .7rem;border-radius:99px;font-family:'JetBrains Mono',monospace}
.st{display:flex;gap:0;margin-top:1.2rem}.stb{padding:.6rem 1.3rem;font-size:.8rem;font-weight:600;color:rgba(255,255,255,.4);border-radius:var(--radius) var(--radius) 0 0;cursor:pointer;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif;text-decoration:none}.stb.active{background:var(--surface);color:var(--ocean);cursor:default}
.sub-tabs{display:flex;gap:2px;background:var(--card);border-bottom:1.5px solid var(--border);max-width:1440px;margin:0 auto;padding:0 2rem}
.stab{padding:.7rem 1.2rem;font-size:.8rem;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s;font-family:'Plus Jakarta Sans',sans-serif}.stab:hover{color:var(--text)}.stab.active{color:var(--ocean);border-bottom-color:var(--ocean)}
.main{max-width:1440px;margin:0 auto;padding:1.5rem 2rem 3rem}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-bottom:1.4rem}
.kc{background:var(--card);border-radius:var(--radius);padding:1rem 1.1rem;box-shadow:var(--shadow);border:1px solid var(--border);position:relative;overflow:hidden}.kc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kc.cg1::before{background:var(--mint)}.kc.cr::before{background:var(--coral)}.kc.cb2::before{background:var(--sky)}.kc.cgo::before{background:var(--gold)}.kc.cp::before{background:var(--purple)}.kc.cc::before{background:var(--cyan)}.kc.ct::before{background:var(--teal)}
.kl{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin-bottom:.4rem}
.kv{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.45rem;font-weight:800;letter-spacing:-0.03em;color:var(--text);line-height:1.1}.kv .u{font-size:.65rem;font-weight:600;color:var(--sub);margin-left:2px}
.ks{display:flex;align-items:center;gap:.5rem;margin-top:.4rem;font-size:.7rem;color:var(--sub);flex-wrap:wrap}
.kpa{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted)}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.4rem}
.panel{background:var(--card);border-radius:var(--radius);padding:1.2rem;box-shadow:var(--shadow);border:1px solid var(--border)}
.pt{font-family:'Plus Jakarta Sans',sans-serif;font-size:.85rem;font-weight:700;color:var(--text);margin-bottom:.9rem}
.ps{font-size:.72rem;color:var(--sub);margin-top:-.5rem;margin-bottom:.9rem}
.pf{grid-column:1/-1}
.cw{position:relative;width:100%}.cw canvas{width:100%!important}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.dt{width:100%;border-collapse:collapse;font-size:.76rem}
table.dt thead th{font-family:'Plus Jakarta Sans',sans-serif;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);padding:.55rem .6rem;text-align:right;border-bottom:2px solid var(--border);white-space:nowrap}table.dt thead th:first-child{text-align:left}
table.dt tbody td{padding:.5rem .6rem;text-align:right;font-family:'JetBrains Mono',monospace;font-size:.74rem;border-bottom:1px solid var(--border);white-space:nowrap}table.dt tbody td:first-child{text-align:left;font-family:'Inter',sans-serif;font-weight:500;color:var(--text)}
table.dt tbody tr:hover{background:#F8FAFD}
.insight{background:linear-gradient(135deg,#EBF5FF,#F0F7FF);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.2rem;margin-bottom:1rem;font-size:.8rem;color:var(--slate);line-height:1.6}.insight strong{color:var(--text)}
.footer{max-width:1440px;margin:0 auto;padding:1rem 2rem;text-align:center;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border)}
.loading{display:flex;align-items:center;justify-content:center;min-height:50vh;gap:.7rem;color:var(--sub);font-weight:500}
.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--ocean);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.errmsg{background:#FFF3F3;border:1px solid #FECACA;border-radius:var(--radius);padding:1.5rem;text-align:center;color:var(--coral);font-weight:500;margin:2rem}
@media(max-width:900px){.panels{grid-template-columns:1fr}.main{padding:1rem}.hi{padding:1rem 1rem 0}.sub-tabs{padding:0 1rem}}
@media(max-width:600px){html{font-size:14px}.kg{grid-template-columns:1fr 1fr}.kv{font-size:1.2rem}.hb h1{font-size:1.15rem}.stab{padding:.6rem .7rem;font-size:.73rem}}
</style>
</head>
<body>
<header class="header"><div class="hi"><div class="ht">
<div class="hb"><h1><span class="bm">BAILEO</span><span>Kanwil DJPb Provinsi Maluku</span>Dashboard Kewilayahan Data Provinsi Maluku<span class="ba">Bingkai Analitik Interaktif Laporan Ekonomi Operasional</span></h1></div>
<div><span class="cb" id="cutoffBadge">—</span></div>
</div><div class="st">
<a href="djpb.html" class="stb">DJPb</a>
<a href="bps.html" class="stb">BPS</a>
<a href="ojk.html" class="stb">OJK</a>
<div class="stb active">Bank Indonesia</div>
</div></div></header>
<nav class="sub-tabs" id="subTabs"></nav>
<main class="main" id="mainContent"><div class="loading"><div class="spinner"></div><span>Memuat data…</span></div></main>
<footer class="footer"><a href="index.html" style="color:var(--ocean);text-decoration:none">← Beranda</a> · Sumber data: DJPb · BPS · OJK · Bank Indonesia</footer>

<script>
const FILES={arus:'data/bi/arus_uang.csv',birate:'data/bi/bi_rate.csv',qris:'data/bi/qris.csv'};

let D={arus:[],birate:[],qris:[]};
let tab='arus';
let charts={};

async function fcsv(p){const r=await fetch(p);if(!r.ok)throw new Error(p);return Papa.parse((await r.text()).trim(),{header:true,skipEmptyLines:true,dynamicTyping:false,delimitersToGuess:[',',';','\t','|']}).data;}

async function loadAll(){
  try{
    const[a,b,q]=await Promise.all([fcsv(FILES.arus).catch(()=>[]),fcsv(FILES.birate).catch(()=>[]),fcsv(FILES.qris).catch(()=>[])]);
    D.arus=a.map(r=>({p:r.periode.trim(),inf:+r.inflow_rp_juta||0,out:+r.outflow_rp_juta||0,net:+r.net_flow_rp_juta||0}));
    D.birate=b.map(r=>({p:r.periode.trim(),rate:+r.bi_rate_persen||0}));
    D.qris=q.map(r=>({p:r.periode.trim(),vol:+r.volume_transaksi||0,val:+r.nilai_rp_juta||0}));
    if(D.arus.length){document.getElementById('cutoffBadge').textContent='s.d. '+D.arus[D.arus.length-1].p;}
    render();
  }catch(e){document.getElementById('mainContent').innerHTML='<div class="errmsg">Gagal memuat: '+e.message+'</div>';}
}

function fmt(n){if(Math.abs(n)>=1e6)return(n/1e6).toFixed(2);if(Math.abs(n)>=1e3)return(n/1e3).toFixed(1);return n.toFixed(1);}
function fU(n){if(Math.abs(n)>=1e6)return'T Rp';if(Math.abs(n)>=1e3)return'M Rp';return'Jt Rp';}
function dC(){Object.values(charts).forEach(c=>c.destroy());charts={};}
function qLabel(p){return p.replace('20','\'').replace('-','·');}

const TABS=[{id:'arus',l:'Arus Uang'},{id:'moneter',l:'BI Rate & Digital'}];
function render(){dC();
document.getElementById('subTabs').innerHTML=TABS.map(t=>'<div class="stab'+(t.id===tab?' active':'')+'" data-tab="'+t.id+'">'+t.l+'</div>').join('');
const main=document.getElementById('mainContent');
if(tab==='arus')main.innerHTML=renderArus();
else main.innerHTML=renderMoneter();
drawCharts();}
function drawCharts(){if(tab==='arus')drawArus();else drawMoneter();}

// ═══ ARUS UANG ═══
function renderArus(){if(!D.arus.length)return'<div class="errmsg">arus_uang.csv tidak ditemukan</div>';
const last=D.arus[D.arus.length-1],prev=D.arus[D.arus.length-2];
const annualNet={};D.arus.forEach(r=>{const y=r.p.split('-')[0];if(!annualNet[y])annualNet[y]=0;annualNet[y]+=r.net;});
const years=Object.keys(annualNet).sort();const lastFullYear=years.filter(y=>D.arus.filter(r=>r.p.startsWith(y)).length===4).pop();
const avgQ1=D.arus.filter(r=>r.p.endsWith('Q1')).reduce((s,r)=>s+r.inf,0)/D.arus.filter(r=>r.p.endsWith('Q1')).length;
let ins=`Pola musiman konsisten: <strong>Q1 inflow besar</strong> (rata-rata Rp ${(avgQ1/1e3).toFixed(0)} Miliar), diikuti outflow neto Q2–Q4. `;
if(lastFullYear)ins+=`Net flow ${lastFullYear}: <strong>Rp ${(annualNet[lastFullYear]/1e3).toFixed(1)} Miliar</strong>. `;
ins+=`Data terakhir: <strong>${last.p}</strong> — net ${last.net>=0?'inflow':'outflow'} Rp ${(Math.abs(last.net)/1e3).toFixed(1)} Miliar.`;
return`<div>
<p style="font-size:.72rem;color:var(--sub);margin-bottom:1rem"><em>Arus uang masuk-keluar Provinsi Maluku, triwulanan. Satuan: Rp Juta. Sumber: Bank Indonesia.</em></p>
<div class="kg">
  <div class="kc cg1"><div class="kl">Inflow ${last.p}</div><div class="kv">${fmt(last.inf)}<span class="u">${fU(last.inf)}</span></div></div>
  <div class="kc cr"><div class="kl">Outflow ${last.p}</div><div class="kv">${fmt(Math.abs(last.out))}<span class="u">${fU(Math.abs(last.out))}</span></div></div>
  <div class="kc ${last.net>=0?'cb2':'cgo'}"><div class="kl">Net Flow ${last.p}</div><div class="kv">${last.net>=0?'+':''}${fmt(last.net)}<span class="u">${fU(Math.abs(last.net))}</span></div></div>
  ${lastFullYear?'<div class="kc cp"><div class="kl">Net Flow '+lastFullYear+' (setahun)</div><div class="kv">'+(annualNet[lastFullYear]>=0?'+':'')+fmt(annualNet[lastFullYear])+'<span class="u">'+fU(Math.abs(annualNet[lastFullYear]))+'</span></div></div>':''}
</div>
<div class="insight">${ins}</div>
<div class="panels"><div class="panel pf"><div class="pt">Arus Uang Triwulanan — Inflow, Outflow & Net</div><div class="ps">Bar hijau = inflow, bar merah = outflow (abs), garis biru = net flow</div><div class="cw"><canvas id="cArus" height="320"></canvas></div></div></div>
<div class="panels"><div class="panel"><div class="pt">Net Flow Tahunan</div><div class="cw"><canvas id="cArusYear" height="260"></canvas></div></div><div class="panel"><div class="pt">Net Flow per Kuartal (Pola Musiman)</div><div class="cw"><canvas id="cArusSeason" height="260"></canvas></div></div></div>
<div class="panel pf"><div class="pt">Rincian Arus Uang</div><div class="tw">${arusTbl()}</div></div></div>`;
}
function arusTbl(){let h='<table class="dt"><thead><tr><th>Periode</th><th>Inflow</th><th>Outflow</th><th>Net Flow</th></tr></thead><tbody>';[...D.arus].reverse().forEach(r=>{h+='<tr><td>'+r.p+'</td><td>'+(r.inf/1e3).toFixed(1)+'</td><td style="color:var(--coral)">'+(r.out/1e3).toFixed(1)+'</td><td style="color:'+(r.net>=0?'var(--mint)':'var(--coral)')+';font-weight:700">'+(r.net>=0?'+':'')+(r.net/1e3).toFixed(1)+'</td></tr>';});return h+'</tbody></table><p style="font-size:.68rem;color:var(--muted);margin-top:.5rem">Satuan: Miliar Rp</p>';}
function drawArus(){
charts.arus=new Chart(document.getElementById('cArus'),{type:'bar',data:{labels:D.arus.map(r=>qLabel(r.p)),datasets:[
  {label:'Inflow',data:D.arus.map(r=>r.inf/1e3),backgroundColor:'#66BB6A',borderRadius:3,barPercentage:.8,order:2},
  {label:'Outflow',data:D.arus.map(r=>Math.abs(r.out)/1e3),backgroundColor:'#EF5350',borderRadius:3,barPercentage:.8,order:2},
  {label:'Net Flow',data:D.arus.map(r=>r.net/1e3),type:'line',borderColor:'#1565C0',backgroundColor:'#1565C022',borderWidth:2.5,pointRadius:3,tension:.3,fill:true,order:1}
]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',labels:{font:{size:10},usePointStyle:true,padding:12}},tooltip:{mode:'index',intersect:false,callbacks:{label:c=>c.dataset.label+': Rp '+c.parsed.y.toFixed(1)+' M'}}},scales:{x:{ticks:{font:{size:8},maxRotation:45},grid:{display:false}},y:{ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v.toLocaleString()},grid:{color:'#F1F5F9'}}}}});
// Annual
const annualNet={};D.arus.forEach(r=>{const y=r.p.split('-')[0];if(!annualNet[y])annualNet[y]=0;annualNet[y]+=r.net;});const yrs=Object.keys(annualNet).sort();
charts.arusYear=new Chart(document.getElementById('cArusYear'),{type:'bar',data:{labels:yrs,datasets:[{data:yrs.map(y=>annualNet[y]/1e3),backgroundColor:yrs.map(y=>annualNet[y]>=0?'#66BB6A':'#EF5350'),borderRadius:4,barPercentage:.65}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'Net: '+(c.parsed.y>=0?'+':'')+c.parsed.y.toFixed(1)+' M'}}},scales:{x:{ticks:{font:{size:10}},grid:{display:false}},y:{ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v.toLocaleString()},grid:{color:'#F1F5F9'}}}}});
// Seasonal pattern
const quarters=['Q1','Q2','Q3','Q4'];const yrList=[...new Set(D.arus.map(r=>r.p.split('-')[0]))].sort();
charts.arusSeason=new Chart(document.getElementById('cArusSeason'),{type:'line',data:{labels:quarters,datasets:yrList.map((y,i)=>({label:y,data:quarters.map(q=>{const r=D.arus.find(x=>x.p===y+'-'+q);return r?r.net/1e3:null;}),borderColor:['#94A3B8','#94A3B8','#94A3B8','#7E57C2','#F5A623','#2196F3','#1565C0'][i%7],borderWidth:y===yrList[yrList.length-1]?3:1.5,borderDash:y===yrList[yrList.length-1]?[]:[4,3],tension:.3,pointRadius:y===yrList[yrList.length-1]?5:2,fill:false}))},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{font:{size:8},usePointStyle:true,boxWidth:8,padding:8}},tooltip:{mode:'index',intersect:false}},scales:{x:{grid:{display:false}},y:{ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v.toLocaleString()},grid:{color:'#F1F5F9'}}}}});}

// ═══ BI RATE & DIGITAL ═══
function renderMoneter(){
const lastRate=D.birate.length?D.birate[D.birate.length-1]:null;
const prevRate=D.birate.length>1?D.birate[D.birate.length-2]:null;
const rateDelta=lastRate&&prevRate?lastRate.rate-prevRate.rate:0;
const lastQ=D.qris.length?D.qris[D.qris.length-1]:null;
const prevQ=D.qris.length>1?D.qris[D.qris.length-2]:null;
const qVolGrowth=lastQ&&prevQ&&prevQ.vol>0?((lastQ.vol-prevQ.vol)/prevQ.vol*100):0;
const firstQ=D.qris.length?D.qris[0]:null;
const totalGrowth=firstQ&&lastQ&&firstQ.vol>0?((lastQ.vol/firstQ.vol-1)*100):0;
let ins='';
if(lastRate)ins+=`BI Rate saat ini <strong>${lastRate.rate}%</strong> (${lastRate.p})${rateDelta!==0?' — '+(rateDelta>0?'naik':'turun')+' '+Math.abs(rateDelta*100).toFixed(0)+' bps dari kuartal lalu':''}. `;
if(lastQ)ins+=`Volume transaksi QRIS Maluku tumbuh <strong>${totalGrowth.toFixed(0)}%</strong> sejak ${firstQ.p}, mencapai <strong>${lastQ.vol.toLocaleString('id-ID',{maximumFractionDigits:0})} ribu transaksi</strong> di ${lastQ.p}.`;
return`<div>
<div class="kg">
  ${lastRate?'<div class="kc cgo"><div class="kl">BI Rate '+lastRate.p+'</div><div class="kv">'+lastRate.rate.toFixed(2)+'<span class="u">%</span></div><div class="ks"><span class="kpa">'+(rateDelta>0?'▲':rateDelta<0?'▼':'—')+' '+(rateDelta!==0?Math.abs(rateDelta*100).toFixed(0)+' bps':'Tetap')+'</span></div></div>':''}
  ${lastQ?'<div class="kc ct"><div class="kl">QRIS Volume '+lastQ.p+'</div><div class="kv">'+lastQ.vol.toFixed(0)+'<span class="u">ribu trx</span></div><div class="ks"><span class="kpa">QoQ: '+(qVolGrowth>=0?'+':'')+qVolGrowth.toFixed(1)+'%</span></div></div>':''}
  ${lastQ?'<div class="kc cp"><div class="kl">QRIS Nilai '+lastQ.p+'</div><div class="kv">'+fmt(lastQ.val)+'<span class="u">'+fU(lastQ.val)+'</span></div></div>':''}
</div>
<div class="insight">${ins}</div>
<div class="panels"><div class="panel pf"><div class="pt">BI Rate — Suku Bunga Acuan</div><div class="ps">Triwulanan, 2020–sekarang. Sumber: Bank Indonesia.</div><div class="cw"><canvas id="cBIRate" height="260"></canvas></div></div></div>
<div class="panels"><div class="panel"><div class="pt">QRIS — Volume Transaksi (ribu)</div><div class="cw"><canvas id="cQrisVol" height="260"></canvas></div></div><div class="panel"><div class="pt">QRIS — Nilai Transaksi (Rp Juta)</div><div class="cw"><canvas id="cQrisVal" height="260"></canvas></div></div></div>
<div class="panel pf"><div class="pt">Rincian QRIS per Kuartal</div><div class="tw">${qrisTbl()}</div></div></div>`;
}
function qrisTbl(){if(!D.qris.length)return'';let h='<table class="dt"><thead><tr><th>Periode</th><th>Volume (ribu trx)</th><th>QoQ Volume</th><th>Nilai (Rp Juta)</th><th>QoQ Nilai</th></tr></thead><tbody>';[...D.qris].reverse().forEach((r,i,arr)=>{const prev=arr[i+1];const vg=prev&&prev.vol>0?((r.vol-prev.vol)/prev.vol*100):null;const ng=prev&&prev.val>0?((r.val-prev.val)/prev.val*100):null;h+='<tr><td>'+r.p+'</td><td>'+r.vol.toFixed(0)+'</td><td>'+(vg!==null?'<span style="color:'+(vg>=0?'var(--mint)':'var(--coral)')+'">'+(vg>=0?'+':'')+vg.toFixed(1)+'%</span>':'—')+'</td><td>'+r.val.toFixed(1)+'</td><td>'+(ng!==null?'<span style="color:'+(ng>=0?'var(--mint)':'var(--coral)')+'">'+(ng>=0?'+':'')+ng.toFixed(1)+'%</span>':'—')+'</td></tr>';});return h+'</tbody></table>';}
function drawMoneter(){
if(D.birate.length){
charts.birate=new Chart(document.getElementById('cBIRate'),{type:'line',data:{labels:D.birate.map(r=>qLabel(r.p)),datasets:[{label:'BI Rate',data:D.birate.map(r=>r.rate),borderColor:'#F5A623',backgroundColor:'#F5A62322',borderWidth:3,pointRadius:4,pointBackgroundColor:D.birate.map((r,i,a)=>i>0&&r.rate!==a[i-1].rate?'#F5A623':'#fff'),pointBorderColor:'#F5A623',pointBorderWidth:2,fill:true,tension:.25,stepped:'before'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y.toFixed(2)+'%'}}},scales:{x:{ticks:{font:{size:8},maxRotation:45},grid:{display:false}},y:{title:{display:true,text:'%',font:{size:10}},ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v+'%'},grid:{color:'#F1F5F9'}}}}});}
if(D.qris.length){
charts.qrisVol=new Chart(document.getElementById('cQrisVol'),{type:'bar',data:{labels:D.qris.map(r=>qLabel(r.p)),datasets:[{data:D.qris.map(r=>r.vol),backgroundColor:'#26C6DA',borderRadius:4,barPercentage:.7}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y.toFixed(0)+' ribu trx'}}},scales:{x:{ticks:{font:{size:9}},grid:{display:false}},y:{ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v.toLocaleString()},grid:{color:'#F1F5F9'}}}}});
charts.qrisVal=new Chart(document.getElementById('cQrisVal'),{type:'bar',data:{labels:D.qris.map(r=>qLabel(r.p)),datasets:[{data:D.qris.map(r=>r.val),backgroundColor:'#7E57C2',borderRadius:4,barPercentage:.7}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'Rp '+c.parsed.y.toFixed(1)+' Jt'}}},scales:{x:{ticks:{font:{size:9}},grid:{display:false}},y:{ticks:{font:{family:'JetBrains Mono',size:9},callback:v=>v.toLocaleString()},grid:{color:'#F1F5F9'}}}}});
}}

// ═══ EVENTS ═══
document.getElementById('subTabs').addEventListener('click',e=>{const t=e.target.dataset?.tab;if(t){tab=t;render();}});
loadAll();
</script>
